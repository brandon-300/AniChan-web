<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Genre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link rel="icon" href="https://yphxpgssdqboufbgazwi.supabase.co/storage/v1/object/public/avatars/site-logo/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;
  }
  .brand{font-weight:800;font-size:20px}
  .brand span{color:var(--accent)}
  .header-left{display:flex;align-items:center;gap:12px}
  .back-btn{
    background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;
    padding:0 8px;line-height:1;
  }
  .header-actions{display:flex;align-items:center;gap:8px}

  .menu-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:24px;color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{border-color:var(--accent);background:var(--card)}

  .nav-dropdown{
    display:none;background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    padding:16px 16px 20px;
  }
  .nav-dropdown.open{display:block}
  .nav-dropdown .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--text);
    transition:background .15s;cursor:pointer;
  }
  .nav-dropdown .nav-item:hover{background:var(--panel);color:var(--accent)}
  .nav-dropdown .nav-item .material-symbols-outlined{font-size:20px}
  .nav-dropdown .nav-divider{height:1px;background:var(--border);margin:8px 0}

  .nav-search-wrap{margin-top:8px;position:relative}
  .nav-search-wrap input{
    width:100%;padding:12px 14px 12px 44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none;
  }
  .nav-search-wrap input:focus{border-color:var(--accent)}
  .nav-search-wrap .ico{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;
    pointer-events:none;
  }

  /* Floating search overlay */
  .search-results-dropdown{
    position:fixed;
    background:#1a1a1a;
    border:1px solid var(--border);border-radius:12px;
    overflow:hidden;
    display:none;
    box-shadow:0 12px 24px rgba(0,0,0,.6);
    z-index:99999;
  }
  .search-results-dropdown.show{display:block}
  .search-result-item{
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    cursor:pointer;transition:background .15s;
  }
  .search-result-item:hover{background:var(--panel)}
  .search-thumb{
    width:42px;height:42px;border-radius:50%;object-fit:cover;
    background:var(--panel);border:1px solid var(--border);flex-shrink:0;
  }
  .search-info{flex:1;min-width:0}
  .search-info .name{font-weight:600;font-size:14px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-info .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .no-results{padding:24px 18px;text-align:center;color:var(--muted);font-size:13px;background:#1a1a1a}

  .broadcast{display:none;margin:16px;padding:14px 16px;border-radius:16px;
    background:rgba(81,218,211,.08);border:1px solid rgba(81,218,211,.25);color:#dffaf8;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:12px;align-items:flex-start}
  .broadcast.hidden{display:none}

  /* ══════════ CARD STACK ══════════ */
  .latest-section{
    width:100%;
    margin:0;
    padding:0;
  }
  .latest-section h2{
    margin:0;
    padding:20px 16px 14px;
    font-size:26px;
    font-weight:700;
    letter-spacing:0;
    color:#fff;
  }

  .release-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:0;
    padding:0 10px;
  }

  .release-card{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background-size:cover;
    background-position:center;
    background-color:#0a0a0a;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    border-radius:12px;
    overflow:hidden;
    transition:transform 0.1s ease;
  }
  .release-card:hover{
    transform:scale(1.005);
    z-index:1;
  }

  /* Full‑card soft gradient */
  .card-gradient{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,
      rgba(0,0,0,0.90) 0%,
      rgba(0,0,0,0.55) 25%,
      rgba(0,0,0,0.15) 60%,
      transparent 100%
    );
    pointer-events:none;
  }

  /* ══════════ PLAY BUTTON ══════════ */
  .play-icon-overlay{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    width: clamp(110px, 26vw, 160px);
    height: clamp(110px, 26vw, 160px);
    opacity:0;
    pointer-events:none;
    z-index:5;
    transition:opacity 0.12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-icon-overlay.show{
    opacity:1;
    transition:none;
  }
  @media (hover: hover) {
    .release-card:hover .play-icon-overlay {
      opacity:1;
      transition:opacity 0.15s ease;
    }
  }

  /* Bottom‑aligned text row */
  .card-bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:14px 12px 14px 16px;
    background:transparent;
    z-index:2;
  }

  .card-title-text{
    color:#fff;
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 0%;
    min-width:0;
    max-width:100%;
    text-shadow:0 1px 4px rgba(0,0,0,0.8);
  }

  .card-ep-text{
    color:#fff;
    font-size:18px;
    font-weight:700;
    flex:0 0 auto;
    opacity:1;
    text-shadow:0 1px 4px rgba(0,0,0,0.8);
  }

  /* BD/DVD badge */
  .media-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    padding:3px 10px;
    border-radius:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
    z-index:3;
    display:none;
  }
  .media-badge.show{display:block}

  .empty{padding:32px 16px;text-align:center;color:var(--muted);
    border:1px dashed var(--border);border-radius:18px;background:var(--card);font-size:13px;
    margin:0 16px;}

  .pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0}
  .pagination button{padding:8px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s}
  .pagination button:disabled{opacity:.4;cursor:default}
  .pagination button:hover:not(:disabled){border-color:var(--accent);background:var(--card)}
  .page-indicator{font-size:13px;color:var(--muted);min-width:80px;text-align:center}

  #toTop{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;
    background:var(--accent);color:#0a2a28;font-size:20px;font-weight:800;
    box-shadow:0 12px 28px rgba(81,218,211,.30);opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:40;transform:translateY(20px)}
  #toTop.visible{opacity:1;pointer-events:auto;transform:translateY(0)}

  footer{padding:30px 0 80px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <header class="app">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="brand">Ani<span>Chan</span></div>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- Hamburger inserted by JS -->
    </div>
  </header>

  <div class="nav-dropdown" id="navDropdown">
    <div class="nav-item" id="navHome"><span class="material-symbols-outlined">home</span> Home</div>
    <div class="nav-item" id="navAnime"><span class="material-symbols-outlined">library_books</span> Anime</div>
    <div class="nav-search-wrap" id="navSearchWrap">
      <span class="ico material-symbols-outlined">search</span>
      <input type="text" id="navSearchInput" placeholder="Search" autocomplete="off" />
    </div>
  </div>

  <div class="search-results-dropdown" id="searchResultsDropdown"></div>

  <div class="broadcast hidden" id="broadcast">
    <span class="material-symbols-outlined" style="font-size:20px">campaign</span>
    <div style="font-size:14px;line-height:1.45" id="broadcastMsg"></div>
  </div>

  <main>
    <div class="latest-section">
      <h2 id="pageTitle">Anime by Genre</h2>
      <div class="release-list" id="releaseList"></div>
      <div class="pagination" id="paginationControls" style="display:none;">
        <button id="prevPageBtn">← Previous</button>
        <span class="page-indicator" id="pageIndicator">1 / 1</span>
        <button id="nextPageBtn">Next →</button>
      </div>
    </div>
  </main>

  <button id="toTop" aria-label="Scroll to top">↑</button>

  <footer>AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="#1a1a1a"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle" dominant-baseline="middle">No image</text></svg>');
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>');

  const ITEMS_PER_PAGE = 26;
  let library = [];
  let currentPage = 1;
  let searchLibrary = [];

  const params = new URLSearchParams(window.location.search);
  const genre = params.get('genre');
  if (!genre) { alert('No genre specified'); history.back(); return; }
  $('pageTitle').textContent = `Genre: ${genre}`;

  // ═══════════════════════════════════════════
  //  LIVE SUSPENSION + DELETION CHECK (10 sec)
  // ═══════════════════════════════════════════
  setInterval(async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) return;
    const { data } = await sb
      .from('profiles')
      .select('is_suspended, suspended_until, admin_note, is_pending_delete, deleted_at')
      .eq('id', session.user.id)
      .maybeSingle();

    if (data?.is_suspended && data.suspended_until && new Date(data.suspended_until) > new Date()) {
      alert(`Your account has been suspended.\n\n${data.admin_note || ''}`);
      await sb.auth.signOut();
      window.location.href = 'user_login.html';
      return;
    }

    if (data?.is_pending_delete && data.deleted_at) {
      alert(`Your account has been scheduled for deletion.\n\n${data.admin_note || ''}`);
      await sb.auth.signOut();
      window.location.href = 'user_login.html';
    }
  }, 10000);

  // ── Hamburger menu ──
  (function renderHamburger() {
    const container = $("headerActions");
    const menuBtn = document.createElement("button");
    menuBtn.className = "menu-btn";
    menuBtn.innerHTML = '<span class="material-symbols-outlined">menu</span>';
    menuBtn.addEventListener("click", () => {
      $("navDropdown").classList.toggle("open");
    });
    container.appendChild(menuBtn);
  })();

  $("navHome").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "index.html"; });
  $("navAnime").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "anime.html"; });

  // ── Live search ──
  const navSearchInput = $("navSearchInput");
  const searchResultsDropdown = $("searchResultsDropdown");
  const MAX_RESULTS = 15;

  function positionDropdown() {
    const rect = navSearchInput.getBoundingClientRect();
    searchResultsDropdown.style.top = (rect.bottom + 4) + 'px';
    searchResultsDropdown.style.left = rect.left + 'px';
    searchResultsDropdown.style.width = rect.width + 'px';
    const spaceBelow = window.innerHeight - rect.bottom - 8;
    searchResultsDropdown.style.maxHeight = spaceBelow + 'px';
  }
  function hideSearchResults() {
    searchResultsDropdown.classList.remove("show");
    searchResultsDropdown.innerHTML = '';
  }

  function performSearch(query) {
    searchResultsDropdown.innerHTML = '';
    const q = query.trim();
    if (!q || searchLibrary.length === 0) { hideSearchResults(); return; }

    const lowerQ = q.toLowerCase();
    const words = lowerQ.split(/\s+/).filter(Boolean);
    if (words.length === 0) { hideSearchResults(); return; }

    const scored = searchLibrary.map(a => {
      const fields = [a.title, a.title_en, a.title_jp, a.title_zh, a.title_de, a.title_fr].filter(f => f);
      let matchCount = 0;
      for (const word of words) {
        if (fields.some(f => f.toLowerCase().includes(word))) matchCount++;
      }
      if (words.length === 1 && matchCount === 0) return null;
      if (words.length > 1 && matchCount < 2) return null;

      let score = matchCount;
      for (const f of fields) {
        if (f.toLowerCase().startsWith(lowerQ)) { score += 200; break; }
      }
      if (score < 200) {
        for (const f of fields) {
          if (f.toLowerCase().includes(lowerQ)) { score += 100; break; }
        }
      }
      return { anime: a, score };
    }).filter(Boolean);

    if (scored.length === 0) {
      const noRes = document.createElement("div");
      noRes.className = "no-results";
      noRes.textContent = "No results found";
      searchResultsDropdown.appendChild(noRes);
      positionDropdown();
      searchResultsDropdown.classList.add("show");
      return;
    }

    const matches = scored.sort((a,b) => b.score - a.score).slice(0, MAX_RESULTS).map(s => s.anime);
    matches.forEach(a => {
      const item = document.createElement("div");
      item.className = "search-result-item";
      item.innerHTML = `
        <img class="search-thumb" src="${a.image_url || ''}" onerror="this.style.display='none'" />
        <div class="search-info">
          <div class="name">${a.title || "Untitled"}</div>
          <div class="meta">${[a.type, a.year, a.ep_total ? a.ep_total + ' eps' : ''].filter(Boolean).join(" · ")}</div>
        </div>`;
      item.addEventListener("click", () => {
        hideSearchResults();
        navSearchInput.value = '';
        $("navDropdown").classList.remove("open");
        location.href = `anime_info.html?id=${a.id}`;
      });
      searchResultsDropdown.appendChild(item);
    });
    positionDropdown();
    searchResultsDropdown.classList.add("show");
  }

  navSearchInput.addEventListener("input", () => performSearch(navSearchInput.value));
  navSearchInput.addEventListener("focus", () => { if (navSearchInput.value.trim()) performSearch(navSearchInput.value); });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#navSearchWrap") && !e.target.closest("#searchResultsDropdown")) hideSearchResults();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideSearchResults(); });
  window.addEventListener("scroll", () => { if (searchResultsDropdown.classList.contains("show")) positionDropdown(); }, { passive: true });
  window.addEventListener("resize", () => { if (searchResultsDropdown.classList.contains("show")) positionDropdown(); });

  // ── Broadcast ──
  async function loadBroadcast() {
    const { data } = await sb.from("settings").select("value").eq("key","broadcast_message").maybeSingle();
    const msg = (data && data.value || "").trim();
    if (msg) { $("broadcastMsg").textContent = msg; $("broadcast").classList.remove("hidden"); }
    else { $("broadcast").classList.add("hidden"); }
  }

  // ── Scroll to top ──
  let lastScrollY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const btn = $("toTop");
    if (y < lastScrollY && y > 200) btn.classList.add("visible");
    else if (y <= 200) btn.classList.remove("visible");
    else if (y > lastScrollY) btn.classList.remove("visible");
    lastScrollY = y;
  }, { passive: true });
  $("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  // ── Genre data ──
  async function loadGenreAnime() {
    const { data, error } = await sb
      .from('anime')
      .select('*')
      .contains('genres', [genre])
      .order('aired_from', { ascending: false })
      .order('title', { ascending: true });
    library = error ? [] : (data || []);
    currentPage = 1;
    renderList();
  }

  (async function preloadSearch() {
    const { data } = await sb.from("anime").select("id, title, title_en, title_jp, title_zh, title_de, title_fr, image_url, type, year, ep_total");
    searchLibrary = data || [];
  })();

  function clearAllPlayIcons() {
    document.querySelectorAll('.play-icon-overlay.show').forEach(icon => icon.classList.remove('show'));
  }

  const PLAY_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%"><polygon points="6,2 20,12 6,22" fill="white" opacity="0.45"/></svg>';

  let navTimeout = null;
  function scheduleNav(href) {
    if (navTimeout) clearTimeout(navTimeout);
    navTimeout = setTimeout(() => {
      navTimeout = null;
      location.href = href;
    }, 150);
  }

  window.addEventListener('pagehide', clearAllPlayIcons);

  function renderList() {
    const list = $('releaseList');
    const totalItems = library.length;
    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages || 1;
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = library.slice(start, start + ITEMS_PER_PAGE);

    list.innerHTML = '';
    if (!pageItems.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No anime found for this genre.';
      list.appendChild(e);
    } else {
      for (const a of pageItems) {
        const card = document.createElement('a');
        card.className = 'release-card';
        card.href = `anime_info.html?id=${a.id}`;
        card.style.backgroundImage = `url('${a.image_url || PLACEHOLDER}')`;

        const gradient = document.createElement("div");
        gradient.className = "card-gradient";
        card.appendChild(gradient);

        const mediaBadge = document.createElement('span');
        mediaBadge.className = 'media-badge';
        if (a.release_type) {
          mediaBadge.textContent = a.release_type;
          mediaBadge.classList.add('show');
        }
        card.appendChild(mediaBadge);

        const playIcon = document.createElement("div");
        playIcon.className = "play-icon-overlay";
        playIcon.innerHTML = PLAY_ICON_SVG;
        card.appendChild(playIcon);

        const bottomBar = document.createElement('div');
        bottomBar.className = 'card-bottom';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'card-title-text';
        titleSpan.textContent = a.title || 'Untitled';

        const epSpan = document.createElement('span');
        epSpan.className = 'card-ep-text';
        epSpan.textContent = a.ep_total != null ? a.ep_total : '?';

        bottomBar.appendChild(titleSpan);
        bottomBar.appendChild(epSpan);
        card.appendChild(bottomBar);

        // Play button behavior – identical to index page
        let touchStartX = 0, touchStartY = 0, touchWasScroll = false, wasTouch = false;
        card.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchWasScroll = false;
        }, { passive: true });
        card.addEventListener('touchmove', (e) => {
          const dx = Math.abs(e.touches[0].clientX - touchStartX);
          const dy = Math.abs(e.touches[0].clientY - touchStartY);
          if (dx > 8 || dy > 8) touchWasScroll = true;
        }, { passive: true });
        card.addEventListener('touchend', (e) => {
          if (touchWasScroll) return;
          wasTouch = true;
          clearAllPlayIcons();
          playIcon.classList.add('show');
          scheduleNav(card.href);
        }, { passive: true });
        card.addEventListener('click', (e) => {
          if (wasTouch) { wasTouch = false; return; }
          e.preventDefault();
          clearAllPlayIcons();
          playIcon.classList.add('show');
          scheduleNav(card.href);
        });

        list.appendChild(card);
      }
    }

    const pagination = $('paginationControls');
    const prevBtn = $('prevPageBtn');
    const nextBtn = $('nextPageBtn');
    const indicator = $('pageIndicator');
    if (totalPages <= 1) { pagination.style.display = 'none'; }
    else {
      pagination.style.display = 'flex';
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      indicator.textContent = `${currentPage} / ${totalPages}`;
    }
  }

  $('prevPageBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderList(); } });
  $('nextPageBtn').addEventListener('click', () => {
    const totalPages = Math.ceil(library.length / ITEMS_PER_PAGE);
    if (currentPage < totalPages) { currentPage++; renderList(); }
  });

  loadGenreAnime();
  loadBroadcast();
})();
</script>
</body>
</html>
