<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan Admin · Login</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    10%,30%,50%,70%,90% { transform: translateX(-4px); }
    20%,40%,60%,80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.5s ease-in-out; }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-5 relative overflow-hidden">

  <!-- Background radial gradients -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent/10 blur-3xl"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[400px] h-[400px] rounded-full bg-accent/5 blur-3xl"></div>
  </div>

  <!-- Login card -->
  <div class="relative z-10 w-full max-w-md bg-card/70 glass border border-border rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="font-extrabold text-3xl tracking-tight mb-1">Ani<span class="text-accent">Chan</span></div>
      <div class="w-10 h-1 bg-accent mx-auto rounded-full mt-3"></div>
    </div>

    <h1 class="text-xl font-bold text-center mb-6">Admin Login</h1>

    <!-- Email -->
    <div class="mb-4">
      <label class="text-xs text-muted mb-1.5 block">Email</label>
      <input id="adminEmail" type="email" autocomplete="email" placeholder="admin@email.com"
             class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
    </div>

    <!-- Password -->
    <div class="mb-4 relative">
      <label class="text-xs text-muted mb-1.5 block">Password</label>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="••••••••"
             class="w-full p-3 pr-12 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
      <button id="revealBtn" class="absolute right-3 top-[38px] text-muted hover:text-white transition">
        <span class="material-symbols-outlined text-xl">visibility</span>
      </button>
    </div>

    <!-- Error -->
    <div id="loginErr" class="text-xs text-danger mt-2 hidden"></div>

    <!-- Submit -->
    <button id="signinBtn" class="w-full mt-6 py-3 rounded-xl bg-accent text-black font-bold text-sm hover:brightness-110 active:scale-95 transition-all duration-200">
      Sign In
    </button>

    <!-- Back link -->
    <a href="index.html" class="block text-center mt-5 text-muted text-sm hover:text-white transition">← Back to Home</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const ADMIN_EMAIL = "g09649009@gmail.com";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  // Password reveal
  $("revealBtn").addEventListener("click", () => {
    const input = $("adminPassword");
    const icon = $("revealBtn").querySelector('span');
    if (input.type === "password") {
      input.type = "text";
      icon.textContent = "visibility_off";
    } else {
      input.type = "password";
      icon.textContent = "visibility";
    }
  });

  // Submit
  $("signinBtn").addEventListener("click", async () => {
    const email = $("adminEmail").value.trim();
    const password = $("adminPassword").value;
    const err = $("loginErr");
    const card = document.querySelector('.glass');

    err.classList.add("hidden");

    if (!email || !password) {
      err.textContent = "Please enter both email and password.";
      err.classList.remove("hidden");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);
      return;
    }
    if (email.toLowerCase() !== ADMIN_EMAIL) {
      err.textContent = "This email is not authorized for admin access.";
      err.classList.remove("hidden");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);
      return;
    }

    // Scale down effect
    $("signinBtn").style.transform = "scale(0.96)";
    setTimeout(() => $("signinBtn").style.transform = "", 150);

    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      // Fade-out on success
      card.style.opacity = "0";
      card.style.transform = "scale(0.95)";
      card.style.transition = "opacity 0.3s, transform 0.3s";
      setTimeout(() => { window.location.href = "admin.html"; }, 300);
    } catch (e) {
      err.textContent = e.message || "Login failed.";
      err.classList.remove("hidden");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);
    }
  });

  // Submit on Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("signinBtn").click();
  });
})();
</script>
</body>
</html>
