<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan Admin · Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .bg-glow{
    position:absolute;inset:0;z-index:0;
  }
  .bg-glow::before,
  .bg-glow::after{
    content:'';position:absolute;border-radius:50%;
    filter:blur(80px);opacity:0.15;
  }
  .bg-glow::before{
    width:500px;height:500px;background:var(--accent);
    top:-20%;left:-10%;
  }
  .bg-glow::after{
    width:400px;height:400px;background:var(--accent);
    bottom:-20%;right:-10%;opacity:0.08;
  }
  .login-card{
    position:relative;z-index:1;width:100%;max-width:420px;
    background:rgba(26,26,26,.70);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:24px;padding:32px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .login-card h1{
    font-size:26px;font-weight:800;text-align:center;margin-bottom:20px;
    letter-spacing:-0.3px;
  }
  .login-card h1 span{color:var(--accent)}
  .accent-line{
    width:48px;height:3px;background:var(--accent);margin:8px auto 28px;
    border-radius:2px;
  }
  .field{margin-bottom:20px;position:relative}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field input{
    width:100%;padding:14px 14px 14px 44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:15px;outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent)}
  .field .icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:20px;color:var(--muted);pointer-events:none;
    z-index:1;
  }
  /* Adjust for the password field: the icon is inside .field, before .pwd-wrap */
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:48px}
  .pwd-wrap .reveal{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);font-size:20px;
    cursor:pointer;padding:4px;line-height:1;
  }
  .pwd-wrap .reveal:hover{color:var(--text)}
  .signin-btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--accent);color:#0a2a28;font-size:15px;font-weight:700;
    cursor:pointer;transition:filter .15s,opacity .15s;
    margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .signin-btn:hover{filter:brightness(1.08)}
  .signin-btn:active{transform:scale(.97)}
  .signin-btn:disabled{opacity:.7;cursor:not-allowed;filter:none}
  .err-msg{
    font-size:13px;color:var(--danger);margin-top:12px;text-align:center;
    display:none;
  }
  .err-msg.show{display:block}
  .back-link{
    display:block;text-align:center;margin-top:24px;font-size:14px;
    color:var(--muted);text-decoration:none;transition:color .15s;
  }
  .back-link:hover{color:var(--text)}

  /* Loading spinner */
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-spinner{
    width:20px;height:20px;border:2px solid transparent;
    border-top-color:#0a2a28;border-radius:50%;animation:spin .7s linear infinite;
    display:inline-block;
  }

  /* Shake animation */
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    10%,30%,50%,70%,90%{transform:translateX(-4px)}
    20%,40%,60%,80%{transform:translateX(4px)}
  }
  .shake{animation:shake .5s ease-in-out}
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-card" id="loginCard">
    <h1>Ani<span>Chan</span></h1>
    <div class="accent-line"></div>

    <div class="field">
      <span class="icon material-symbols-outlined">person</span>
      <input type="email" id="adminEmail" placeholder="Admin email" autocomplete="email" />
    </div>

    <div class="field">
      <span class="icon material-symbols-outlined">lock</span>
      <div class="pwd-wrap">
        <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" />
        <button type="button" class="reveal" id="revealBtn"><span class="material-symbols-outlined">visibility</span></button>
      </div>
    </div>

    <div class="err-msg" id="loginErr"></div>

    <button class="signin-btn" id="signinBtn">
      <span id="signinBtnText">Sign In</span>
    </button>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const ADMIN_EMAIL = "g09649009@gmail.com";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  // Password reveal toggle
  $("revealBtn").addEventListener("click", () => {
    const input = $("adminPassword");
    const icon = $("revealBtn").querySelector('span');
    if (input.type === "password") {
      input.type = "text";
      icon.textContent = "visibility_off";
    } else {
      input.type = "password";
      icon.textContent = "visibility";
    }
  });

  // Sign in with loading state
  $("signinBtn").addEventListener("click", async () => {
    const email = $("adminEmail").value.trim();
    const password = $("adminPassword").value;
    const err = $("loginErr");
    const card = $("loginCard");
    const btn = $("signinBtn");
    const btnText = $("signinBtnText");

    err.classList.remove("show");

    if (!email || !password) {
      err.textContent = "Please enter both email and password.";
      err.classList.add("show");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);
      return;
    }
    if (email.toLowerCase() !== ADMIN_EMAIL) {
      err.textContent = "This email is not authorized for admin access.";
      err.classList.add("show");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);
      return;
    }

    // Show loading state
    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span> Logging in…';

    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      // Fade-out on success
      card.style.opacity = "0";
      card.style.transform = "scale(0.95)";
      card.style.transition = "opacity 0.3s, transform 0.3s";
      setTimeout(() => { window.location.href = "admin.html"; }, 300);
    } catch (e) {
      err.textContent = e.message || "Login failed.";
      err.classList.add("show");
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 500);

      // Restore button
      btn.disabled = false;
      btnText.textContent = "Sign In";
    }
  });

  // Submit on Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("signinBtn").click();
  });
})();
</script>
</body>
</html>
