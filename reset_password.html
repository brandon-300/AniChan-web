<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Reset Password</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .strength-bar {
    width: 100%; height: 6px; border-radius: 3px; background: #333;
    transition: background 0.3s;
  }
  .strength-bar.active { background: #51dad3; }
  .rule-icon { font-size: 18px; margin-right: 6px; }
  .rule-icon.pass { color: #2ed573; }
  .rule-icon.fail { color: #666; }
  .progress-ring { transform: rotate(-90deg); }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-5 relative overflow-hidden">

  <!-- Background radial gradients and tech pattern -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent/10 blur-3xl"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[400px] h-[400px] rounded-full bg-accent/5 blur-3xl"></div>
    <!-- subtle grid pattern -->
    <div class="absolute inset-0 opacity-5" style="background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px;"></div>
  </div>

  <!-- Reset card -->
  <div class="relative z-10 w-full max-w-md bg-card/70 glass border border-border rounded-3xl p-8 shadow-2xl">
    <h2 class="text-xl font-bold text-center mb-6">Set new password</h2>

    <!-- New password -->
    <div class="mb-4">
      <label for="newPassword" class="text-xs text-muted mb-1.5 block">New password</label>
      <input id="newPassword" type="password" placeholder="••••••••"
             class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
    </div>

    <!-- Strength meter (4 bars) -->
    <div class="flex gap-1.5 mb-2">
      <div id="bar1" class="strength-bar"></div>
      <div id="bar2" class="strength-bar"></div>
      <div id="bar3" class="strength-bar"></div>
      <div id="bar4" class="strength-bar"></div>
    </div>

    <!-- Rule checklist -->
    <div class="mb-4 space-y-1 text-xs">
      <div id="ruleLength" class="flex items-center"><span class="material-symbols-outlined rule-icon fail">radio_button_unchecked</span> At least 8 characters</div>
      <div id="ruleLetter" class="flex items-center"><span class="material-symbols-outlined rule-icon fail">radio_button_unchecked</span> Contains a letter</div>
      <div id="ruleNumber" class="flex items-center"><span class="material-symbols-outlined rule-icon fail">radio_button_unchecked</span> Contains a number</div>
      <div id="ruleSpecial" class="flex items-center"><span class="material-symbols-outlined rule-icon fail">radio_button_unchecked</span> Contains a special character</div>
    </div>

    <!-- Confirm password -->
    <div class="mb-4">
      <label for="confirmPassword" class="text-xs text-muted mb-1.5 block">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="••••••••"
             class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
    </div>

    <!-- Match error -->
    <div id="matchErr" class="text-xs text-danger mb-3 hidden flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">error</span> Passwords do not match
    </div>

    <!-- Error / Success messages -->
    <div id="err" class="text-xs text-danger mb-3 hidden"></div>
    <div id="success" class="text-xs text-accent mb-3 hidden"></div>

    <!-- Submit button -->
    <button id="resetBtn" disabled class="w-full py-3 rounded-xl bg-accent text-black font-bold text-sm hover:brightness-110 active:scale-95 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed">
      Reset password
    </button>

    <!-- Back to home -->
    <a href="index.html" class="block text-center mt-5 text-muted text-sm hover:text-white transition">← Back to Home</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const newPw = $("newPassword");
  const confirmPw = $("confirmPassword");
  const matchErr = $("matchErr");
  const resetBtn = $("resetBtn");

  // Password strength rules
  function updateStrength() {
    const pw = newPw.value;
    const rules = {
      length: pw.length >= 8,
      letter: /[a-zA-Z]/.test(pw),
      number: /[0-9]/.test(pw),
      special: /[^a-zA-Z0-9]/.test(pw)
    };

    // Update rule icons
    Object.entries(rules).forEach(([rule, passed]) => {
      const el = $(`rule${rule.charAt(0).toUpperCase() + rule.slice(1)}`);
      if (el) {
        const icon = el.querySelector('span');
        if (passed) {
          icon.textContent = 'check_circle';
          icon.classList.add('pass');
          icon.classList.remove('fail');
        } else {
          icon.textContent = 'radio_button_unchecked';
          icon.classList.add('fail');
          icon.classList.remove('pass');
        }
      }
    });

    // Strength bars
    const score = Object.values(rules).filter(Boolean).length;
    for (let i = 1; i <= 4; i++) {
      const bar = $(`bar${i}`);
      if (bar) {
        bar.classList.toggle('active', i <= score);
      }
    }

    // Enable button only when password is strong and matches
    const isStrong = Object.values(rules).every(v => v);
    const matches = newPw.value === confirmPw.value && newPw.value.length > 0;
    resetBtn.disabled = !(isStrong && matches);
    matchErr.classList.toggle('hidden', matches || confirmPw.value.length === 0);
  }

  newPw.addEventListener('input', updateStrength);
  confirmPw.addEventListener('input', updateStrength);

  // Reset password
  resetBtn.addEventListener("click", async () => {
    const pw = newPw.value;
    const confirm = confirmPw.value;
    const err = $("err");
    const success = $("success");

    err.classList.add("hidden");
    success.classList.add("hidden");

    if (pw !== confirm) {
      matchErr.classList.remove("hidden");
      return;
    }

    if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw) || !/[^a-zA-Z0-9]/.test(pw)) {
      err.textContent = "Password must be at least 8 characters with 1 letter, 1 number, and 1 special character.";
      err.classList.remove("hidden");
      return;
    }

    try {
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) throw error;

      // Success state
      success.textContent = "Password reset successfully! Redirecting to home...";
      success.classList.remove("hidden");
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Done!';

      // Countdown redirect after 5 seconds
      setTimeout(() => {
        window.location.href = "index.html";
      }, 5000);

    } catch (e) {
      err.textContent = e.message || "Reset failed. The link may have expired.";
      err.classList.remove("hidden");
    }
  });

  // Submit on Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !resetBtn.disabled) resetBtn.click();
  });
})();
</script>
</body>
</html>
