<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0d0d; --card:#161616; --panel:#1a1a1a;
    --accent:#1db9b2; --danger:#ff4757;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#222;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:28px 24px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  h2{font-size:20px;margin-bottom:20px;text-align:center;color:var(--text)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input{
    width:100%;padding:12px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:var(--accent)}
  .err-msg{font-size:12px;color:var(--danger);margin-top:8px;display:none}
  .err-msg.show{display:block}
  .success-msg{font-size:12px;color:var(--accent);margin-top:8px;display:none}
  .success-msg.show{display:block}
  .submit-btn{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--accent);color:#062525;font-size:15px;font-weight:700;
    margin-top:8px;cursor:pointer;transition:filter .15s ease;
  }
  .submit-btn:hover{filter:brightness(1.05)}
  .back-link{
    display:block;text-align:center;margin-top:20px;
    font-size:13px;color:var(--muted);text-decoration:none;
  }
  .back-link:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="card">
    <h2>Reset your password</h2>
    <div class="field">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="••••••••" />
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" />
    </div>
    <div class="err-msg" id="err"></div>
    <div class="success-msg" id="success"></div>
    <button class="submit-btn" id="resetBtn">Reset password</button>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  // On page load, Supabase will automatically pick up the access_token from the URL hash
  // and set the session, making the user authenticated.
  // We don't need to manually parse the hash.

  $("resetBtn").addEventListener("click", async () => {
    const newPw = $("newPassword").value;
    const confirmPw = $("confirmPassword").value;
    const err = $("err");
    const success = $("success");
    err.classList.remove("show");
    success.classList.remove("show");

    if (!newPw || !confirmPw) {
      err.textContent = "Please fill in both fields.";
      err.classList.add("show");
      return;
    }
    if (newPw !== confirmPw) {
      err.textContent = "Passwords do not match.";
      err.classList.add("show");
      return;
    }
    // Enforce the same password rules as signup
    if (newPw.length < 8 || !/[a-zA-Z]/.test(newPw) || !/[0-9]/.test(newPw) || !/[^a-zA-Z0-9]/.test(newPw)) {
      err.textContent = "Password must be at least 8 characters with 1 letter, 1 number, and 1 special character.";
      err.classList.add("show");
      return;
    }

    try {
      const { error } = await supabase.auth.updateUser({ password: newPw });
      if (error) throw error;
      success.textContent = "Password reset successfully! Redirecting to home...";
      success.classList.add("show");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 5000);
    } catch (e) {
      err.textContent = e.message || "Reset failed. The link may have expired.";
      err.classList.add("show");
    }
  });

  // Submit on Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("resetBtn").click();
  });
})();
</script>
</body>
</html>
