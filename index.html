<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan</title>
<meta name="description" content="Your personal anime tracker and library." />
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  /* Tailwind custom config */
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          accent2: '#ffb597',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757'
        }
      }
    }
  }
  /* Extra custom styles */
  .shelf::-webkit-scrollbar { display: none; }
  .shelf { scrollbar-width: none; }
  .glass { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .toast {
    background: #062525; color: #dffaf8; border: 1px solid rgba(81,218,211,0.4);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; opacity: 0;
    pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateY(20px);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body class="bg-dark text-white font-sans">

  <!-- Offline banner -->
  <div id="offline" role="status" class="sticky top-0 z-60 bg-danger text-white text-center text-sm py-2 hidden">You're offline — live API features disabled.</div>

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-dark/85 glass border-b border-border" :class="{'top-8': offline.show}">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between py-5">
      <div class="flex items-center gap-3">
        <img id="siteLogo" src="" alt="Logo" class="w-9 h-9 rounded-full object-cover bg-panel" />
        <div class="font-extrabold text-2xl tracking-tight">
          Ani<span class="text-accent">Chan</span>
        </div>
      </div>
      <div id="headerActions" class="flex items-center gap-2 flex-wrap">
        <!-- Populated by JS -->
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 pb-20">
    <!-- Broadcast -->
    <div id="broadcast" class="hidden my-4 p-4 rounded-2xl bg-gradient-to-r from-accent/10 to-accent/5 border border-accent/30 text-accent/90 flex gap-3 items-start">
      <span class="material-symbols-outlined text-xl">campaign</span>
      <div class="text-sm leading-relaxed flex-1" id="broadcastMsg"></div>
      <button onclick="document.getElementById('broadcast').classList.add('hidden')" class="text-muted hover:text-white">✕</button>
    </div>

    <!-- Search -->
    <div class="relative my-4">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted text-lg">search</span>
      <input id="searchInput" type="text" :placeholder="t('searchPlaceholder')" autocomplete="off"
             class="w-full pl-10 pr-4 py-3 rounded-xl bg-card border border-border text-white text-sm outline-none focus:border-accent transition-colors" />
    </div>

    <!-- Sections -->
    <div class="flex flex-col gap-6 mt-6">
      <!-- Currently Airing -->
      <section>
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="text-base uppercase tracking-wider text-gray-300 font-semibold" id="currentlyAiringHeading">Currently Airing</h2>
          <small class="text-muted text-xs" id="airingNote">via Jikan</small>
        </div>
        <div class="shelf flex gap-3 overflow-x-auto pb-1 snap-x snap-mandatory" id="airingShelf">
          <div class="text-center py-10 text-muted w-full">Loading airing anime…</div>
        </div>
      </section>

      <!-- My Collection -->
      <section>
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="text-base uppercase tracking-wider text-gray-300 font-semibold" id="myCollectionHeading">My Collection</h2>
          <small class="text-muted text-xs" id="collectionCount">0 saved</small>
        </div>
        <div class="grid grid-cols-2 gap-3.5" id="collectionGrid"></div>
        <div class="flex justify-center items-center gap-3 mt-5" id="paginationControls" style="display:none;">
          <button id="prevPageBtn" class="px-5 py-2 rounded-full bg-panel border border-border text-white font-semibold text-xs hover:border-accent hover:bg-card transition disabled:opacity-40" disabled>← Previous</button>
          <span class="text-muted text-xs min-w-[5rem] text-center" id="pageIndicator">1 / 1</span>
          <button id="nextPageBtn" class="px-5 py-2 rounded-full bg-panel border border-border text-white font-semibold text-xs hover:border-accent hover:bg-card transition disabled:opacity-40">Next →</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Back to top -->
  <button id="toTop" aria-label="Scroll to top"
          class="fixed right-5 bottom-5 w-11 h-11 rounded-full bg-accent text-black font-extrabold text-xl shadow-lg shadow-accent/30 opacity-0 pointer-events-none transition-all duration-300 translate-y-5 z-40">
    ↑
  </button>

  <!-- Messages Modal -->
  <div id="messagesModal" aria-hidden="true"
       class="fixed inset-0 z-80 hidden items-center justify-center p-5 bg-black/60 glass">
    <div class="bg-card border border-border rounded-2xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto shadow-2xl" role="dialog" aria-modal="true">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-xl font-bold" id="messagesModalTitle">Messages</h3>
        <button id="messagesModalClose" aria-label="Close" class="text-muted text-2xl leading-none">×</button>
      </div>
      <div id="messagesList"></div>
    </div>
  </div>

  <footer class="text-center text-muted text-xs py-10">AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="#1a1a1a"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle" dominant-baseline="middle">No image</text></svg>');

  const ITEMS_PER_PAGE = 26;
  let library = [];
  let currentSession = null;
  let currentPage = 1;
  let currentSearch = "";

  // Apply translations
  $("offline").textContent = t("offline");
  $("searchInput").placeholder = t("searchPlaceholder");
  $("currentlyAiringHeading").textContent = t("currentlyAiring");
  $("airingNote").textContent = t("viaJikan");
  $("myCollectionHeading").textContent = t("myCollection");
  $("prevPageBtn").textContent = t("previous");
  $("nextPageBtn").textContent = t("next");
  $("messagesModalTitle").textContent = t("messages");
  $("toTop").textContent = t("backToTop");

  // Back-to-top smart toggle
  let lastScrollY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const btn = $("toTop");
    if (y < lastScrollY && y > 200) btn.classList.add("visible");
    else if (y <= 200) btn.classList.remove("visible");
    else if (y > lastScrollY) btn.classList.remove("visible");
    lastScrollY = y;
  }, { passive: true });
  $("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  // Offline handling
  function syncOffline(){ $("offline").classList.toggle("hidden", !navigator.onLine); }
  window.addEventListener("online", () => setTimeout(() => location.reload(), 1000));

  // Site logo
  async function loadSiteLogo() {
    try {
      const { data, error } = await sb.from("settings").select("value").eq("key","site_logo").maybeSingle();
      if (error) return;
      const url = data?.value || "";
      const img = $("siteLogo");
      if (url) {
        img.src = url + '?t=' + Date.now();
        img.style.display = "block";
      } else {
        img.style.display = "none";
      }
    } catch(e) { console.warn("Logo load error", e); }
  }

  // User avatar
  async function getUserAvatar() {
    if (!currentSession) return null;
    const { data, error } = await sb.from("profiles").select("avatar_url").eq("id", currentSession.user.id).maybeSingle();
    return data?.avatar_url || null;
  }

  // Header
  async function renderHeader() {
    const container = $("headerActions");
    container.innerHTML = '';
    if (currentSession) {
      const avatarUrl = await getUserAvatar();
      const avatarHtml = avatarUrl
        ? `<img class="w-9 h-9 rounded-full object-cover cursor-pointer border-2 border-border hover:border-accent transition" src="${avatarUrl}" alt="Profile" title="View Profile" />`
        : `<div class="w-9 h-9 rounded-full bg-panel flex items-center justify-center text-muted cursor-pointer border-2 border-border hover:border-accent transition" title="View Profile"><span class="material-symbols-outlined text-xl">person</span></div>`;
      container.innerHTML = `
        <button class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent transition" id="findFriendsBtn">${t("findFriends")}</button>
        <button class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent transition" id="messagesBtn">💬 ${t("messages")}</button>
        ${avatarHtml}
      `;
      $("findFriendsBtn").addEventListener("click", () => location.href = "find_friends.html");
      $("messagesBtn").addEventListener("click", () => openMessagesModal());
      const avatarEl = container.querySelector(".w-9");
      if (avatarEl) avatarEl.addEventListener("click", () => location.href = "profile.html");
    } else {
      container.innerHTML = `
        <button class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent transition" id="adminBtn">${t("admin")}</button>
        <button class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-accent text-black border-transparent hover:brightness-110 transition" id="loginBtn">${t("login")}</button>
      `;
      $("adminBtn").onclick = () => location.href = "admin_login.html";
      $("loginBtn").onclick = () => location.href = "user_login.html";
    }
  }

  // Broadcast
  async function renderBroadcast() {
    const el = $("broadcast");
    const { data } = await sb.from("settings").select("value").eq("key","broadcast_message").maybeSingle();
    const msg = (data && data.value || "").trim();
    if (msg) {
      $("broadcastMsg").textContent = msg;
      el.classList.remove("hidden");
    } else {
      el.classList.add("hidden");
    }
  }

  // Collection rendering
  function renderCollection() {
    const grid = $("collectionGrid");
    const q = currentSearch.trim().toLowerCase();
    const items = q ? library.filter(a => (a.title || "").toLowerCase().includes(q)) : library;
    const totalItems = items.length;
    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages || 1;

    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = items.slice(start, start + ITEMS_PER_PAGE);

    grid.innerHTML = "";
    $("collectionCount").textContent = library.length ? library.length + " " + t("saved") : "";

    if (!pageItems.length) {
      const e = document.createElement("div");
      e.className = "col-span-2 text-center py-8 text-muted border border-dashed border-border rounded-2xl bg-panel";
      e.textContent = library.length ? (q ? t("noMatches") : t("noItemsPage")) : t("emptyLibrary");
      grid.appendChild(e);
    } else {
      for (const a of pageItems) {
        const card = document.createElement("div");
        card.className = "bg-card border border-border rounded-2xl overflow-hidden hover:-translate-y-1 hover:border-gray-600 transition-all duration-200";
        const img = document.createElement("img");
        img.className = "aspect-[2/3] w-full object-cover bg-black";
        img.src = a.image_url || PLACEHOLDER;
        img.onerror = () => { img.src = PLACEHOLDER; };
        img.alt = a.title || "Untitled";
        const meta = document.createElement("div");
        meta.className = "p-2.5";
        const t = document.createElement("div");
        t.className = "text-sm font-semibold leading-tight line-clamp-2";
        t.textContent = a.title || "Untitled";
        meta.appendChild(t);
        card.appendChild(img);
        card.appendChild(meta);
        grid.appendChild(card);
      }
    }

    const pagination = $("paginationControls");
    const prevBtn = $("prevPageBtn");
    const nextBtn = $("nextPageBtn");
    const indicator = $("pageIndicator");
    if (totalPages <= 1) {
      pagination.style.display = "none";
    } else {
      pagination.style.display = "flex";
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      indicator.textContent = `${currentPage} / ${totalPages}`;
    }
  }

  async function loadLibrary() {
    const { data, error } = await sb.from("anime").select("*").order("created_at", { ascending: false });
    library = error ? [] : (data || []);
    currentPage = 1;
    renderCollection();
  }

  // Airing
  async function loadAiring() {
    const shelf = $("airingShelf");
    if (!navigator.onLine) {
      shelf.innerHTML = `<div class="text-center py-8 text-muted w-full">${t("offline")}</div>`;
      return;
    }
    shelf.innerHTML = `<div class="text-center py-8 text-muted w-full">${t("loadingAiring")}</div>`;

    try {
      const res = await fetch("https://api.jikan.moe/v4/seasons/now?limit=10");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const list = (data && data.data) || [];

      // Deduplicate by mal_id
      const seen = new Set();
      const unique = list.filter(a => seen.has(a.mal_id) ? false : seen.add(a.mal_id));

      shelf.innerHTML = "";
      if (!unique.length) {
        shelf.innerHTML = `<div class="text-center py-8 text-muted w-full">${t("noAiringFound")}</div>`;
        return;
      }
      for (const a of unique) {
        let title = a.title;
        if (currentLang === 'en' && a.title_english) title = a.title_english;
        else if (currentLang === 'ja' && a.title_japanese) title = a.title_japanese;

        const card = document.createElement("div");
        card.className = "flex-none w-[140px] snap-start bg-card border border-border rounded-2xl overflow-hidden hover:-translate-y-1 hover:border-gray-600 transition-all duration-200";
        const img = document.createElement("img");
        img.className = "aspect-[2/3] w-full object-cover bg-black";
        const imgSrc = (a.images?.jpg?.image_url) || (a.images?.jpg?.large_image_url) || null;
        img.src = imgSrc || PLACEHOLDER;
        img.alt = title;
        const meta = document.createElement("div");
        meta.className = "p-2.5";
        const tEl = document.createElement("div");
        tEl.className = "text-sm font-semibold leading-tight line-clamp-2";
        tEl.textContent = title;
        meta.appendChild(tEl);
        card.appendChild(img);
        card.appendChild(meta);
        shelf.appendChild(card);
      }
    } catch (err) {
      console.warn("Jikan error", err);
      shelf.innerHTML = `<div class="text-center py-8 text-muted w-full">${t("couldNotLoadAiring")}</div>`;
    }
  }

  // Pagination
  $("prevPageBtn").addEventListener("click", () => {
    if (currentPage > 1) { currentPage--; renderCollection(); }
  });
  $("nextPageBtn").addEventListener("click", () => {
    const items = currentSearch ? library.filter(a => (a.title||"").toLowerCase().includes(currentSearch)) : library;
    if (currentPage < Math.ceil(items.length / ITEMS_PER_PAGE)) { currentPage++; renderCollection(); }
  });

  $("searchInput").addEventListener("input", (e) => {
    currentSearch = e.target.value;
    currentPage = 1;
    renderCollection();
  });

  // Messages modal
  function openMessagesModal() {
    $("messagesModal").classList.add("show");
    $("messagesModal").setAttribute("aria-hidden", "false");
    loadChatRooms();
  }
  function closeMessagesModal() {
    $("messagesModal").classList.remove("show");
    $("messagesModal").setAttribute("aria-hidden", "true");
  }
  $("messagesModalClose").addEventListener("click", closeMessagesModal);
  $("messagesModal").addEventListener("click", (e) => { if (e.target.id === "messagesModal") closeMessagesModal(); });

  async function loadChatRooms() {
    const list = $("messagesList");
    list.innerHTML = "Loading...";
    if (!currentSession) return;
    const { data, error } = await sb.from("chat_rooms")
      .select(`id, last_message, last_message_time, user_one_id, user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id, username, full_name, avatar_url, is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id, username, full_name, avatar_url, is_online)`)
      .or(`user_one_id.eq.${currentSession.user.id},user_two_id.eq.${currentSession.user.id}`)
      .order('last_message_time', { ascending: false });

    if (error) { list.innerHTML = "Failed to load."; return; }
    if (!data?.length) { list.innerHTML = `<div class="text-muted py-4">${t("noConversations")}</div>`; return; }

    list.innerHTML = "";
    data.forEach(room => {
      const isUserOne = room.user_one_id === currentSession.user.id;
      const partner = isUserOne ? room.user_two : room.user_one;
      const div = document.createElement("div");
      div.className = "flex items-center gap-3 py-2 border-b border-border cursor-pointer hover:bg-panel transition";
      div.innerHTML = `
        <img class="w-8 h-8 rounded-full object-cover" src="${partner.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm">${partner.full_name || partner.username}</div>
          <div class="text-xs text-muted truncate">${room.last_message || ""}</div>
        </div>
        <div class="text-xs text-muted">${formatChatTime(room.last_message_time)}</div>`;
      div.addEventListener("click", () => { closeMessagesModal(); location.href = "chat.html?room=" + room.id; });
      list.appendChild(div);
    });
  }

  function formatChatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    if (now - d < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    return d.toLocaleDateString();
  }

  // Init
  document.addEventListener("DOMContentLoaded", async () => {
    syncOffline();
    window.addEventListener("online", syncOffline);
    window.addEventListener("offline", syncOffline);

    const { data: { session } } = await sb.auth.getSession();
    currentSession = session;
    sb.auth.onAuthStateChange((_e, s) => { currentSession = s; renderHeader(); });

    await loadSiteLogo();
    renderHeader();
    renderBroadcast();
    loadLibrary();
    loadAiring();

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMessagesModal(); });

    sb.channel("public-anichan")
      .on("postgres_changes", { event:"*", schema:"public", table:"anime" }, () => loadLibrary())
      .on("postgres_changes", { event:"*", schema:"public", table:"settings" }, () => { renderBroadcast(); loadSiteLogo(); })
      .subscribe();
  });
})();
</script>
</body>
</html>
