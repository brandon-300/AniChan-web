<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan</title>
<meta name="description" content="Your personal anime tracker and library." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}

  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  #offline{position:sticky;top:0;z-index:60;background:var(--danger);color:#fff;
    text-align:center;font-size:13px;padding:8px;display:none}
  #offline.show{display:block}

  header.app{position:sticky;top:0;z-index:50;background:rgba(19,19,19,.80);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border)}
  #offline.show + header.app{top:32px}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.3px}
  .brand .accent{color:var(--accent)}
  .logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-block;flex-shrink:0;background:var(--panel);}
  .hd-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative}

  .menu-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:24px;color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{border-color:var(--accent);background:var(--card)}

  /* Navigation dropdown (still pushes content down) */
  .nav-dropdown{
    display:none;background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    padding:16px 16px 20px;
  }
  .nav-dropdown.open{display:block}
  .nav-dropdown .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--text);
    transition:background .15s;cursor:pointer;
  }
  .nav-dropdown .nav-item:hover{background:var(--panel);color:var(--accent)}
  .nav-dropdown .nav-item .material-symbols-outlined{font-size:20px}
  .nav-dropdown .nav-divider{height:1px;background:var(--border);margin:8px 0}

  .nav-search-wrap{margin-top:8px;position:relative}
  .nav-search-wrap input{
    width:100%;padding:12px 14px 12px 44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none;
  }
  .nav-search-wrap input:focus{border-color:var(--accent)}
  .nav-search-wrap .ico{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;
    pointer-events:none;
  }

  /* Floating search overlay – fixed, no internal scroll */
  .search-results-dropdown{
    position:fixed;
    background:#1a1a1a;
    border:1px solid var(--border);border-radius:12px;
    overflow:hidden;   /* no scrollbar */
    display:none;
    box-shadow:0 12px 24px rgba(0,0,0,.6);
    z-index:99999;
  }
  .search-results-dropdown.show{display:block}
  .search-result-item{
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    cursor:pointer;transition:background .15s;
  }
  .search-result-item:hover{background:var(--panel)}
  .search-thumb{
    width:42px;height:42px;border-radius:50%;object-fit:cover;
    background:var(--panel);border:1px solid var(--border);flex-shrink:0;
  }
  .search-info{flex:1;min-width:0}
  .search-info .name{font-weight:600;font-size:14px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-info .meta{font-size:11px;color:var(--muted);margin-top:2px}

  .no-results{
    padding:24px 18px;text-align:center;color:var(--muted);font-size:13px;
    background:#1a1a1a;
  }

  .btn{
    padding:9px 15px;border-radius:12px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    transition:transform .08s ease,background .15s ease,border-color .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);border-color:transparent;color:#0a2a28;font-weight:700}
  .btn-primary:hover{filter:brightness(1.08)}

  .broadcast{display:none;margin:16px 0;padding:14px 16px;border-radius:16px;
    background:rgba(81,218,211,.08);border:1px solid rgba(81,218,211,.25);color:#dffaf8;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:12px;align-items:flex-start}
  .broadcast.hidden{display:none}

  /* Latest Releases section */
  .section-glass{
    background:rgba(26,26,26,.70);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:20px;padding:20px;
    margin-bottom:24px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .section-glass h2{
    margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:.3px;
    color:#fff;display:flex;align-items:center;gap:8px;
  }
  .section-glass h2 .material-symbols-outlined{font-size:24px;color:var(--accent)}

  .release-list{display:flex;flex-direction:column;gap:16px}
  .release-card{
    border-radius:18px;overflow:hidden;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease;
    cursor:pointer;text-decoration:none;color:inherit;
  }
  .release-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.6)}

  .card-image{
    width:100%;aspect-ratio:16/9;
    background-size:cover;background-position:center;
    position:relative;
  }
  .card-image .overlay{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 50%, transparent 100%);
    pointer-events:none;
  }

  .card-title-overlay{
    position:absolute;bottom:0;left:0;right:0;
    padding:12px 16px;
    font-size:15px;font-weight:700;line-height:1.4;
    color:#fff;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    z-index:2;
  }

  .media-badge{
    position:absolute;top:10px;left:10px;
    background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:var(--accent);font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;
    text-transform:uppercase;letter-spacing:.5px;
    z-index:2;
    display:none;
  }
  .media-badge.show{display:block}

  .ep-badge-overlay{
    position:absolute;bottom:10px;right:10px;
    background:var(--accent);color:#0a2a28;
    font-size:14px;font-weight:700;
    padding:4px 14px;border-radius:20px;
    z-index:2;
  }

  .empty{padding:32px;text-align:center;color:var(--muted);
    border:1px dashed var(--border);border-radius:18px;background:var(--card);font-size:13px}

  .pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
  .pagination button{padding:8px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
  .pagination button:disabled{opacity:.4;cursor:default}
  .pagination button:hover:not(:disabled){border-color:var(--accent);background:var(--card)}
  .page-indicator{font-size:13px;color:var(--muted);min-width:80px;text-align:center}

  #toTop{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;
    background:var(--accent);color:#0a2a28;font-size:20px;font-weight:800;
    box-shadow:0 12px 28px rgba(81,218,211,.30);opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:40;transform:translateY(20px)}
  #toTop.visible{opacity:1;pointer-events:auto;transform:translateY(0)}

  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(0,0,0,.60);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .modal.show{display:flex}
  .modal .panel{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:700}
  .modal .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .modal .close{color:var(--muted);font-size:22px;line-height:1;cursor:pointer}

  .chat-room-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
  .chat-room-item:hover{background:var(--panel)}
  .room-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
  .chat-room-item .info{flex:1;min-width:0}
  .chat-room-item .name{font-weight:600;font-size:14px}
  .chat-room-item .preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-room-item .meta{text-align:right;flex-shrink:0}
  .chat-room-item .time{font-size:11px;color:var(--muted)}

  footer{padding:30px 0 80px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div id="offline" role="status">You're offline — live API features disabled.</div>

  <header class="app">
    <div class="wrap hd">
      <div class="brand">
        <img class="logo-img" id="siteLogo" src="" alt="Logo" />
        <span>Ani<span class="accent">Chan</span></span>
      </div>
      <div class="hd-actions" id="headerActions">
        <!-- Populated by JS -->
      </div>
    </div>
  </header>

  <!-- Full‑width navigation dropdown -->
  <div class="nav-dropdown" id="navDropdown">
    <div class="nav-item" id="navHome"><span class="material-symbols-outlined">home</span> Home</div>
    <div class="nav-item" id="navAnime"><span class="material-symbols-outlined">library_books</span> Anime</div>
    <div class="nav-search-wrap" id="navSearchWrap">
      <span class="ico material-symbols-outlined">search</span>
      <input type="text" id="navSearchInput" placeholder="Search" autocomplete="off" />
    </div>
    <div id="navUserSection"></div>
  </div>

  <!-- Floating search overlay (outside nav dropdown) -->
  <div class="search-results-dropdown" id="searchResultsDropdown"></div>

  <main class="wrap">
    <div class="broadcast hidden" id="broadcast">
      <span class="material-symbols-outlined" style="font-size:20px">campaign</span>
      <div style="font-size:14px;line-height:1.45" id="broadcastMsg"></div>
    </div>

    <div class="section-glass" id="latestReleasesSection">
      <h2>
        <span class="material-symbols-outlined">new_releases</span>
        <span id="latestReleasesHeading">Latest Releases</span>
      </h2>
      <div class="release-list" id="releaseList"></div>
      <div class="pagination" id="paginationControls" style="display:none;">
        <button id="prevPageBtn">← Previous</button>
        <span class="page-indicator" id="pageIndicator">1 / 1</span>
        <button id="nextPageBtn">Next →</button>
      </div>
    </div>
  </main>

  <button id="toTop" aria-label="Scroll to top">↑</button>

  <div class="modal" id="messagesModal" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true">
      <div class="head">
        <h3 id="messagesModalTitle">Messages</h3>
        <button class="close" id="messagesModalClose" aria-label="Close">×</button>
      </div>
      <div id="messagesList"></div>
    </div>
  </div>

  <footer>AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="#1a1a1a"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle" dominant-baseline="middle">No image</text></svg>');

  const ITEMS_PER_PAGE = 26;
  let library = [];
  let currentSession = null;
  let currentPage = 1;

  const latestReleasesText = t('latestReleases') === 'latestReleases' ? 'Latest Releases' : t('latestReleases');
  $("offline").textContent = t("offline");
  $("latestReleasesHeading").textContent = latestReleasesText;
  $("prevPageBtn").textContent = t("previous");
  $("nextPageBtn").textContent = t("next");
  $("messagesModalTitle").textContent = t("messages");
  $("toTop").textContent = t("backToTop");

  let lastScrollY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const btn = $("toTop");
    if (y < lastScrollY && y > 200) btn.classList.add("visible");
    else if (y <= 200) btn.classList.remove("visible");
    else if (y > lastScrollY) btn.classList.remove("visible");
    lastScrollY = y;
  }, { passive: true });
  $("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  function syncOffline(){ $("offline").classList.toggle("show", !navigator.onLine); }
  window.addEventListener("online", () => setTimeout(() => location.reload(), 1000));

  async function loadSiteLogo() {
    try {
      const { data, error } = await sb.from("settings").select("value").eq("key","site_logo").maybeSingle();
      if (error) return;
      const url = data?.value || "";
      const img = $("siteLogo");
      if (url) { img.src = url + '?t=' + Date.now(); img.style.display = "inline-block"; }
      else { img.style.display = "none"; }
    } catch(e) { console.warn("Logo load error", e); }
  }

  async function getUserAvatar() {
    if (!currentSession) return null;
    const { data, error } = await sb.from("profiles").select("avatar_url").eq("id", currentSession.user.id).maybeSingle();
    return data?.avatar_url || null;
  }

  function renderHeader() {
    const container = $("headerActions");
    container.innerHTML = '';

    if (!currentSession) {
      const adminBtn = document.createElement("button");
      adminBtn.className = "btn";
      adminBtn.textContent = t("admin");
      adminBtn.addEventListener("click", () => location.href = "admin_login.html");
      const loginBtn = document.createElement("button");
      loginBtn.className = "btn btn-primary";
      loginBtn.textContent = t("login");
      loginBtn.addEventListener("click", () => location.href = "user_login.html");
      container.appendChild(adminBtn);
      container.appendChild(loginBtn);
    }

    const menuBtn = document.createElement("button");
    menuBtn.className = "menu-btn";
    menuBtn.id = "menuToggle";
    menuBtn.innerHTML = '<span class="material-symbols-outlined">menu</span>';
    menuBtn.addEventListener("click", () => {
      $("navDropdown").classList.toggle("open");
    });
    container.appendChild(menuBtn);

    renderNavUserSection();
  }

  function renderNavUserSection() {
    const section = $("navUserSection");
    section.innerHTML = '';
    if (!currentSession) return;

    const divider = document.createElement("div");
    divider.className = "nav-divider";
    section.appendChild(divider);

    const items = [
      { id: 'navFindFriends', icon: 'group', text: t('findFriends'), action: () => location.href = 'find_friends.html' },
      { id: 'navMessages', icon: 'chat', text: t('messages'), action: () => openMessagesModal() },
      { id: 'navProfile', icon: 'person', text: t('profile'), action: () => location.href = 'profile.html' }
    ];
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "nav-item";
      div.innerHTML = `<span class="material-symbols-outlined">${item.icon}</span> ${item.text}`;
      div.addEventListener("click", () => { $("navDropdown").classList.remove("open"); item.action(); });
      section.appendChild(div);
    });
  }

  $("navHome").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "index.html"; });
  $("navAnime").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "anime.html"; });

  // ── Fuzzy live search – fixed overlay, no scroll ──
  const navSearchInput = $("navSearchInput");
  const searchResultsDropdown = $("searchResultsDropdown");
  const MAX_RESULTS = 15;   // enough to fill the viewport without scrolling

  function positionDropdown() {
    const rect = navSearchInput.getBoundingClientRect();
    searchResultsDropdown.style.top = (rect.bottom + 4) + 'px';
    searchResultsDropdown.style.left = rect.left + 'px';
    searchResultsDropdown.style.width = rect.width + 'px';

    // calculate available space below the input
    const spaceBelow = window.innerHeight - rect.bottom - 8;
    searchResultsDropdown.style.maxHeight = spaceBelow + 'px';
  }

  function hideSearchResults() {
    searchResultsDropdown.classList.remove("show");
    searchResultsDropdown.innerHTML = '';
  }

  function performSearch(query) {
    searchResultsDropdown.innerHTML = '';
    const q = query.trim();
    if (!q) { hideSearchResults(); return; }

    const lowerQ = q.toLowerCase();
    const words = lowerQ.split(/\s+/).filter(Boolean);
    if (words.length === 0) { hideSearchResults(); return; }

    const scored = library.map(a => {
      const fields = [a.title, a.title_en, a.title_jp, a.title_zh, a.title_de, a.title_fr]
        .filter(f => f != null);
      let matchCount = 0;
      for (const word of words) {
        if (fields.some(f => f.toLowerCase().includes(word))) matchCount++;
      }

      if (words.length === 1 && matchCount === 0) return null;
      if (words.length > 1 && matchCount < 2) return null;

      let score = matchCount;

      for (const f of fields) {
        if (f.toLowerCase().startsWith(lowerQ)) { score += 200; break; }
      }
      if (score < 200) {
        for (const f of fields) {
          if (f.toLowerCase().includes(lowerQ)) { score += 100; break; }
        }
      }

      return { anime: a, score };
    }).filter(Boolean);

    if (scored.length === 0) {
      const noRes = document.createElement("div");
      noRes.className = "no-results";
      noRes.textContent = "No results found";
      searchResultsDropdown.appendChild(noRes);
      positionDropdown();
      searchResultsDropdown.classList.add("show");
      return;
    }

    const matches = scored
      .sort((a, b) => b.score - a.score)
      .slice(0, MAX_RESULTS)
      .map(s => s.anime);

    matches.forEach(a => {
      const item = document.createElement("div");
      item.className = "search-result-item";
      item.innerHTML = `
        <img class="search-thumb" src="${a.image_url || PLACEHOLDER}" onerror="this.src='${PLACEHOLDER}'" />
        <div class="search-info">
          <div class="name">${a.title || "Untitled"}</div>
          <div class="meta">${[a.type, a.year, a.ep_total ? a.ep_total + ' eps' : ''].filter(Boolean).join(" · ")}</div>
        </div>`;
      item.addEventListener("click", () => {
        hideSearchResults();
        navSearchInput.value = '';
        $("navDropdown").classList.remove("open");
        location.href = `anime_info.html?id=${a.id}`;
      });
      searchResultsDropdown.appendChild(item);
    });
    positionDropdown();
    searchResultsDropdown.classList.add("show");
  }

  navSearchInput.addEventListener("input", () => performSearch(navSearchInput.value));
  navSearchInput.addEventListener("focus", () => { if (navSearchInput.value.trim()) performSearch(navSearchInput.value); });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#navSearchWrap") && !e.target.closest("#searchResultsDropdown")) {
      hideSearchResults();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      hideSearchResults();
      if ($("messagesModal").classList.contains("show")) closeMessagesModal();
    }
  });
  window.addEventListener("scroll", () => { if (searchResultsDropdown.classList.contains("show")) positionDropdown(); }, { passive: true });
  window.addEventListener("resize", () => { if (searchResultsDropdown.classList.contains("show")) positionDropdown(); });

  // ── Broadcast ──
  async function renderBroadcast() {
    const el = $("broadcast");
    const { data } = await sb.from("settings").select("value").eq("key","broadcast_message").maybeSingle();
    const msg = (data && data.value || "").trim();
    if (msg) { $("broadcastMsg").textContent = msg; el.classList.remove("hidden"); }
    else { el.classList.add("hidden"); }
  }

  // ── Title / episode helpers ──
  function getDisplayTitle(a) {
    if (currentLang === 'en' && a.title_en) return a.title_en;
    if (currentLang === 'ja' && a.title_jp) return a.title_jp;
    if (currentLang === 'zh' && a.title_zh) return a.title_zh;
    if (currentLang === 'de' && a.title_de) return a.title_de;
    if (currentLang === 'fr' && a.title_fr) return a.title_fr;
    return a.title || "Untitled";
  }

  function getEpisodeNumber(a) {
    if (a.status === 'Currently Airing') {
      if (a.ep_watched != null) return a.ep_watched;
      if (a.ep_total != null) return a.ep_total;
      return '?';
    }
    if (a.ep_total != null) return a.ep_total;
    return '?';
  }

  function renderReleases() {
    const list = $("releaseList");
    const totalItems = library.length;
    const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages || 1;
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = library.slice(start, start + ITEMS_PER_PAGE);

    list.innerHTML = "";
    if (!pageItems.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = library.length ? t("noItemsPage") : t("emptyLibrary");
      list.appendChild(e);
    } else {
      for (const a of pageItems) {
        const card = document.createElement("a");
        card.className = "release-card";
        card.href = `anime_info.html?id=${a.id}`;
        card.title = a.title || "Untitled";

        const imgDiv = document.createElement("div");
        imgDiv.className = "card-image";
        imgDiv.style.backgroundImage = `url('${a.image_url || PLACEHOLDER}')`;

        const overlay = document.createElement("div");
        overlay.className = "overlay";
        imgDiv.appendChild(overlay);

        const mediaBadge = document.createElement("span");
        mediaBadge.className = "media-badge";
        if (a.release_type) {
          mediaBadge.textContent = a.release_type;
          mediaBadge.classList.add("show");
        }
        imgDiv.appendChild(mediaBadge);

        const titleOverlay = document.createElement("span");
        titleOverlay.className = "card-title-overlay";
        titleOverlay.textContent = getDisplayTitle(a);
        imgDiv.appendChild(titleOverlay);

        const epBadge = document.createElement("span");
        epBadge.className = "ep-badge-overlay";
        epBadge.textContent = getEpisodeNumber(a);
        imgDiv.appendChild(epBadge);

        card.appendChild(imgDiv);
        list.appendChild(card);
      }
    }

    const pagination = $("paginationControls");
    const prevBtn = $("prevPageBtn");
    const nextBtn = $("nextPageBtn");
    const indicator = $("pageIndicator");
    if (totalPages <= 1) { pagination.style.display = "none"; }
    else {
      pagination.style.display = "flex";
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      indicator.textContent = `${currentPage} / ${totalPages}`;
    }
  }

  async function loadLibrary() {
    const { data, error } = await sb
      .from("anime")
      .select("*")
      .order("aired_to", { ascending: false, nullsFirst: true })
      .order("aired_from", { ascending: false })
      .order("created_at", { ascending: false });
    library = error ? [] : (data || []);
    currentPage = 1;
    renderReleases();
  }

  $("prevPageBtn").addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderReleases(); } });
  $("nextPageBtn").addEventListener("click", () => {
    const totalPages = Math.ceil(library.length / ITEMS_PER_PAGE);
    if (currentPage < totalPages) { currentPage++; renderReleases(); }
  });

  function openMessagesModal() { $("messagesModal").classList.add("show"); $("messagesModal").setAttribute("aria-hidden","false"); loadChatRooms(); }
  function closeMessagesModal() { $("messagesModal").classList.remove("show"); $("messagesModal").setAttribute("aria-hidden","true"); }
  $("messagesModalClose").addEventListener("click", closeMessagesModal);
  $("messagesModal").addEventListener("click", (e) => { if (e.target.id === "messagesModal") closeMessagesModal(); });

  async function loadChatRooms() {
    const list = $("messagesList"); list.innerHTML = "Loading...";
    if (!currentSession) return;
    const { data, error } = await sb.from("chat_rooms")
      .select(`id, last_message, last_message_time, user_one_id, user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id, username, full_name, avatar_url, is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id, username, full_name, avatar_url, is_online)`)
      .or(`user_one_id.eq.${currentSession.user.id},user_two_id.eq.${currentSession.user.id}`)
      .order('last_message_time', { ascending: false });
    if (error) { list.innerHTML = "Failed to load."; return; }
    if (!data?.length) { list.innerHTML = `<div style="padding:16px;color:var(--muted);text-align:center">${t("noConversations")}</div>`; return; }
    list.innerHTML = "";
    data.forEach(room => {
      const isUserOne = room.user_one_id === currentSession.user.id;
      const partner = isUserOne ? room.user_two : room.user_one;
      const div = document.createElement("div");
      div.className = "chat-room-item";
      div.innerHTML = `
        <img class="room-avatar" src="${partner.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        <div class="info"><div class="name">${partner.full_name || partner.username}</div><div class="preview">${room.last_message || ""}</div></div>
        <div class="meta"><div class="time">${formatChatTime(room.last_message_time)}</div></div>`;
      div.addEventListener("click", () => { closeMessagesModal(); location.href = "chat.html?room=" + room.id; });
      list.appendChild(div);
    });
  }

  function formatChatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    if (now - d < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    return d.toLocaleDateString();
  }

  document.addEventListener("DOMContentLoaded", async () => {
    syncOffline();
    window.addEventListener("online", syncOffline);
    window.addEventListener("offline", syncOffline);
    const { data: { session } } = await sb.auth.getSession();
    currentSession = session;
    sb.auth.onAuthStateChange((_e, s) => { currentSession = s; renderHeader(); });
    await loadSiteLogo();
    renderHeader();
    renderBroadcast();
    loadLibrary();

    sb.channel("public-anichan")
      .on("postgres_changes", { event:"*", schema:"public", table:"anime" }, () => loadLibrary())
      .on("postgres_changes", { event:"*", schema:"public", table:"settings" }, () => { renderBroadcast(); loadSiteLogo(); })
      .subscribe();
  });
})();
</script>
</body>
</html>
