<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan</title>
<meta name="description" content="Your personal anime tracker and library." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0d0d; --card:#161616; --panel:#1a1a1a;
    --accent:#1db9b2; --danger:#ff4757;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#222;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}

  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  #offline{position:sticky;top:0;z-index:60;background:var(--danger);color:#fff;
    text-align:center;font-size:13px;padding:8px;display:none}
  #offline.show{display:block}

  header.app{position:sticky;top:0;z-index:50;background:rgba(13,13,13,.85);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border)}
  #offline.show + header.app{top:32px}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px} /* increased vertical padding */
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-block;background:var(--panel);}
  .hd-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    transition:transform .08s ease,background .15s ease,border-color .15s ease}
  .btn:hover{border-color:#333}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);border-color:transparent;color:#062525}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-danger{background:transparent;border-color:#3a1f24;color:var(--danger)}
  .btn-danger:hover{background:#2a1218}

  .broadcast{display:none;margin:16px 0;padding:14px 16px;border-radius:14px;
    background:linear-gradient(135deg,rgba(29,185,178,.12),rgba(29,185,178,.04));
    border:1px solid rgba(29,185,178,.35);color:#dffaf8;
    display:flex;gap:12px;align-items:flex-start}
  .broadcast.hidden{display:none}
  .broadcast .ico{font-size:18px}
  .broadcast .msg{font-size:14px;line-height:1.45}

  .search{position:relative;margin:14px 0 22px}
  .search input{width:100%;padding:14px 14px 14px 42px;border-radius:12px;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:16px}

  /* Section layout – two columns on larger screens, single column on mobile */
  .sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 20px;
  }
  @media (max-width: 640px) {
    .sections-grid {
      grid-template-columns: 1fr;
    }
  }

  section{margin:22px 0}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .sec-head h2{margin:0;font-size:16px;letter-spacing:.3px;text-transform:uppercase;color:#cfd2d6}
  .sec-head small{color:var(--muted);font-size:12px}

  .shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .shelf::-webkit-scrollbar{display:none}
  .shelf{scrollbar-width:none}
  .shelf .card{flex:0 0 140px;scroll-snap-align:start}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;transition:transform .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-2px);border-color:#2b2b2b}
  .card .poster{aspect-ratio:2/3;background:#0a0a0a;width:100%;object-fit:cover}
  .card .meta{padding:10px}
  .card .title{font-size:13px;line-height:1.3;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .empty{padding:28px;text-align:center;color:var(--muted);
    border:1px dashed var(--border);border-radius:14px;background:var(--panel)}

  /* Smart back-to-top button */
  #toTop {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--accent);
    color: #062525;
    font-size: 20px;
    font-weight: 800;
    box-shadow: 0 10px 24px rgba(29,185,178,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 40;
    transform: translateY(20px);
  }
  #toTop.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* Members modal */
  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;
    justify-content:center;padding:18px;background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .modal.show{display:flex}
  .modal .panel{width:100%;max-width:400px;background:var(--card);
    border:1px solid var(--border);border-radius:18px;padding:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .modal .close{color:var(--muted);font-size:20px;line-height:1}
  .member-item{
    display:flex;align-items:center;gap:10px;padding:8px 0;
    border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s
  }
  .member-item:hover{background:var(--panel)}
  .member-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}

  footer{padding:30px 0 80px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <div id="offline" role="status">You're offline — live API features disabled.</div>

  <header class="app">
    <div class="wrap hd">
      <div class="brand">
        <img class="logo-img" id="siteLogo" src="" alt="Logo" />
        Ani<span>Chan</span>
      </div>
      <div class="hd-actions" id="headerActions">
        <!-- Populated by JS -->
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="broadcast hidden" id="broadcast">
      <div class="ico">📣</div>
      <div class="msg" id="broadcastMsg"></div>
    </div>

    <div class="search">
      <span class="ico">🔍</span>
      <input id="searchInput" type="text" placeholder="Search your library…" autocomplete="off" />
    </div>

    <!-- Two‑column layout for sections -->
    <div class="sections-grid">
      <!-- Section 1: Currently Airing -->
      <div id="airingSection">
        <section>
          <div class="sec-head">
            <h2>Currently Airing</h2>
            <small id="airingNote">via Jikan</small>
          </div>
          <div class="shelf" id="airingShelf">
            <div class="empty" style="flex:1">Loading airing anime…</div>
          </div>
        </section>
      </div>
      <!-- Section 2: My Collection -->
      <div id="collectionSection">
        <section>
          <div class="sec-head">
            <h2>My Collection</h2>
            <small id="collectionCount"></small>
          </div>
          <div class="grid" id="collectionGrid"></div>
        </section>
      </div>
    </div>
  </main>

  <button id="toTop" aria-label="Scroll to top">↑</button>

  <!-- All Members Modal -->
  <div class="modal" id="membersModal" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true">
      <div class="head">
        <h3>All Members</h3>
        <button class="close" id="membersModalClose" aria-label="Close">×</button>
      </div>
      <div id="membersList"></div>
    </div>
  </div>

  <footer>AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="#1a1a1a"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle" dominant-baseline="middle">No image</text></svg>');

  let library = [];
  let currentSession = null;

  // Smart back-to-top button
  const toTopBtn = $("toTop");
  let lastScrollY = window.scrollY;

  function handleScroll() {
    const currentScrollY = window.scrollY;
    if (currentScrollY < lastScrollY && currentScrollY > 200) {
      toTopBtn.classList.add("visible");
    } else if (currentScrollY <= 200) {
      toTopBtn.classList.remove("visible");
    } else if (currentScrollY > lastScrollY) {
      toTopBtn.classList.remove("visible");
    }
    lastScrollY = currentScrollY;
  }

  window.addEventListener("scroll", handleScroll, { passive: true });
  toTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Offline
  function syncOffline(){ $("offline").classList.toggle("show", !navigator.onLine); }

  window.addEventListener("online", () => {
    setTimeout(() => location.reload(), 1000);
  });

  // ----- Logo loader -----
  async function loadSiteLogo() {
    try {
      const { data, error } = await sb
        .from("settings")
        .select("value")
        .eq("key", "site_logo")
        .maybeSingle();
      if (error) return;
      const url = data && data.value ? data.value : "";
      const img = $("siteLogo");
      if (url) {
        img.src = url;
        img.style.display = "inline-block";
      } else {
        img.style.display = "none";
      }
    } catch (e) {
      console.warn("Failed to load site logo:", e);
    }
  }

  // ----- Header buttons -----
  function renderHeader() {
    const container = $("headerActions");
    container.innerHTML = '';

    if (currentSession) {
      const email = currentSession.user.email || "user";
      container.innerHTML = `
        <button class="btn" id="allMembersBtn">All Members</button>
        <button class="btn" id="chatBtn">💬 Chat</button>
        <button class="btn" id="profileBtn">👤 Profile</button>
        <button class="btn btn-danger" id="logoutBtn">Logout (${email.split("@")[0]})</button>
      `;
      $("allMembersBtn").addEventListener("click", showAllMembers);
      $("chatBtn").addEventListener("click", () => location.href = "chat.html");
      $("profileBtn").addEventListener("click", () => location.href = "profile.html");
      $("logoutBtn").addEventListener("click", async () => {
        if (confirm("Log out?")) {
          await sb.auth.signOut();
        }
      });
    } else {
      container.innerHTML = `
        <button class="btn" id="adminBtn">Admin</button>
        <button class="btn btn-primary" id="loginBtn">Login</button>
      `;
      $("adminBtn").onclick = () => location.href = "admin_login.html";
      $("loginBtn").onclick = () => location.href = "user_login.html";
    }
  }

  // ----- Broadcast & collection renderers -----
  async function renderBroadcast() {
    const el = $("broadcast");
    const { data } = await sb.from("settings").select("value").eq("key", "broadcast_message").maybeSingle();
    const msg = (data && data.value || "").trim();
    if (msg) {
      $("broadcastMsg").textContent = msg;
      el.classList.remove("hidden");
      el.style.display = "flex";
    } else {
      el.style.display = "none";
    }
  }

  function renderCollection(filter = ""){
    const grid = $("collectionGrid");
    const q = filter.trim().toLowerCase();
    const items = q ? library.filter(a => (a.title || "").toLowerCase().includes(q)) : library;
    grid.innerHTML = "";
    $("collectionCount").textContent = library.length ? library.length + " saved" : "";
    if (!items.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.style.gridColumn = "1 / -1";
      e.textContent = library.length ? "No matches for your search." : "The library is empty — add anime from the Admin dashboard.";
      grid.appendChild(e);
      return;
    }
    for (const a of items) {
      const card = document.createElement("div"); card.className = "card";
      const img = document.createElement("img"); img.className = "poster"; img.loading = "lazy";
      img.src = a.image_url || PLACEHOLDER; img.onerror = () => { img.src = PLACEHOLDER; }; img.alt = a.title || "Untitled";
      const meta = document.createElement("div"); meta.className = "meta";
      const t = document.createElement("div"); t.className = "title"; t.textContent = a.title || "Untitled";
      meta.appendChild(t); card.appendChild(img); card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  async function loadLibrary(){
    const { data, error } = await sb.from("anime").select("*").order("created_at", { ascending: false });
    if (error) { library = []; } else { library = data || []; }
    renderCollection($("searchInput").value);
  }

  async function loadAiring(){
    const shelf = $("airingShelf");
    if (!navigator.onLine) { shelf.innerHTML = '<div class="empty" style="flex:1">Offline</div>'; return; }
    try {
      const res = await fetch("https://api.jikan.moe/v4/seasons/now?limit=8");
      const data = await res.json();
      shelf.innerHTML = "";
      (data.data || []).slice(0,8).forEach(a => {
        const card = document.createElement("div"); card.className = "card";
        const img = document.createElement("img"); img.className = "poster"; img.loading = "lazy";
        img.src = (a.images?.jpg?.image_url) || PLACEHOLDER; img.alt = a.title;
        const meta = document.createElement("div"); meta.className = "meta";
        const t = document.createElement("div"); t.className = "title"; t.textContent = a.title;
        meta.appendChild(t); card.appendChild(img); card.appendChild(meta);
        shelf.appendChild(card);
      });
    } catch { shelf.innerHTML = '<div class="empty" style="flex:1">Could not load</div>'; }
  }

  // ----- All Members modal -----
  function openMembersModal() {
    $("membersModal").classList.add("show");
    $("membersModal").setAttribute("aria-hidden", "false");
  }
  function closeMembersModal() {
    $("membersModal").classList.remove("show");
    $("membersModal").setAttribute("aria-hidden", "true");
  }
  async function showAllMembers() {
    openMembersModal();
    const list = $("membersList");
    list.innerHTML = "Loading...";
    const { data: users, error } = await sb.from("profiles").select("id, username, avatar_url").order("username");
    if (error) { list.innerHTML = "Error loading members."; return; }
    list.innerHTML = "";
    users.forEach(user => {
      const div = document.createElement("div");
      div.className = "member-item";
      div.innerHTML = `
        <img class="member-avatar" src="${user.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        <span style="flex:1">${user.username.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m])}</span>`;
      div.addEventListener("click", () => {
        closeMembersModal();
        location.href = "profile.html?user=" + user.id;
      });
      list.appendChild(div);
    });
  }
  $("membersModalClose").addEventListener("click", closeMembersModal);
  $("membersModal").addEventListener("click", (e) => { if (e.target.id === "membersModal") closeMembersModal(); });

  // ----- Init -----
  document.addEventListener("DOMContentLoaded", async () => {
    syncOffline();
    window.addEventListener("online", syncOffline);
    window.addEventListener("offline", syncOffline);

    const { data: { session } } = await sb.auth.getSession();
    currentSession = session;

    sb.auth.onAuthStateChange((_e, s) => {
      currentSession = s;
      renderHeader();
    });

    // Load logo first
    await loadSiteLogo();

    renderHeader();
    renderBroadcast();
    loadLibrary();
    loadAiring();

    $("searchInput").addEventListener("input", (e) => renderCollection(e.target.value));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMembersModal(); });

    // Real-time updates (also refresh logo when settings change)
    sb.channel("public-anichan")
      .on("postgres_changes", { event: "*", schema: "public", table: "anime" }, () => loadLibrary())
      .on("postgres_changes", { event: "*", schema: "public", table: "settings" }, () => {
        renderBroadcast();
        loadSiteLogo();  // so logo updates live too
      })
      .subscribe();
  });
})();
</script>
</body>
</html>
