<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Forgot Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0d0d; --card:#161616; --panel:#1a1a1a;
    --accent:#1db9b2; --danger:#ff4757;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#222;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .card{
    width:100%;max-width:380px;
    background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:28px 24px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  h2{font-size:20px;margin-bottom:20px;text-align:center;color:var(--text)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input{
    width:100%;padding:12px 14px;border-radius:10px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:var(--accent)}
  .err-msg{font-size:12px;color:var(--danger);margin-top:8px;display:none}
  .err-msg.show{display:block}
  .success-msg{font-size:12px;color:var(--accent);margin-top:8px;display:none}
  .success-msg.show{display:block}
  .submit-btn{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--accent);color:#062525;font-size:15px;font-weight:700;
    margin-top:8px;cursor:pointer;transition:filter .15s ease;
  }
  .submit-btn:hover{filter:brightness(1.05)}
  .back-link{
    display:block;text-align:center;margin-top:20px;
    font-size:13px;color:var(--muted);text-decoration:none;
  }
  .back-link:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="card">
    <h2>Reset your password</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px;text-align:center">
      Enter your username and we’ll send a reset link to your email.
    </p>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Your username" />
    </div>
    <div class="err-msg" id="err"></div>
    <div class="success-msg" id="success"></div>
    <button class="submit-btn" id="resetBtn">Send reset link</button>
    <a href="user_login.html" class="back-link">← Back to Login</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  $("resetBtn").addEventListener("click", async () => {
    const username = $("username").value.trim();
    const err = $("err");
    const success = $("success");
    err.classList.remove("show");
    success.classList.remove("show");

    if (!username) {
      err.textContent = "Please enter your username.";
      err.classList.add("show");
      return;
    }

    try {
      // Look up email by username
      const { data: profile, error: lookupError } = await supabase
        .from("profiles")
        .select("email")
        .eq("username", username)
        .maybeSingle();

      if (lookupError) throw lookupError;
      if (!profile) {
        err.textContent = "No account found with that username.";
        err.classList.add("show");
        return;
      }

      // Send password reset email
      const { error: resetError } = await supabase.auth.resetPasswordForEmail(profile.email, {
        redirectTo: window.location.origin + "/reset_password.html",
      });
      if (resetError) throw resetError;

      success.textContent = "Reset link sent! Check your email.";
      success.classList.add("show");
    } catch (e) {
      err.textContent = e.message || "Something went wrong.";
      err.classList.add("show");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("resetBtn").click();
  });
})();
</script>
</body>
</html>
