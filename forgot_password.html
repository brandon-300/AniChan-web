<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Forgot Password</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  /* Spinner animation */
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-spinner {
    width: 20px; height: 20px; border: 2px solid transparent;
    border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite;
  }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-5 relative overflow-hidden">

  <!-- Background radial gradients -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent/10 blur-3xl"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[400px] h-[400px] rounded-full bg-accent/5 blur-3xl"></div>
  </div>

  <!-- Reset card -->
  <div class="relative z-10 w-full max-w-md bg-card/70 glass border border-border rounded-3xl p-8 shadow-2xl">
    <h2 class="text-xl font-bold text-center mb-2">Reset your password</h2>
    <p class="text-sm text-muted text-center mb-6">
      Enter your username and we’ll send a reset link to your email.
    </p>

    <!-- Username field with icon -->
    <div class="mb-5 relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-lg material-symbols-outlined">person</span>
      <input id="username" type="text" placeholder="Your username"
             class="w-full pl-10 p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
    </div>

    <!-- Messages -->
    <div id="err" class="text-xs text-danger mb-3 hidden"></div>
    <div id="success" class="text-xs text-accent mb-3 hidden"></div>

    <!-- Submit button with states -->
    <button id="resetBtn" class="w-full py-3 rounded-xl bg-accent text-black font-bold text-sm hover:brightness-110 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
      <span id="resetBtnText">Send reset link</span>
    </button>

    <!-- Back to login -->
    <a href="user_login.html" class="block text-center mt-5 text-muted text-sm hover:text-white transition">← Back to Login</a>

    <!-- Footer links -->
    <div class="flex justify-center gap-4 mt-6 text-xs text-muted">
      <a href="#" class="hover:text-white transition">Support</a>
      <a href="#" class="hover:text-white transition">Privacy</a>
    </div>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  $("resetBtn").addEventListener("click", async () => {
    const username = $("username").value.trim();
    const err = $("err");
    const success = $("success");
    const btnText = $("resetBtnText");

    err.classList.add("hidden");
    success.classList.add("hidden");

    if (!username) {
      err.textContent = "Please enter your username.";
      err.classList.remove("hidden");
      return;
    }

    // Show loading spinner
    const originalHtml = $("resetBtn").innerHTML;
    $("resetBtn").innerHTML = '<span class="loading-spinner"></span> Sending…';
    $("resetBtn").disabled = true;

    try {
      // Look up email by username
      const { data: profile, error: lookupError } = await supabase
        .from("profiles")
        .select("email")
        .eq("username", username)
        .maybeSingle();

      if (lookupError) throw lookupError;
      if (!profile) {
        err.textContent = "No account found with that username.";
        err.classList.remove("hidden");
        $("resetBtn").innerHTML = originalHtml;
        $("resetBtn").disabled = false;
        return;
      }

      // Send password reset email
      const { error: resetError } = await supabase.auth.resetPasswordForEmail(profile.email, {
        redirectTo: window.location.origin + "/reset_password.html",
      });
      if (resetError) throw resetError;

      // Success state with checkmark
      $("resetBtn").innerHTML = '<span class="material-symbols-outlined">check_circle</span> Sent!';
      $("resetBtn").classList.add("bg-success");
      $("resetBtn").classList.remove("bg-accent");
      success.textContent = "Reset link sent! Check your email.";
      success.classList.remove("hidden");

      // Reset after 3 seconds
      setTimeout(() => {
        $("resetBtn").innerHTML = originalHtml;
        $("resetBtn").classList.remove("bg-success");
        $("resetBtn").classList.add("bg-accent");
        $("resetBtn").disabled = false;
      }, 3000);

    } catch (e) {
      err.textContent = e.message || "Something went wrong.";
      err.classList.remove("hidden");
      $("resetBtn").innerHTML = originalHtml;
      $("resetBtn").disabled = false;
    }
  });

  // Submit on Enter
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("resetBtn").click();
  });
})();
</script>
</body>
</html>
