<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/chat.css" />
<link rel="stylesheet" href="css/call.css" />
<link rel="stylesheet" href="css/modal.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app-root" id="appRoot">

  <!-- SCREEN-A: Messages Directory -->
  <div class="screen-a" id="screenA">
    <div class="screen-a-header">
      <button class="home-btn" id="homeBtn" title="Back to Home">
        <span class="material-symbols-outlined">home</span>
      </button>
      <div class="screen-brand">
        <span class="brand-ani">Ani</span><span class="brand-chan">Chan</span>
      </div>
    </div>

    <div class="search-box">
      <span class="search-icon material-symbols-outlined">search</span>
      <input type="text" id="searchInput" placeholder="Search a conversation" autocomplete="off" />
    </div>

    <div class="thread-list" id="roomList"></div>

    <button class="new-chat-fab" id="newChatBtn" title="New chat">
      <span class="material-symbols-outlined">edit</span>
    </button>
  </div>

  <!-- SCREEN-B: Conversation Room -->
  <div class="screen-b" id="screenB">
    <div class="chat-topbar" id="chatTopbar" style="display:none;">
      <button class="back-arrow" id="backArrow">←</button>
      <a class="partner-link" id="partnerLink" href="#" target="_blank">
        <img class="partner-pic" id="partnerPic" src="" alt="" />
        <div class="partner-online" id="partnerDot"></div>
      </a>
      <div class="partner-text">
        <div class="partner-name" id="partnerName"></div>
        <div class="partner-sub" id="partnerSub"></div>
      </div>
      <!-- NEW: Call buttons -->
      <div class="call-actions">
        <button id="voiceCallBtn" title="Voice Call">
          <span class="material-symbols-outlined">call</span>
        </button>
        <button id="videoCallBtn" title="Video Call">
          <span class="material-symbols-outlined">videocam</span>
        </button>
      </div>
    </div>

    <div class="msg-feed" id="msgFeed">
      <div class="empty-state" id="emptyState">
        <span class="material-symbols-outlined">chat</span>
        Select a conversation to start chatting
      </div>
    </div>
    <div id="typingIndicator" class="typing-indicator-container"></div>

    <div class="reply-strip" id="replyStrip">
      <div class="reply-strip-content">
        <div class="reply-strip-user" id="replyStripUser"></div>
        <div class="reply-strip-text" id="replyPreview"></div>
      </div>
      <button id="cancelReply" title="Cancel reply">
        <span class="material-symbols-outlined" style="font-size:18px">close</span>
      </button>
    </div>

    <div class="compose-area" id="composeArea" style="display:none;">
      <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" />
      <button class="send-circle" id="sendBtn">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>
</div>

<!-- Friends overlay -->
<div class="friends-overlay" id="friendsOverlay">
  <div class="friends-panel">
    <h3>New conversation
      <button class="close-friends" id="closeFriends">×</button>
    </h3>
    <div class="friends-list" id="friendsList"></div>
    <div class="no-more">No more friends?</div>
    <button class="add-more-btn" id="addMoreBtn">Add more friends</button>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
  <button id="ctxEdit">Edit</button>
  <div class="split"></div>
  <button id="ctxDelMe" class="danger">Delete for me</button>
  <div class="split"></div>
  <button id="ctxDelAll" class="danger">Delete for everyone</button>
  <button id="ctxCancel" style="color:var(--muted)">Cancel</button>
</div>

<!-- Call overlay -->
<div id="callOverlay" class="call-overlay">
  <div class="call-videos">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div class="call-controls">
    <button id="muteBtn" title="Mute"><span class="material-symbols-outlined">mic</span></button>
    <button id="cameraBtn" title="Camera"><span class="material-symbols-outlined">videocam</span></button>
    <button id="endCallBtn" title="End call"><span class="material-symbols-outlined">call_end</span></button>
  </div>
</div>

<!-- Incoming call popup -->
<div id="incomingCallPopup" class="incoming-call-popup hidden">
  <div class="incoming-call-content">
    <p>Incoming <span id="incomingCallType"></span> from <span id="incomingCaller"></span></p>
    <button id="acceptCallBtn">Accept</button>
    <button id="declineCallBtn">Decline</button>
  </div>
</div>
</body>
</html>
