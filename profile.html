<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Profile</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          accent2: '#ffb597',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573',
          offline: '#555555'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .lang-btn-active { border-color: #51dad3 !important; background: rgba(81,218,211,0.12) !important; }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-card border-b border-border px-4 py-3 flex items-center justify-between gap-3">
    <div class="font-extrabold text-xl tracking-tight">Ani<span class="text-accent">Chan</span></div>
    <div id="headerActions" class="flex items-center gap-2"><!-- dynamic --></div>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-4 py-6 w-full flex-1">

    <!-- Profile header card -->
    <div class="bg-card border border-border rounded-2xl p-6 mb-5 flex items-center gap-5 flex-col sm:flex-row sm:text-left text-center">
      <div class="relative flex-shrink-0 w-[90px] h-[90px]">
        <img id="avatarImg" src="" alt="Profile picture" class="w-full h-full rounded-full object-cover border-2 border-border bg-panel" />
        <div id="onlineDot" class="absolute top-[-2px] right-[-2px] w-[18px] h-[18px] rounded-full bg-offline border-2 border-card"></div>
        <button id="pencilBtn" title="Change photo" class="absolute bottom-[2px] right-[2px] w-7 h-7 rounded-full bg-accent text-black text-sm flex items-center justify-center cursor-pointer shadow-lg shadow-accent/30 hover:scale-105 transition-transform">
          <span class="material-symbols-outlined text-base">edit</span>
        </button>
        <input type="file" id="avatarInput" accept="image/*" class="hidden" />
      </div>
      <div class="flex-1">
        <h2 id="displayFullName" class="text-2xl font-bold mb-1">—</h2>
        <div id="displayUsername" class="text-muted text-sm">@—</div>
        <div id="displayLastSeen" class="text-muted text-xs mt-2">—</div>
      </div>
    </div>

    <!-- Editable info card -->
    <div class="bg-card border border-border rounded-2xl p-6 mb-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label for="fullNameInput" class="block text-xs text-muted mb-1.5">Full name</label>
          <input id="fullNameInput" type="text" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
        <div>
          <label for="usernameInput" class="block text-xs text-muted mb-1.5">Username</label>
          <input id="usernameInput" type="text" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label for="emailInput" class="block text-xs text-muted mb-1.5">Email</label>
          <input id="emailInput" type="email" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
        <div>
          <label for="ageInput" class="block text-xs text-muted mb-1.5">Age</label>
          <input id="ageInput" type="number" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="dobInput" class="block text-xs text-muted mb-1.5">Date of birth</label>
          <input id="dobInput" type="date" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
        <div>
          <label for="countryInput" class="block text-xs text-muted mb-1.5">Country</label>
          <input id="countryInput" type="text" readonly class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition read-only:opacity-80" />
        </div>
      </div>

      <div id="updateErr" class="text-xs text-danger mt-3 hidden"></div>
      <div id="updateSuccess" class="text-xs text-accent mt-3 hidden"></div>

      <!-- Language selector (own profile only) -->
      <div id="langSelectorContainer" class="mt-5 hidden">
        <label class="text-xs text-muted mb-2 block">Language</label>
        <div class="flex flex-wrap gap-2">
          <button onclick="setLanguage('en')" class="lang-btn px-3 py-1.5 rounded-lg border border-border bg-panel text-white text-sm hover:border-accent hover:bg-card transition">English</button>
          <button onclick="setLanguage('ja')" class="lang-btn px-3 py-1.5 rounded-lg border border-border bg-panel text-white text-sm hover:border-accent hover:bg-card transition">日本語</button>
          <button onclick="setLanguage('zh')" class="lang-btn px-3 py-1.5 rounded-lg border border-border bg-panel text-white text-sm hover:border-accent hover:bg-card transition">中文</button>
          <button onclick="setLanguage('de')" class="lang-btn px-3 py-1.5 rounded-lg border border-border bg-panel text-white text-sm hover:border-accent hover:bg-card transition">Deutsch</button>
          <button onclick="setLanguage('fr')" class="lang-btn px-3 py-1.5 rounded-lg border border-border bg-panel text-white text-sm hover:border-accent hover:bg-card transition">Français</button>
        </div>
      </div>
    </div>

    <!-- Bottom red buttons -->
    <div id="bottomActions" class="flex flex-wrap gap-3 mt-5"><!-- dynamic --></div>

  </main>

  <footer class="text-center text-muted text-xs py-4 border-t border-border">AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUserId = null;
  let isOwner = false;
  let originalProfile = null;
  let isEditing = false;

  // Apply translated labels
  ["fullNameInput","usernameInput","emailInput","ageInput","dobInput","countryInput"].forEach(id => {
    const input = $(id);
    if (input?.previousElementSibling) input.previousElementSibling.textContent = t(input.previousElementSibling.textContent.toLowerCase().replace(/\s/g,'_'));
  });
  // Quick manual translations for known labels
  const labelsMap = { fullNameInput:'fullName', usernameInput:'username', emailInput:'email', ageInput:'age', dobInput:'dob', countryInput:'country' };
  Object.entries(labelsMap).forEach(([id,key]) => { const el = $(id); if (el?.previousElementSibling) el.previousElementSibling.textContent = t(key); });

  // Inactivity
  let inactivityTimer;
  const INACTIVITY_LIMIT = 15 * 60 * 1000;
  function resetInactivity() { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(handleLogout, INACTIVITY_LIMIT); }
  function setupInactivity() { ['mousemove','keydown','mousedown','touchstart','scroll'].forEach(evt => document.addEventListener(evt, resetInactivity, { passive:true })); resetInactivity(); }

  // Heartbeat
  let heartbeatInterval;
  function startHeartbeat() {
    heartbeatInterval = setInterval(async () => {
      if (!currentUserId || document.hidden) return;
      await supabase.from('profiles').update({ last_seen: new Date().toISOString(), is_online: true }).eq('id', currentUserId);
    }, 30000);
  }
  function stopHeartbeat() { clearInterval(heartbeatInterval); }

  async function setOnlineStatus(online) {
    if (!currentUserId) return;
    await supabase.from('profiles').update({ is_online: online, last_seen: new Date().toISOString() }).eq('id', currentUserId);
  }

  async function handleLogout() {
    if (currentUserId) await setOnlineStatus(false);
    stopHeartbeat(); clearTimeout(inactivityTimer);
    await supabase.auth.signOut();
    window.location.href = "index.html";
  }

  function renderProfile(profile) {
    originalProfile = { ...profile };
    $('avatarImg').src = profile?.avatar_url || DEFAULT_AVATAR;
    $('avatarImg').onerror = () => { $('avatarImg').src = DEFAULT_AVATAR; };
    const dot = $('onlineDot');
    const lastSeenEl = $('displayLastSeen');
    if (profile?.is_online) {
      dot.classList.add('online');
      dot.style.background = '#2ed573';
      lastSeenEl.textContent = t('online');
    } else {
      dot.classList.remove('online');
      dot.style.background = '#555';
      lastSeenEl.textContent = profile?.last_seen ? t('lastSeen') + ': ' + new Date(profile.last_seen).toLocaleString() : t('lastSeen') + ': —';
    }
    $('displayFullName').textContent = profile?.full_name || '—';
    $('displayUsername').textContent = profile?.username ? '@' + profile.username : '@—';
    $('fullNameInput').value = profile?.full_name || '';
    $('usernameInput').value = profile?.username || '';
    $('emailInput').value = profile?.email || '';
    $('ageInput').value = profile?.age != null ? profile.age : '';
    $('dobInput').value = profile?.dob || '';
    $('countryInput').value = profile?.country || '';
  }

  function setEditMode(enabled) {
    isEditing = enabled;
    ['fullNameInput','usernameInput','emailInput','ageInput','dobInput','countryInput'].forEach(id => {
      $(id)[enabled ? 'removeAttribute' : 'setAttribute']('readonly', true);
    });
    updateHeaderButtons();
  }

  function updateHeaderButtons() {
    const container = $('headerActions');
    container.innerHTML = '';
    const backBtn = document.createElement('button');
    backBtn.className = 'px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent hover:bg-card transition';
    backBtn.textContent = t('back');
    backBtn.addEventListener('click', () => {
      if (document.referrer && document.referrer !== window.location.href) history.back();
      else window.location.href = "index.html";
    });
    container.appendChild(backBtn);
    if (!isOwner) {
      const msgBtn = document.createElement('button');
      msgBtn.className = 'px-3.5 py-2 rounded-lg text-xs font-semibold bg-accent text-black hover:brightness-110 transition';
      msgBtn.textContent = '💬 ' + t('message');
      msgBtn.addEventListener('click', startChat);
      container.appendChild(msgBtn);
      return;
    }
    $('langSelectorContainer').classList.remove('hidden');
    if (isEditing) {
      const saveBtn = document.createElement('button');
      saveBtn.className = 'px-3.5 py-2 rounded-lg text-xs font-semibold bg-accent text-black hover:brightness-110 transition';
      saveBtn.textContent = t('save');
      saveBtn.addEventListener('click', saveProfile);
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent hover:bg-card transition';
      cancelBtn.textContent = t('cancel');
      cancelBtn.addEventListener('click', cancelEdit);
      container.appendChild(saveBtn);
      container.appendChild(cancelBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.className = 'px-3.5 py-2 rounded-lg text-xs font-semibold bg-accent text-black hover:brightness-110 transition';
      editBtn.textContent = t('editProfile');
      editBtn.addEventListener('click', () => setEditMode(true));
      container.appendChild(editBtn);
    }
  }

  function cancelEdit() { if (originalProfile) renderProfile(originalProfile); setEditMode(false); $('updateErr').classList.add('hidden'); $('updateSuccess').classList.add('hidden'); }

  async function saveProfile() {
    const fullName = $('fullNameInput').value.trim();
    const username = $('usernameInput').value.trim();
    const email = $('emailInput').value.trim();
    const age = parseInt($('ageInput').value) || null;
    const dob = $('dobInput').value;
    const country = $('countryInput').value.trim();
    const errEl = $('updateErr'); const successEl = $('updateSuccess');
    errEl.classList.add('hidden'); successEl.classList.add('hidden');
    if (!fullName || !username || !email) { errEl.textContent = t('allFieldsRequired'); errEl.classList.remove('hidden'); return; }
    if (age && age < 14) { errEl.textContent = t('ageMin14'); errEl.classList.remove('hidden'); return; }
    try {
      const { data: exist } = await supabase.from('profiles').select('id').eq('username', username).neq('id', currentUserId).maybeSingle();
      if (exist) { errEl.textContent = t('usernameTaken'); errEl.classList.remove('hidden'); return; }
      const updates = { full_name: fullName, username, email, age: age || null, dob: dob || null, country: country || null };
      const { error } = await supabase.from('profiles').update(updates).eq('id', currentUserId);
      if (error) throw error;
      $('displayFullName').textContent = fullName;
      $('displayUsername').textContent = '@' + username;
      successEl.textContent = t('profileUpdated'); successEl.classList.remove('hidden');
      setEditMode(false);
    } catch(e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
  }

  async function uploadAvatar(file) {
    const ext = file.name.split('.').pop();
    const path = `${currentUserId}-${Date.now()}.${ext}`;
    const { error: upErr } = await supabase.storage.from('avatars').upload(path, file, { upsert: true });
    if (upErr) throw new Error('Upload failed: ' + upErr.message);
    const { data: url } = supabase.storage.from('avatars').getPublicUrl(path);
    if (!url?.publicUrl) throw new Error('Could not get URL');
    const { error: updateErr } = await supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUserId);
    if (updateErr) throw new Error('Update failed: ' + updateErr.message);
    $('avatarImg').src = url.publicUrl;
    return url.publicUrl;
  }

  async function startChat() {
    const otherUserId = new URLSearchParams(window.location.search).get('user');
    if (!otherUserId || otherUserId === currentUserId) return;
    const { data: room } = await supabase.from('chat_rooms').select('id').or(`and(user_one_id.eq.${currentUserId},user_two_id.eq.${otherUserId}),and(user_one_id.eq.${otherUserId},user_two_id.eq.${currentUserId})`).maybeSingle();
    if (room) { location.href = "chat.html?room=" + room.id; }
    else {
      const { data: newRoom, error } = await supabase.from('chat_rooms').insert({ user_one_id: currentUserId, user_two_id: otherUserId }).select('id').single();
      if (error) { alert('Could not create room.'); return; }
      location.href = "chat.html?room=" + newRoom.id;
    }
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = "user_login.html"; return; }
    currentUserId = session.user.id;
    const viewUserId = new URLSearchParams(window.location.search).get('user');

    if (viewUserId && viewUserId !== currentUserId) {
      isOwner = false;
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', viewUserId).single();
      if (!profile) { alert('User not found'); history.back(); return; }
      renderProfile(profile);
      $('pencilBtn').style.display = 'none';
      $('bottomActions').innerHTML = '';
      updateHeaderButtons();
      return;
    }

    isOwner = true;
    await setOnlineStatus(true);
    setupInactivity();
    startHeartbeat();
    const profile = await loadProfile();
    if (profile) renderProfile(profile); else renderProfile({});
    updateHeaderButtons();

    $('pencilBtn').addEventListener('click', () => $('avatarInput').click());
    $('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        await uploadAvatar(file);
        $('updateSuccess').textContent = t('avatarUpdated'); $('updateSuccess').classList.remove('hidden');
      } catch(err) { $('updateErr').textContent = err.message; $('updateErr').classList.remove('hidden'); }
      finally { e.target.value = ''; }
    });

    const bottom = $('bottomActions');
    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'w-full sm:w-auto px-6 py-3 rounded-xl bg-danger text-white font-semibold text-sm hover:brightness-110 transition';
    logoutBtn.textContent = t('logout');
    logoutBtn.addEventListener('click', handleLogout);
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'w-full sm:w-auto px-6 py-3 rounded-xl bg-transparent border border-red-900/40 text-danger font-semibold text-sm hover:bg-red-900/20 transition';
    deleteBtn.textContent = t('deleteAccount');
    deleteBtn.addEventListener('click', async () => {
      if (!confirm(t('deleteAccountConfirm'))) return;
      if (!confirm(t('deleteAccountFinal'))) return;
      await supabase.from('profiles').delete().eq('id', currentUserId);
      stopHeartbeat(); clearTimeout(inactivityTimer);
      await supabase.auth.signOut();
      location.href = "user_login.html";
    });
    bottom.appendChild(logoutBtn);
    bottom.appendChild(deleteBtn);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) setOnlineStatus(false);
      else { setOnlineStatus(true); resetInactivity(); }
    });
  }

  async function loadProfile() {
    const { data } = await supabase.from('profiles').select('*').eq('id', currentUserId).single();
    return data;
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
