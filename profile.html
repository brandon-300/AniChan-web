<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{font-weight:800;font-size:20px;white-space:nowrap}
  .brand span{color:var(--accent)}
  .header-actions{display:flex;gap:8px;align-items:center}
  .btn{
    padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    cursor:pointer;transition:all .15s;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent);background:var(--card)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#0a2a28}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:transparent;border-color:rgba(255,71,87,.25);color:var(--danger)}
  .btn.danger:hover{background:rgba(255,71,87,.12)}

  .container{max-width:700px;margin:24px auto;padding:0 16px;width:100%;flex:1}

  .glass-panel{
    background:rgba(26,26,26,.70);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:20px;padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);margin-bottom:20px;
  }

  .profile-header{
    display:flex;align-items:center;gap:20px;
  }
  .avatar-section{position:relative;flex-shrink:0;width:90px;height:90px}
  .avatar-img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:2px solid var(--border);background:var(--panel);
  }
  .pencil-btn{
    position:absolute;bottom:2px;right:2px;
    width:28px;height:28px;border-radius:50%;
    background:var(--accent);color:#0a2a28;border:none;
    font-size:16px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5);
    transition:transform .1s;
  }
  .pencil-btn:active{transform:scale(0.95)}
  .pencil-btn:disabled{opacity:0.7;cursor:not-allowed;}

  .user-info{flex:1}
  .user-info h2{font-size:24px;margin-bottom:4px;font-weight:700}
  .user-info .username{color:var(--muted);font-size:14px}

  /* Status line – centered under name */
  .last-seen{
    color:var(--muted);font-size:12px;
    margin-top:8px;
    display:flex;align-items:center;gap:6px;
    justify-content:center;          /* center dot + text as a group */
  }

  .status-dot-inline{
    display:inline-block;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--offline);
    flex-shrink:0;
  }
  .status-dot-inline.online{background:var(--success)}

  .field-group{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
  .field{flex:1 1 calc(50% - 7px);min-width:200px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field input,.field select{
    width:100%;padding:12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field input[readonly]{opacity:0.8;cursor:default}

  .err-msg, .success-msg{display:none}

  .lang-selector{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .lang-btn{
    padding:7px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:13px;font-weight:500;
    cursor:pointer;transition:all .15s;
  }
  .lang-btn:hover{border-color:var(--accent);background:var(--card)}

  .bottom-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .btn-red{
    background:var(--danger);color:#fff;border:none;
    padding:12px 24px;border-radius:12px;font-weight:600;font-size:14px;
    cursor:pointer;transition:filter .15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-red:hover{filter:brightness(1.1)}
  .btn-red:disabled{opacity:0.6;cursor:not-allowed;filter:none;}
  .avatar-upload-input{display:none}

  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:currentColor;
    border-radius:50%;animation:spin .6s linear infinite;
    vertical-align:middle;flex-shrink:0;
  }
  .btn.primary .btn-spinner{
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:#0a2a28;
  }
  .btn-red .btn-spinner{
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
  }
  .pencil-btn .btn-spinner{
    width:12px; height:12px;
    border-width:2px;
    border-color: rgba(0,0,0,0.2);
    border-top-color:#0a2a28;
  }

  /* Crop modal */
  .crop-modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .crop-modal.active { display: flex; }

  .crop-container {
    width: 100%; max-width: 500px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .crop-container h3 {
    color: var(--text); font-size: 18px; font-weight: 700;
    text-align: center; margin: 0;
  }
  .crop-image-wrapper {
    width: 100%; height: 350px;
    background: #000; border-radius: 12px; overflow: hidden;
  }
  .crop-image-wrapper img {
    max-width: 100%; max-height: 100%;
    display: block;
  }
  .crop-actions {
    display: flex; gap: 12px; justify-content: flex-end;
  }
  .crop-actions button {
    padding: 10px 20px; border-radius: 12px;
    font-weight: 600; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    transition: all 0.15s;
  }
  .crop-actions button:hover { background: var(--card); border-color: var(--accent); }
  .crop-actions button.primary {
    background: var(--accent); color: #0a2a28; border-color: transparent;
  }
  .crop-actions button.primary:hover { filter: brightness(1.08); }

  /* Toast Notification */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  footer{padding:16px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:20px}

  @media(max-width:500px){
    .profile-header{flex-direction:column;align-items:center;text-align:center}
    .user-info{text-align:center}
  }
</style>
</head>
<body>
  <header class="app">
    <div class="brand">Ani<span>Chan</span></div>
    <div class="header-actions" id="headerActions"><!-- dynamic --></div>
  </header>

  <main class="container">
    <div class="glass-panel">
      <div class="profile-header">
        <div class="avatar-section" id="avatarSection">
          <img class="avatar-img" id="avatarImg" src="" alt="Profile picture" />
          <button class="pencil-btn" id="pencilBtn" title="Change photo">
            <span class="material-symbols-outlined" style="font-size:16px">edit</span>
          </button>
          <input type="file" class="avatar-upload-input" id="avatarInput" accept="image/*" />
        </div>
        <div class="user-info">
          <h2 id="displayFullName">—</h2>
          <div class="username" id="displayUsername">@—</div>
          <div class="last-seen" id="displayLastSeen">
            <span class="status-dot-inline" id="statusDot"></span>
            <span id="statusText">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="glass-panel">
      <div class="field-group">
        <div class="field"><label for="fullNameInput">Full name</label><input id="fullNameInput" type="text" readonly /></div>
        <div class="field"><label for="usernameInput">Username</label><input id="usernameInput" type="text" readonly /></div>
      </div>
      <div class="field-group">
        <div class="field"><label for="emailInput">Email</label><input id="emailInput" type="email" readonly /></div>
        <div class="field"><label for="ageInput">Age</label><input id="ageInput" type="number" readonly /></div>
      </div>
      <div class="field-group">
        <div class="field"><label for="dobInput">Date of birth</label><input id="dobInput" type="date" readonly /></div>
        <div class="field"><label for="countryInput">Country</label><input id="countryInput" type="text" readonly /></div>
      </div>
      <div id="langSelectorContainer" style="display:none;">
        <label style="font-size:12px;color:var(--muted);margin-bottom:6px;display:block;">Language</label>
        <div class="lang-selector">
          <button class="lang-btn" onclick="setLanguage('en')">English</button>
          <button class="lang-btn" onclick="setLanguage('ja')">日本語</button>
        </div>
      </div>
    </div>

    <div class="bottom-actions" id="bottomActions"><!-- dynamic --></div>
  </main>

  <!-- Crop Modal -->
  <div class="crop-modal" id="cropModal">
    <div class="crop-container">
      <h3>Crop your photo</h3>
      <div class="crop-image-wrapper">
        <img id="cropImage" src="" alt="" />
      </div>
      <div class="crop-actions">
        <button id="cancelCropBtn">Cancel</button>
        <button id="confirmCropBtn" class="primary">Crop &amp; Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <footer>AniChan · powered by Supabase</footer>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUserId = null;
  let isOwner = false;
  let originalProfile = null;
  let isEditing = false;
  let cropper = null;

  const labelsMap = { fullNameInput:'fullName', usernameInput:'username', emailInput:'email', ageInput:'age', dobInput:'dob', countryInput:'country' };
  Object.entries(labelsMap).forEach(([id,key]) => { const el = $(id); if (el?.previousElementSibling) el.previousElementSibling.textContent = t(key); });

  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = $('toast');
    toast.textContent = msg;
    toast.className = type;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  let inactivityTimer;
  const INACTIVITY_LIMIT = 15 * 60 * 1000;
  function resetInactivity() { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(handleLogout, INACTIVITY_LIMIT); }
  function setupInactivity() { ['mousemove','keydown','mousedown','touchstart','scroll'].forEach(evt => document.addEventListener(evt, resetInactivity, { passive:true })); resetInactivity(); }

  let heartbeatInterval;
  function startHeartbeat() {
    heartbeatInterval = setInterval(async () => {
      if (!currentUserId || document.hidden) return;
      await supabase.from('profiles').update({ last_seen: new Date().toISOString(), is_online: true }).eq('id', currentUserId);
    }, 30000);
  }
  function stopHeartbeat() { clearInterval(heartbeatInterval); }

  async function setOnlineStatus(online) {
    if (!currentUserId) return;
    await supabase.from('profiles').update({ is_online: online, last_seen: new Date().toISOString() }).eq('id', currentUserId);
  }

  async function handleLogout() {
    if (currentUserId) await setOnlineStatus(false);
    stopHeartbeat(); clearTimeout(inactivityTimer);
    await supabase.auth.signOut();
    window.location.href = "index.html";
  }

  function renderProfile(profile) {
    originalProfile = { ...profile };
    $('avatarImg').src = profile?.avatar_url || DEFAULT_AVATAR;
    $('avatarImg').onerror = () => { $('avatarImg').src = DEFAULT_AVATAR; };

    const dot = $('statusDot');
    const textEl = $('statusText');
    if (profile?.is_online) {
      dot.classList.add('online');
      textEl.textContent = t('online');
    } else {
      dot.classList.remove('online');
      textEl.textContent = profile?.last_seen ? t('lastSeen') + ': ' + new Date(profile.last_seen).toLocaleString() : t('lastSeen') + ': —';
    }

    $('displayFullName').textContent = profile?.full_name || '—';
    $('displayUsername').textContent = profile?.username ? '@' + profile.username : '@—';
    $('fullNameInput').value = profile?.full_name || '';
    $('usernameInput').value = profile?.username || '';
    $('emailInput').value = profile?.email || '';
    $('ageInput').value = profile?.age != null ? profile.age : '';
    $('dobInput').value = profile?.dob || '';
    $('countryInput').value = profile?.country || '';
  }

  function setEditMode(enabled) {
    isEditing = enabled;
    ['fullNameInput','usernameInput','emailInput','ageInput','dobInput','countryInput'].forEach(id => {
      $(id)[enabled ? 'removeAttribute' : 'setAttribute']('readonly', true);
    });
    updateHeaderButtons();
  }

  function setButtonLoading(btn, loading, label) {
    if (loading) {
      btn._originalHTML = btn.innerHTML;
      btn._originalDisabled = btn.disabled;
      btn.disabled = true;
      btn.innerHTML = `<span class="btn-spinner"></span> ${label || ''}`;
    } else {
      btn.innerHTML = btn._originalHTML || btn.innerHTML;
      btn.disabled = btn._originalDisabled || false;
      delete btn._originalHTML;
      delete btn._originalDisabled;
    }
  }

  function updateHeaderButtons() {
    const container = $('headerActions');
    container.innerHTML = '';

    const backBtn = document.createElement('button');
    backBtn.className = 'btn';
    backBtn.innerHTML = '<span class="material-symbols-outlined">arrow_back</span> Back';
    backBtn.addEventListener('click', () => {
      if (document.referrer && document.referrer !== window.location.href) history.back();
      else window.location.href = "index.html";
    });
    container.appendChild(backBtn);

    if (!isOwner) {
      const msgBtn = document.createElement('button');
      msgBtn.className = 'btn primary';
      msgBtn.textContent = '💬 ' + t('message');
      msgBtn.addEventListener('click', startChat);
      container.appendChild(msgBtn);
      return;
    }

    $('langSelectorContainer').style.display = 'block';

    if (isEditing) {
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn primary'; saveBtn.textContent = t('save');
      saveBtn.addEventListener('click', async () => {
        setButtonLoading(saveBtn, true, t('save'));
        await saveProfile();
        setButtonLoading(saveBtn, false);
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn'; cancelBtn.textContent = t('cancel');
      cancelBtn.addEventListener('click', cancelEdit);
      container.appendChild(saveBtn);
      container.appendChild(cancelBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn primary'; editBtn.textContent = t('editProfile');
      editBtn.addEventListener('click', () => setEditMode(true));
      container.appendChild(editBtn);
    }
  }

  function cancelEdit() {
    if (originalProfile) renderProfile(originalProfile);
    setEditMode(false);
  }

  async function saveProfile() {
    const fullName = $('fullNameInput').value.trim();
    const username = $('usernameInput').value.trim();
    const email = $('emailInput').value.trim();
    const age = parseInt($('ageInput').value) || null;
    const dob = $('dobInput').value;
    const country = $('countryInput').value.trim();

    if (!fullName || !username || !email) { showToast(t('allFieldsRequired'), 'error'); return; }
    if (age && age < 14) { showToast(t('ageMin14'), 'error'); return; }

    try {
      const { data: exist } = await supabase.from('profiles').select('id').eq('username', username).neq('id', currentUserId).maybeSingle();
      if (exist) { showToast(t('usernameTaken'), 'error'); return; }
      const updates = { full_name: fullName, username, email, age: age || null, dob: dob || null, country: country || null };
      const { error } = await supabase.from('profiles').update(updates).eq('id', currentUserId);
      if (error) throw error;
      $('displayFullName').textContent = fullName;
      $('displayUsername').textContent = '@' + username;
      showToast(t('profileUpdated'), 'success');
      setEditMode(false);
    } catch(e) { showToast(e.message, 'error'); }
  }

  function openCropModal(file) {
    if (cropper) { cropper.destroy(); cropper = null; }
    const reader = new FileReader();
    reader.onload = (e) => {
      $('cropImage').src = e.target.result;
      $('cropModal').classList.add('active');
      cropper = new Cropper($('cropImage'), {
        aspectRatio: 1,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 1,
        cropBoxResizable: false,
        background: false
      });
    };
    reader.readAsDataURL(file);
  }

  function closeCropModal() {
    $('cropModal').classList.remove('active');
    if (cropper) { cropper.destroy(); cropper = null; }
    $('cropImage').src = '';
    $('avatarInput').value = '';
  }

  async function handleCropConfirm() {
    if (!cropper) return;
    const confirmBtn = $('confirmCropBtn');
    setButtonLoading(confirmBtn, true, 'Uploading…');
    try {
      const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', 0.9));
      const formData = new FormData();
      formData.append('file', blob, 'avatar.webp');
      formData.append('userId', currentUserId);
      const response = await fetch('/api/resize-avatar', { method: 'POST', body: formData });
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || 'Upload failed');
      }
      const { url } = await response.json();
      if (!url) throw new Error('No URL returned from server');
      const { error: updateErr } = await supabase.from('profiles').update({ avatar_url: url }).eq('id', currentUserId);
      if (updateErr) throw new Error('DB update failed: ' + updateErr.message);
      $('avatarImg').src = url;
      showToast(t('avatarUpdated'), 'success');
      closeCropModal();
    } catch (err) { showToast(err.message, 'error'); }
    finally { setButtonLoading(confirmBtn, false); }
  }

  $('cancelCropBtn').addEventListener('click', closeCropModal);
  $('confirmCropBtn').addEventListener('click', handleCropConfirm);
  $('pencilBtn').addEventListener('click', () => $('avatarInput').click());
  $('avatarInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    openCropModal(file);
  });

  async function startChat() {
    const otherUserId = new URLSearchParams(window.location.search).get('user');
    if (!otherUserId || otherUserId === currentUserId) return;
    const { data: room } = await supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUserId},user_two_id.eq.${otherUserId}),and(user_one_id.eq.${otherUserId},user_two_id.eq.${currentUserId})`)
      .maybeSingle();
    if (room) { location.href = "chat.html?room=" + room.id; }
    else {
      const { data: newRoom, error } = await supabase.from('chat_rooms').insert({ user_one_id: currentUserId, user_two_id: otherUserId }).select('id').single();
      if (error) { alert('Could not create room.'); return; }
      location.href = "chat.html?room=" + newRoom.id;
    }
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = "user_login.html"; return; }
    currentUserId = session.user.id;
    const viewUserId = new URLSearchParams(window.location.search).get('user');

    if (viewUserId && viewUserId !== currentUserId) {
      isOwner = false;
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', viewUserId).single();
      if (!profile) { alert('User not found'); history.back(); return; }
      renderProfile(profile);
      $('pencilBtn').style.display = 'none';
      $('bottomActions').innerHTML = '';
      updateHeaderButtons();
      return;
    }

    isOwner = true;
    await setOnlineStatus(true);
    setupInactivity();
    startHeartbeat();

    const profile = await loadProfile();
    if (profile) renderProfile(profile); else renderProfile({});
    updateHeaderButtons();

    const bottom = $('bottomActions');
    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'btn-red';
    logoutBtn.innerHTML = '<span class="material-symbols-outlined">logout</span> ' + t('logout');
    logoutBtn.addEventListener('click', async () => {
      setButtonLoading(logoutBtn, true, 'Logging out…');
      await handleLogout();
    });
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn-red';
    deleteBtn.style.background = 'transparent';
    deleteBtn.style.border = '1px solid rgba(255,71,87,.25)';
    deleteBtn.style.color = 'var(--danger)';
    deleteBtn.textContent = t('deleteAccount');
    deleteBtn.addEventListener('click', async () => {
      if (!confirm(t('deleteAccountConfirm'))) return;
      if (!confirm(t('deleteAccountFinal'))) return;
      setButtonLoading(deleteBtn, true, 'Deleting…');
      await supabase.from('profiles').delete().eq('id', currentUserId);
      stopHeartbeat(); clearTimeout(inactivityTimer);
      await supabase.auth.signOut();
      location.href = "user_login.html";
    });
    bottom.appendChild(logoutBtn);
    bottom.appendChild(deleteBtn);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { setOnlineStatus(true); resetInactivity(); }
    });
  }

  async function loadProfile() {
    const { data } = await supabase.from('profiles').select('*').eq('id', currentUserId).single();
    return data;
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
