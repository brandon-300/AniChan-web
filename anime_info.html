<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Anime Info</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .brand{font-weight:800;font-size:20px}
  .brand span{color:var(--accent)}
  .back-btn{
    background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;
    padding:0 8px;line-height:1;
  }
  .header-actions{display:flex;align-items:center;gap:8px}

  .container{max-width:700px;margin:0 auto;padding:0 16px 40px;width:100%;flex:1}

  /* ── Hero section – poster centred, no text inside ── */
  .hero{
    position:relative;width:100%;aspect-ratio:16/9;
    background-size:cover;background-position:center;
    border-radius:0 0 20px 20px;overflow:hidden;
    margin-bottom:0;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 60%, rgba(0,0,0,.2) 100%);
  }
  .hero-poster{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:140px; height:200px;
    object-fit:cover; border-radius:12px;
    border:2px solid var(--border); background:var(--panel);
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }

  /* ── Title section (outside hero) ── */
  .title-section{
    text-align:center;
    padding:20px 16px 10px;
  }
  .title-section h1{
    font-size:26px;font-weight:800;line-height:1.2;
    color:#fff;
  }
  .title-section .jp-title{
    font-size:14px;color:var(--muted);margin-top:6px;
  }

  /* Tabs */
  .tabs{
    display:flex;gap:0;margin:20px 0;
    border-bottom:1px solid var(--border);
  }
  .tab{
    flex:1;padding:10px;text-align:center;font-weight:600;font-size:14px;
    color:var(--muted);cursor:pointer;transition:color .15s;
    position:relative;
  }
  .tab.active{color:var(--accent)}
  .tab.active::after{
    content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;
    background:var(--accent);border-radius:2px 2px 0 0;
  }

  .tab-content{display:none}
  .tab-content.active{display:block}

  /* Synopsis */
  .synopsis-text{
    line-height:1.7;margin-bottom:24px;font-size:14px;color:var(--text);
  }

  /* Metadata list */
  .meta-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .meta-row{display:flex;flex-wrap:wrap;gap:4px 8px}
  .meta-label{font-weight:700;font-size:14px;min-width:100px}
  .meta-value{font-size:14px;color:var(--muted)}
  .accent-value{color:var(--accent);font-weight:600;text-decoration:none !important}

  /* Genre chips */
  .genres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .genre-chip{
    padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;
    background:rgba(81,218,211,.12);border:1px solid rgba(81,218,211,.25);
    color:var(--accent);cursor:pointer;transition:background .15s;
    text-decoration:none;
  }
  .genre-chip:hover{background:rgba(81,218,211,.25)}

  /* Episode grid */
  .episode-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;
    margin-bottom:20px;
  }
  .ep-card{
    aspect-ratio:16/9;background:var(--panel);border:2px solid var(--border);
    border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;
    position:relative;
  }
  .ep-card.watched{border-color:var(--accent);background:rgba(81,218,211,.08)}
  .ep-card:hover{border-color:var(--accent)}
  .ep-card .play-icon{font-size:24px;color:var(--muted)}
  .ep-card.watched .play-icon{color:var(--accent)}

  /* Recommendations */
  .rec-list{display:flex;flex-direction:column;gap:12px}
  .rec-item{display:flex;gap:12px;align-items:center;cursor:pointer;
    padding:10px;border-radius:14px;transition:background .15s;
    border:1px solid var(--border);background:var(--card);
  }
  .rec-item:hover{background:var(--panel);border-color:var(--accent)}
  .rec-img{width:60px;height:85px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .rec-info{flex:1;min-width:0}
  .rec-title{font-weight:700;font-size:14px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rec-meta{font-size:12px;color:var(--muted);margin-top:4px}

  .external-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .ext-link{
    padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;
    background:var(--panel);border:1px solid var(--border);color:var(--accent);
    text-decoration:none;transition:background .15s;
  }
  .ext-link:hover{background:var(--card)}

  .admin-edit-btn{ margin-bottom:16px;display:none; }
</style>
</head>
<body>
  <header class="app">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="brand">Ani<span>Chan</span></div>
    <div class="header-actions" id="headerActions"><!-- admin edit button here --></div>
  </header>

  <!-- HERO: background + centred poster only -->
  <div class="hero" id="heroBg">
    <div class="hero-overlay"></div>
    <img class="hero-poster" id="heroPoster" src="" alt="Poster" />
  </div>

  <!-- Title outside the hero -->
  <div class="title-section">
    <h1 id="heroTitle"></h1>
    <div class="jp-title" id="heroJpTitle"></div>
  </div>

  <main class="container">
    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="summary">Summary</div>
      <div class="tab" data-tab="recommendations">Recommendations</div>
    </div>

    <!-- Summary -->
    <div class="tab-content active" id="summaryTab">
      <div class="synopsis-text" id="synopsis">Loading synopsis...</div>

      <div class="meta-list" id="metaList"></div>
      <div class="genres" id="genreTags"></div>
      <div class="external-links" id="extLinks"></div>

      <h3 style="margin-bottom:12px;font-size:16px">Episodes</h3>
      <div class="episode-grid" id="episodeGrid"></div>
    </div>

    <!-- Recommendations -->
    <div class="tab-content" id="recommendationsTab">
      <h3 style="margin-bottom:16px;font-weight:700;font-size:18px">ANIME YOU MIGHT LIKE</h3>
      <div class="rec-list" id="recList"></div>
    </div>
  </main>

  <script>
  (() => {
    const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
    const ADMIN_EMAIL = "g09649009@gmail.com";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = id => document.getElementById(id);
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
    );

    const params = new URLSearchParams(window.location.search);
    const animeId = params.get('id');
    if (!animeId) { alert('No anime specified'); history.back(); return; }

    let animeData = null;
    let user = null;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        const target = tab.dataset.tab;
        if (target === 'summary') $('summaryTab').classList.add('active');
        else if (target === 'recommendations') $('recommendationsTab').classList.add('active');
      });
    });

    function seasonFromDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const m = d.getMonth();
      const y = d.getFullYear();
      let season = '';
      if (m >= 0 && m <= 2) season = 'Winter';
      else if (m >= 3 && m <= 5) season = 'Spring';
      else if (m >= 6 && m <= 8) season = 'Summer';
      else season = 'Fall';
      return `${season} ${y}`;
    }

    async function fetchSynopsisFromJikan(title) {
      try {
        const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(title)}&limit=1`);
        const data = await res.json();
        const match = data.data && data.data[0];
        if (match && match.synopsis) {
          sb.from('anime').update({ synopsis: match.synopsis }).eq('id', animeId).then();
          return match.synopsis;
        }
      } catch(e) { console.warn('Synopsis fetch failed', e); }
      return null;
    }

    async function loadAnime() {
      const { data, error } = await sb.from('anime').select('*').eq('id', animeId).single();
      if (error || !data) { alert('Anime not found'); history.back(); return; }
      animeData = data;

      // Hero background
      $('heroBg').style.backgroundImage = `url('${data.image_url || DEFAULT_AVATAR}')`;
      $('heroPoster').src = data.image_url || DEFAULT_AVATAR;

      // Title section (outside hero)
      $('heroTitle').textContent = data.title || 'Untitled';
      $('heroJpTitle').textContent = data.title_jp || '';

      // Synopsis
      let synopsis = data.synopsis || data.notes || null;
      if (!synopsis) {
        synopsis = await fetchSynopsisFromJikan(data.title);
        if (synopsis) animeData.synopsis = synopsis;
      }
      $('synopsis').textContent = synopsis || 'No synopsis available.';

      // Metadata
      const metaItems = [];
      if (data.title_jp) metaItems.push({ label: 'Japanese', value: data.title_jp });
      if (data.title_en) metaItems.push({ label: 'English', value: data.title_en });
      if (data.title_zh) metaItems.push({ label: 'Chinese', value: data.title_zh });
      if (data.title_de) metaItems.push({ label: 'German', value: data.title_de });
      if (data.title_fr) metaItems.push({ label: 'French', value: data.title_fr });
      metaItems.push(
        { label: 'Type',    value: data.type || '—', accent: true, typeLink: data.type ? `type.html?type=${encodeURIComponent(data.type)}` : null },
        { label: 'Episode', value: data.ep_total != null ? data.ep_total : '?' },
        { label: 'Status',  value: data.status || '—', accent: true },
        { label: 'Aired',   value: data.aired_from ? `${new Date(data.aired_from).toLocaleDateString()} to ${data.aired_to ? new Date(data.aired_to).toLocaleDateString() : '?'}` : '—' },
        { label: 'Season',  value: seasonFromDate(data.aired_from) || '—', accent: true, link: true },
        { label: 'Studios', value: data.studio || '—' },
        { label: 'Duration', value: data.duration || '—' }
      );

      const metaContainer = $('metaList');
      metaContainer.innerHTML = '';
      metaItems.forEach(m => {
        if (!m.value || m.value === '—' && m.label !== 'Duration') return;
        const row = document.createElement('div');
        row.className = 'meta-row';
        if (m.link) {
          const seasonStr = seasonFromDate(data.aired_from);
          if (!seasonStr) return;
          const [seasonName, year] = seasonStr.split(' ');
          row.innerHTML = `<span class="meta-label">${m.label}:</span><a href="season.html?season=${seasonName}&year=${year}" class="meta-value accent-value">${seasonStr}</a>`;
        } else if (m.typeLink) {
          row.innerHTML = `<span class="meta-label">${m.label}:</span><a href="${m.typeLink}" class="meta-value accent-value">${m.value}</a>`;
        } else {
          row.innerHTML = `<span class="meta-label">${m.label}:</span><span class="meta-value ${m.accent ? 'accent-value' : ''}">${m.value}</span>`;
        }
        metaContainer.appendChild(row);
      });

      // Genres (clickable)
      const genreContainer = $('genreTags');
      genreContainer.innerHTML = '';
      if (data.genres && Array.isArray(data.genres)) {
        data.genres.forEach(g => {
          const link = document.createElement('a');
          link.href = `genre.html?genre=${encodeURIComponent(g)}`;
          link.className = 'genre-chip';
          link.textContent = g;
          genreContainer.appendChild(link);
        });
      }

      // External links
      const query = encodeURIComponent(data.title);
      const extLinks = [
        { name: 'AniList', url: `https://anilist.co/search/anime?search=${query}` },
        { name: 'MAL',     url: `https://myanimelist.net/anime.php?q=${query}` },
        { name: 'AniDB',   url: `https://anidb.net/perl-bin/animedb.pl?show=anime&do.search=search&adb.search=${query}` },
        { name: 'Kitsu',   url: `https://kitsu.app/anime?text=${query}` }
      ];
      const extContainer = $('extLinks');
      extContainer.innerHTML = '';
      extLinks.forEach(link => {
        const a = document.createElement('a');
        a.className = 'ext-link'; a.href = link.url; a.target = '_blank'; a.textContent = link.name;
        extContainer.appendChild(a);
      });

      // Episode grid
      const epTotal = data.ep_total || 0;
      const grid = $('episodeGrid');
      grid.innerHTML = '';
      if (epTotal > 0 && user) {
        const { data: watched } = await sb.from('user_episode_progress')
          .select('episode_number')
          .eq('user_id', user.id)
          .eq('anime_id', animeId)
          .eq('watched', true);
        const watchedSet = new Set((watched || []).map(w => w.episode_number));
        for (let ep = 1; ep <= epTotal; ep++) {
          const card = document.createElement('div');
          card.className = `ep-card ${watchedSet.has(ep) ? 'watched' : ''}`;
          card.innerHTML = `<span class="play-icon">▶</span>`;
          card.title = `Episode ${ep}`;
          card.addEventListener('click', async () => {
            const isWatched = card.classList.contains('watched');
            if (isWatched) {
              await sb.from('user_episode_progress').delete().eq('user_id', user.id).eq('anime_id', animeId).eq('episode_number', ep);
              card.classList.remove('watched');
            } else {
              await sb.from('user_episode_progress').upsert({ user_id: user.id, anime_id: animeId, episode_number: ep, watched: true });
              card.classList.add('watched');
            }
          });
          grid.appendChild(card);
        }
      } else {
        grid.innerHTML = '<div style="color:var(--muted);font-size:13px">No episode data</div>';
      }

      // Duration fetch
      if (!data.duration) {
        try {
          const jikanRes = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(data.title)}&limit=1`);
          const jikanData = await jikanRes.json();
          const match = (jikanData.data && jikanData.data[0]);
          if (match && match.duration) {
            const durationRow = [...document.querySelectorAll('.meta-row')].find(r => r.querySelector('.meta-label')?.textContent === 'Duration:');
            if (durationRow) {
              durationRow.querySelector('.meta-value').textContent = match.duration;
              sb.from('anime').update({ duration: match.duration }).eq('id', animeId).then();
            }
          }
        } catch(e) {}
      }

      loadRecommendations();

      // Admin edit button
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user.email === ADMIN_EMAIL) {
        const editBtn = document.createElement('a');
        editBtn.className = 'btn';
        editBtn.href = `admin.html#anime-form-section`;
        editBtn.textContent = 'Edit in Admin';
        editBtn.style.cssText = 'margin-left:auto;padding:6px 12px;font-size:12px;';
        $('headerActions').appendChild(editBtn);
      }
    }

    async function loadRecommendations() {
      if (!animeData) return;
      try {
        const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(animeData.title)}&limit=1`);
        const data = await res.json();
        const match = data.data && data.data[0];
        if (!match || !match.mal_id) return;
        const recRes = await fetch(`https://api.jikan.moe/v4/anime/${match.mal_id}/recommendations`);
        if (!recRes.ok) return;
        const recData = await recRes.json();
        const list = recData.data || [];
        const container = $('recList');
        container.innerHTML = '';
        if (!list.length) {
          container.innerHTML = '<div style="color:var(--muted);padding:16px">No recommendations found.</div>';
          return;
        }
        list.slice(0, 10).forEach(rec => {
          const entry = rec.entry || {};
          const div = document.createElement('div');
          div.className = 'rec-item';
          div.innerHTML = `
            <img class="rec-img" src="${entry.images?.jpg?.image_url || ''}" onerror="this.src='${DEFAULT_AVATAR}'" />
            <div class="rec-info">
              <div class="rec-title">${entry.title || 'Untitled'}</div>
              <div class="rec-meta">${entry.type || '?'}${entry.episodes ? ' - ' + entry.episodes + ' eps' : ''}</div>
            </div>`;
          div.addEventListener('click', () => {
            sb.from('anime').select('id').eq('title', entry.title).maybeSingle().then(({data: dbAnime}) => {
              if (dbAnime) location.href = `anime_info.html?id=${dbAnime.id}`;
              else alert('Anime not in your collection yet.');
            });
          });
          container.appendChild(div);
        });
      } catch(e) { console.warn('Recommendations fetch failed', e); }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await sb.auth.getSession();
      user = session?.user || null;
      await loadAnime();
    });
  })();
  </script>
</body>
</html>
