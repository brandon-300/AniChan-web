<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
    --glow:0 0 12px rgba(81,218,211,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;overflow:hidden;display:flex;
    -webkit-font-smoothing:antialiased;
  }

  /* ── LAYOUT WRAPPER ── */
  .app-chat{
    display:flex;width:100%;height:100dvh;overflow:hidden;
    position:relative;
  }

  /* ── LEFT PANEL (Messages sidebar) ── */
  .left-panel{
    width:350px;height:100dvh;flex-shrink:0;
    background:#080b0d;display:flex;flex-direction:column;
    z-index:20;transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .left-panel-inner{display:flex;flex-direction:column;height:100%;padding:20px 16px}
  .panel-title{color:#fff;font-size:28px;font-weight:700;margin-bottom:16px}
  .search-wrap{margin-bottom:24px}
  .search-input{
    width:100%;background:#0c1214;border:2px solid var(--accent);border-radius:50px;
    padding:12px 20px;color:#fff;font-size:15px;outline:none;
    box-shadow:var(--glow);transition:box-shadow .2s;
  }
  .search-input::placeholder{color:#4a5d65}
  .chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .chat-item{
    display:flex;align-items:center;padding:12px;border-radius:14px;
    cursor:pointer;transition:background .2s,box-shadow .2s;
  }
  .chat-item.active{
    background:linear-gradient(135deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 100%);
    border:1px solid rgba(81,218,211,.25);
    box-shadow:0 0 18px rgba(81,218,211,.08);
  }
  .avatar-wrap{
    position:relative;width:50px;height:50px;margin-right:14px;flex-shrink:0;
  }
  .avatar-img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;background:#333;
  }
  .online-dot{
    position:absolute;bottom:1px;right:1px;width:12px;height:12px;
    border-radius:50%;border:2px solid #080b0d;
    background:var(--offline);
  }
  .online-dot.online{background:var(--success)}
  .chat-details{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .chat-header-row{display:flex;justify-content:space-between;align-items:center}
  .contact-name{color:#fff;font-weight:600;font-size:16px}
  .timestamp{color:#6c7c85;font-size:12px}
  .chat-body-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .msg-preview{
    color:#8fa0a8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .unread-badge{
    background:var(--accent);color:#0a0a0a;font-size:11px;font-weight:700;
    min-width:20px;height:20px;padding:0 6px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px rgba(81,218,211,.55);flex-shrink:0;
  }

  /* ── RIGHT PANEL (Chat room) ── */
  .right-panel{
    flex:1;display:flex;flex-direction:column;height:100dvh;min-width:0;
    background:var(--bg);position:relative;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .chat-header{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
    background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);flex-shrink:0;
  }
  .mobile-back{
    display:none;background:none;border:none;color:var(--accent);
    font-size:24px;cursor:pointer;padding:0 8px 0 0;
  }
  .avatar-link{display:block;flex-shrink:0;position:relative}
  .chat-avatar{
    width:40px;height:40px;border-radius:50%;object-fit:cover;
    border:2px solid var(--border);
  }
  .header-dot{
    position:absolute;bottom:1px;right:1px;width:10px;height:10px;
    border-radius:50%;border:2px solid var(--card);
    background:var(--offline);
  }
  .header-dot.online{background:var(--success)}
  .chat-partner-info{margin-left:8px}
  .partner-name{font-weight:600;font-size:15px}
  .partner-status{font-size:12px;color:var(--muted)}

  .chat-messages{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:8px;
    -webkit-overflow-scrolling:touch;
  }

  /* Message rows */
  .message-row{
    display:flex;flex-direction:column;margin-bottom:6px;width:100%;
  }
  .message-row.sent{align-items:flex-end}
  .message-row.received{align-items:flex-start}

  .message-box{
    padding:10px 14px;border-radius:16px;max-width:75%;
    font-size:14px;line-height:1.45;word-break:break-word;
  }
  .sent .message-box{
    background:var(--accent);color:#0a2a28;
    border-bottom-right-radius:4px;
    box-shadow:0 0 10px rgba(81,218,211,.25);
  }
  .received .message-box{
    background:var(--panel);color:var(--text);
    border-bottom-left-radius:4px;
  }
  .reply-preview{
    font-size:11px;margin-bottom:4px;padding-left:6px;
    border-left:2px solid rgba(0,0,0,.4);
    cursor:pointer;
  }
  .sent .reply-preview{color:rgba(0,0,0,.6);border-left-color:rgba(0,0,0,.4)}
  .received .reply-preview{color:var(--muted);border-left-color:var(--accent)}

  .message-meta{
    display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:3px;
  }
  .sent .message-meta{justify-content:flex-end}
  .status-icon{font-size:14px}
  .sent .status-icon.read{color:var(--accent)}

  .deleted-placeholder{
    padding:8px 14px;border-radius:12px;background:var(--panel);
    font-style:italic;color:var(--muted);font-size:13px;
    text-align:center;margin:8px auto;border:1px dashed var(--border);
    max-width:60%;
  }

  /* Reply bar above input */
  .reply-bar{
    background:var(--card);border-top:1px solid var(--border);
    padding:8px 16px;display:none;align-items:center;gap:8px;flex-shrink:0;
  }
  .reply-bar.show{display:flex}
  .reply-bar .quote{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reply-bar button{background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer}

  /* Typing */
  .typing-row{padding:4px 16px;flex-shrink:0;display:flex;align-items:center;gap:8px}
  .typing-dots{
    display:none;align-items:center;gap:4px;
    background:var(--panel);padding:6px 14px;border-radius:14px;
  }
  .typing-dots.active{display:flex}
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s}
  .typing-dots span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0)}
    30%{transform:translateY(-6px)}
  }
  .swipe-hint{font-size:11px;color:var(--muted)}

  /* Input area */
  .input-area{
    flex-shrink:0;border-top:1px solid var(--border);
    background:var(--card);padding:12px 16px;
    padding-bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:6px;
  }
  .input-row{display:flex;gap:8px}
  .msg-input{
    flex:1;padding:12px;border-radius:20px;
    background:var(--panel);border:2px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .msg-input:focus{
    border-color:var(--accent);
    box-shadow:var(--glow);
  }
  .send-btn{
    width:44px;height:44px;border-radius:50%;
    background:var(--accent);color:#0a2a28;
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;transition:filter .15s;flex-shrink:0;
  }
  .send-btn:hover{filter:brightness(1.1)}
  .send-btn .material-symbols-outlined{font-size:20px}

  /* Scroll button */
  .scroll-bottom{
    position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0a2a28;font-weight:700;font-size:12px;
    padding:6px 16px;border-radius:20px;cursor:pointer;
    display:none;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .scroll-bottom.show{display:block}

  /* Context menu */
  .context-menu{
    position:fixed;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:4px 0;min-width:160px;z-index:200;
    display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .context-menu button{
    display:block;width:100%;padding:10px 16px;border:none;
    background:none;color:var(--text);font-size:14px;text-align:left;
    cursor:pointer;transition:background .1s;
  }
  .context-menu button:hover{background:var(--panel)}
  .context-menu .danger{color:var(--danger)}
  .context-menu .divider{height:1px;background:var(--border);margin:2px 0}

  .empty-chat{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:20px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width:768px){
    .app-chat{flex-direction:column}
    .left-panel{
      position:absolute;top:0;left:0;width:100%;height:100dvh;
      transform:translateX(0);
    }
    .right-panel{
      position:absolute;top:0;left:0;width:100%;height:100dvh;
      transform:translateX(100%);
    }
    .right-panel.active{transform:translateX(0)}
    .left-panel.shifted{transform:translateX(-20%)}
    .mobile-back{display:block}
  }
  @media (min-width:769px){
    .left-panel{position:relative;transform:none}
    .right-panel{position:relative;transform:none}
    .mobile-back{display:none}
  }
</style>
</head>
<body>
<div class="app-chat" id="appChat">
  <!-- LEFT PANEL – Messages directory -->
  <div class="left-panel" id="leftPanel">
    <div class="left-panel-inner">
      <h1 class="panel-title">Messages</h1>
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="Search/new-chat" />
      </div>
      <div class="chat-list" id="roomList"></div>
    </div>
  </div>

  <!-- RIGHT PANEL – Active chat -->
  <div class="right-panel" id="rightPanel">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <button class="mobile-back" id="mobileBackBtn">←</button>
      <a class="avatar-link" id="chatAvatarLink" href="#" target="_blank">
        <img class="chat-avatar" id="chatPartnerAvatar" src="" alt="" />
        <div class="header-dot" id="chatPartnerDot"></div>
      </a>
      <div class="chat-partner-info">
        <div class="partner-name" id="chatPartnerName"></div>
        <div class="partner-status" id="chatPartnerStatus"></div>
      </div>
    </div>
    <div class="typing-row">
      <div class="typing-dots" id="typingDots">
        <span></span><span></span><span></span>
      </div>
      <div class="swipe-hint">Swipe to-reply ↶</div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-chat" id="emptyChatPlaceholder">
        Select a conversation to start chatting
      </div>
    </div>
    <div class="reply-bar" id="replyBar">
      <span class="quote" id="replyQuote"></span>
      <button id="cancelReplyBtn">✕</button>
    </div>
    <div class="input-area" id="inputArea" style="display:none;">
      <div class="input-row">
        <input type="text" class="msg-input" id="messageInput" placeholder="Type a message..." />
        <button class="send-btn" id="sendBtn">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
    <div class="scroll-bottom" id="scrollBottom">↓ New messages</div>
  </div>
</div>

<!-- Context menu (outside panels to avoid clipping) -->
<div class="context-menu" id="contextMenu">
  <button id="ctxEdit">Edit</button>
  <div class="divider"></div>
  <button id="ctxDeleteForMe" class="danger">Delete for me</button>
  <div class="divider"></div>
  <button id="ctxDeleteForEveryone" class="danger">Delete for everyone</button>
  <button id="ctxCancel" style="color:var(--muted)">Cancel</button>
</div>

<script>
/*
  AniChan Chat — Telegram‑style responsive dual panel
  Fully removes the old messages modal; homepage links directly here.
*/
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUser = null, activeRoom = null, partnerId = null;
  let rooms = [], filteredRooms = [];
  let messageSub = null, presenceSub = null;
  let replyToMessage = null, contextMsgId = null;
  let isSending = false;
  const DELETED_KEY = 'anichan_deleted_msgs';
  const sentMsgIds = new Set();

  function escapeHtml(t) { return t.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[m]); }
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    if (now - d < 86400000 && d.getDate() === now.getDate())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function formatChatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    const diff = now - d, mins = Math.floor(diff / 60000);
    if (mins < 1) return "Just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7) return `${days}d ago`;
    return d.toLocaleDateString();
  }

  async function updatePresence(status='online') {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, status, last_active: new Date().toISOString() });
  }
  async function setTyping(roomId, typing) {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, typing_in_room_id: typing ? roomId : null });
  }

  // ── Sidebar filtering & rendering ──
  function filterRooms(query) {
    const q = query.trim().toLowerCase();
    filteredRooms = q ? rooms.filter(r => (r.other_user.full_name || r.other_user.username).toLowerCase().includes(q)) : [...rooms];
    renderRoomList(filteredRooms);
  }

  function renderRoomList(roomsData) {
    const list = $('roomList'); list.innerHTML = '';
    if (!roomsData.length) { list.innerHTML = '<div style="padding:16px;color:var(--muted);text-align:center">No conversations</div>'; return; }
    roomsData.forEach(room => {
      const o = room.other_user;
      const div = document.createElement('div');
      div.className = 'chat-item' + (activeRoom===room.id ? ' active' : '');
      div.innerHTML = `
        <div class="avatar-wrap">
          <img src="${o.avatar_url || DEFAULT_AVATAR}" class="avatar-img" onerror="this.src='${DEFAULT_AVATAR}'" />
          <div class="online-dot ${o.is_online ? 'online' : ''}"></div>
        </div>
        <div class="chat-details">
          <div class="chat-header-row">
            <span class="contact-name">${escapeHtml(o.full_name || o.username)}</span>
            <span class="timestamp">${formatChatTime(room.last_message_time)}</span>
          </div>
          <div class="chat-body-row">
            <p class="msg-preview">${escapeHtml(room.last_message || '')}</p>
            ${room.unread_count ? `<span class="unread-badge">${room.unread_count}</span>` : ''}
          </div>
        </div>`;
      div.addEventListener('click', () => openRoom(room.id, o.id));
      list.appendChild(div);
    });
  }

  async function loadRooms() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('chat_rooms')
      .select(`id, last_message, last_message_time, user_one_id, user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id, username, full_name, avatar_url, is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id, username, full_name, avatar_url, is_online)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time', { ascending: false });
    if (error) { console.error(error); return; }
    const enriched = [];
    for (const room of data) {
      const partner = room.user_one_id === currentUser.id ? room.user_two : room.user_one;
      const { count } = await supabase.from('messages').select('*', { count:'exact', head:true })
        .eq('room_id', room.id).eq('receiver_id', currentUser.id).eq('is_read', false);
      enriched.push({ id: room.id, last_message: room.last_message, last_message_time: room.last_message_time, other_user: partner, unread_count: count||0 });
    }
    rooms = enriched;
    filterRooms($('searchInput').value);
  }

  // ── Open room ──
  async function openRoom(roomId, otherUserId) {
    activeRoom = roomId; partnerId = otherUserId;
    $('emptyChatPlaceholder').style.display = 'none';
    $('chatHeader').style.display = 'flex';
    $('inputArea').style.display = 'flex';
    const { data: p } = await supabase.from('profiles').select('username, full_name, avatar_url, is_online, last_seen').eq('id', otherUserId).single();
    if (p) {
      $('chatPartnerAvatar').src = p.avatar_url || DEFAULT_AVATAR;
      $('chatPartnerName').textContent = p.full_name || p.username;
      $('chatPartnerStatus').textContent = p.is_online ? 'Online' : (p.last_seen ? `last-seen ${formatChatTime(p.last_seen)}` : 'Offline');
      $('chatAvatarLink').href = `profile.html?user=${otherUserId}`;
      $('chatPartnerDot').classList.toggle('online', p.is_online);
    }
    renderRoomList(filteredRooms);
    await loadMessages(roomId);
    subscribeToMessages(roomId);
    $('typingDots').classList.remove('active');

    // Mobile transition
    if (window.innerWidth <= 768) {
      $('leftPanel').classList.add('shifted');
      $('rightPanel').classList.add('active');
    }
  }

  function closeRoomMobile() {
    $('leftPanel').classList.remove('shifted');
    $('rightPanel').classList.remove('active');
  }

  $('mobileBackBtn').addEventListener('click', closeRoomMobile);

  // ── Messages (stable row structure) ──
  async function loadMessages(roomId) {
    const { data, error } = await supabase.from('messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    sentMsgIds.clear();
    renderMessages(data);
    const unreadIds = data.filter(m => m.receiver_id === currentUser.id && !m.is_read).map(m => m.id);
    if (unreadIds.length) { await supabase.from('messages').update({ is_read: true }).in('id', unreadIds); loadRooms(); }
  }

  function renderMessages(msgs) {
    $('chatMessages').innerHTML = '';
    const deleted = getDeletedSet();
    msgs.filter(m => !deleted.has(m.id)).forEach(addMessageElement);
    checkScroll();
  }

  function addMessageElement(msg) {
    const box = $('chatMessages'), isSent = msg.sender_id === currentUser.id;

    if (msg.is_deleted) {
      const place = document.createElement('div');
      place.className = 'deleted-placeholder';
      place.textContent = 'This message was deleted';
      box.appendChild(place);
      checkScroll();
      return;
    }

    const row = document.createElement('div');
    row.className = `message-row ${isSent ? 'sent' : 'received'}`;
    row.dataset.msgId = msg.id;

    let replyHtml = '';
    if (msg.reply_to) {
      const originalEl = document.querySelector(`.message-row[data-msg-id="${msg.reply_to}"]`);
      const quoted = originalEl ? originalEl.querySelector('.message-box')?.textContent?.trim() || 'Message' : 'Message';
      replyHtml = `<div class="reply-preview" data-reply-to="${msg.reply_to}">${escapeHtml(quoted)}</div>`;
    }

    let content = escapeHtml(msg.message || '');
    if (msg.edited_at) content += ' <small style="opacity:0.7">(edited)</small>';

    row.innerHTML = `
      <div class="message-box">${replyHtml}${content}</div>
      <div class="message-meta">
        <span class="time">${formatTime(msg.created_at)}</span>
        ${isSent ? '<span class="material-symbols-outlined status-icon read" style="font-size:14px">done_all</span>' : ''}
      </div>`;

    const replyDiv = row.querySelector('.reply-preview');
    if (replyDiv) {
      replyDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = replyDiv.dataset.replyTo;
        const target = document.querySelector(`.message-row[data-msg-id="${targetId}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.background = 'var(--panel)';
          setTimeout(() => target.style.background = '', 1500);
        }
      });
    }

    attachSwipe(row, msg);
    if (isSent) {
      row.addEventListener('touchstart', (e) => startLongPress(e, msg));
      row.addEventListener('touchend', cancelLongPress);
      row.addEventListener('touchmove', cancelLongPress);
    }

    box.appendChild(row);
    checkScroll();
  }

  function checkScroll() {
    const box = $('chatMessages');
    const near = box.scrollHeight - box.clientHeight <= box.scrollTop + 30;
    $('scrollBottom').classList.toggle('show', !near && box.scrollHeight > box.clientHeight);
    if (near) box.scrollTop = box.scrollHeight;
  }
  $('scrollBottom').addEventListener('click', () => {
    const box = $('chatMessages');
    box.scrollTop = box.scrollHeight;
    $('scrollBottom').classList.remove('show');
  });

  // ── Swipe reply ──
  function attachSwipe(el, msg) {
    let sx = 0;
    el.addEventListener('touchstart', e => sx = e.touches[0].clientX);
    el.addEventListener('touchend', e => {
      if ((e.changedTouches[0]?.clientX || sx) - sx > 80) setReply(msg);
    });
  }
  function setReply(msg) {
    if (msg.is_deleted) return;
    replyToMessage = { id: msg.id, sender: msg.sender_id, content: msg.message || '' };
    $('replyQuote').textContent = replyToMessage.content.substring(0, 60);
    $('replyBar').classList.add('show');
    $('messageInput').focus();
  }
  $('cancelReplyBtn').addEventListener('click', () => {
    replyToMessage = null;
    $('replyBar').classList.remove('show');
  });

  // ── Long press ──
  let longTimer;
  function startLongPress(e, msg) { longTimer = setTimeout(() => showCtx(e, msg), 500); }
  function cancelLongPress() { clearTimeout(longTimer); }
  function showCtx(e, msg) {
    if (msg.is_deleted) return;
    contextMsgId = msg.id;
    const m = $('contextMenu');
    const can = (Date.now() - new Date(msg.created_at).getTime()) < 15 * 60 * 1000;
    $('ctxEdit').style.display = can ? 'block' : 'none';
    m.style.display = 'block';
    m.style.left = Math.min(e.touches[0].clientX, window.innerWidth - 180) + 'px';
    m.style.top = (e.touches[0].clientY - 100) + 'px';
  }
  document.addEventListener('click', e => { if (!$('contextMenu').contains(e.target)) $('contextMenu').style.display = 'none'; });
  $('ctxEdit').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    const c = prompt('Edit message:');
    if (!c) return;
    supabase.from('messages').update({ message: c, edited_at: new Date().toISOString() }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Edit failed');
      else loadMessages(activeRoom);
    });
  });
  $('ctxDeleteForMe').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    addDeleted(contextMsgId); loadMessages(activeRoom);
  });
  $('ctxDeleteForEveryone').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    if (!confirm('Delete for everyone?')) return;
    supabase.from('messages').update({ is_deleted: true }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Delete failed');
      else loadMessages(activeRoom);
    });
  });
  $('ctxCancel').addEventListener('click', () => $('contextMenu').style.display = 'none');

  // ── Send ──
  async function sendMessage() {
    const input = $('messageInput'), text = input.value.trim();
    if (!text || !activeRoom || !partnerId || isSending) return;
    input.value = '';
    isSending = true;
    const tmpId = 'tmp-'+Date.now();
    const tmpRow = document.createElement('div');
    tmpRow.className = 'message-row sent';
    tmpRow.dataset.msgId = tmpId;
    tmpRow.innerHTML = `<div class="message-box">${escapeHtml(text)}</div><div class="message-meta"><span class="time" style="color:var(--muted)">sending…</span></div>`;
    $('chatMessages').appendChild(tmpRow);
    checkScroll();

    const payload = {
      room_id: activeRoom, sender_id: currentUser.id, receiver_id: partnerId,
      message: text, msg_type: 'text',
      reply_to: replyToMessage?.id || null
    };
    if (replyToMessage) { replyToMessage = null; $('replyBar').classList.remove('show'); }

    const { data: ins, error } = await supabase.from('messages').insert(payload).select().single();
    const meta = tmpRow.querySelector('.message-meta');
    if (error) {
      meta.innerHTML = '<span style="color:var(--danger)">not sent</span>';
    } else if (ins) {
      sentMsgIds.add(ins.id);
      tmpRow.dataset.msgId = ins.id;
      meta.innerHTML = `<span class="time">${formatTime(ins.created_at)}</span> <span class="material-symbols-outlined status-icon read" style="font-size:14px">done_all</span>`;
      await supabase.from('chat_rooms').update({ last_message: text, last_message_time: new Date().toISOString() }).eq('id', activeRoom);
      loadRooms();
    }
    isSending = false;
  }

  // ── Realtime ──
  function subscribeToMessages(roomId) {
    if (messageSub) supabase.removeChannel(messageSub);
    messageSub = supabase.channel(`room:${roomId}`)
      .on('postgres_changes', { event:'*', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` }, payload => {
        if (payload.eventType === 'INSERT') {
          const nm = payload.new;
          if (!sentMsgIds.has(nm.id) && !document.querySelector(`.message-row[data-msg-id="${nm.id}"]`)) {
            addMessageElement(nm);
            if (nm.receiver_id === currentUser.id) supabase.from('messages').update({ is_read:true }).eq('id', nm.id).then();
          }
        } else if (payload.eventType === 'UPDATE') {
          loadMessages(roomId);
        }
      }).subscribe();
  }

  // ── Typing ──
  let typingTO;
  $('messageInput').addEventListener('input', () => {
    if (!activeRoom) return;
    setTyping(activeRoom, true); clearTimeout(typingTO);
    typingTO = setTimeout(() => setTyping(activeRoom, false), 3000);
  });
  if (presenceSub) supabase.removeChannel(presenceSub);
  presenceSub = supabase.channel('presence-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'user_presence' }, payload => {
      if (partnerId && payload.new && payload.new.user_id === partnerId) {
        $('typingDots').classList.toggle('active', payload.new.typing_in_room_id === activeRoom);
      }
    }).subscribe();

  // ── New chat / search ──
  $('searchInput').addEventListener('input', () => filterRooms($('searchInput').value));
  $('searchInput').addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      const u = e.target.value.trim();
      if (!u) return;
      const match = filteredRooms.find(r => (r.other_user.username||'').toLowerCase() === u.toLowerCase());
      if (match) { openRoom(match.id, match.other_user.id); e.target.value = ''; }
      else { e.target.value = ''; await createRoom(u); }
    }
  });
  async function createRoom(username) {
    if (!currentUser) return;
    const { data: user } = await supabase.from('profiles').select('id, username').eq('username', username).maybeSingle();
    if (!user) { alert('User not found'); return; }
    if (user.id === currentUser.id) { alert('Cannot message yourself'); return; }
    const { data: exist } = await supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUser.id},user_two_id.eq.${user.id}),and(user_one_id.eq.${user.id},user_two_id.eq.${currentUser.id})`).maybeSingle();
    if (exist) { openRoom(exist.id, user.id); return; }
    const { data: nr, error } = await supabase.from('chat_rooms').insert({ user_one_id: currentUser.id, user_two_id: user.id }).select('id').single();
    if (error) { alert('Room creation failed'); return; }
    loadRooms(); openRoom(nr.id, user.id);
  }

  // ── Deleted for me ──
  function getDeletedSet() { try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY)||'[]')); } catch { return new Set(); } }
  function addDeleted(id) { const s = getDeletedSet(); s.add(id); localStorage.setItem(DELETED_KEY, JSON.stringify([...s])); }

  // ── Lifecycle ──
  window.addEventListener('beforeunload', () => updatePresence('offline'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) updatePresence('idle'); else { updatePresence('online'); loadRooms(); }
  });
  setInterval(loadRooms, 30000);

  async function logout() { await updatePresence('offline'); await supabase.auth.signOut(); window.location.href = 'index.html'; }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'user_login.html'; return; }
    currentUser = session.user;
    await updatePresence('online'); await loadRooms();

    const rp = new URLSearchParams(window.location.search).get('room');
    if (rp) {
      const { data: room } = await supabase.from('chat_rooms').select('user_one_id, user_two_id').eq('id', rp).single();
      if (room) openRoom(rp, room.user_one_id === currentUser.id ? room.user_two_id : room.user_one_id);
      else { alert('Chat room not found.'); window.history.replaceState({}, document.title, window.location.pathname); }
    }

    supabase.channel('public:chat_rooms').on('postgres_changes', { event:'*', schema:'public', table:'chat_rooms' }, () => loadRooms()).subscribe();
    $('sendBtn').addEventListener('click', sendMessage);
    $('messageInput').addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });

    const lb = document.createElement('button'); lb.textContent='Logout';
    lb.style.cssText = 'background:transparent;border:1px solid rgba(255,71,87,.25);color:var(--danger);padding:6px 12px;border-radius:10px;cursor:pointer;margin-left:auto;font-size:13px;font-weight:600;';
    lb.addEventListener('click', logout);
    document.querySelector('.left-panel-inner').appendChild(lb);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
