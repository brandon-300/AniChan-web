<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d0d0d; --card: #161616; --panel: #1a1a1a;
    --accent: #1db9b2; --danger: #ff4757;
    --text: #f1f1f1; --muted: #9aa0a6; --border: #222;
    --success: #2ed573; --offline: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    height: 100dvh; overflow: hidden; display: flex;
  }

  /* SIDEBAR */
  .sidebar {
    width: 320px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 10;
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-header h2 { font-size: 16px; flex: 1; }
  .back-btn {
    display: none; background: none; border: none; color: var(--accent);
    font-size: 20px; cursor: pointer;
  }
  .new-chat { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .new-chat input {
    width: 100%; padding: 10px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .new-chat input:focus { border-color: var(--accent); }
  .room-list { flex: 1; overflow-y: auto; padding: 0 0 16px; }
  .room {
    display: flex; align-items: center; padding: 12px 16px;
    cursor: pointer; transition: background 0.15s; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .room:hover, .room.active { background: var(--panel); }
  .room .avatar {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
    background: var(--panel); border: 2px solid var(--border); flex-shrink: 0;
  }
  .room .info { flex: 1; min-width: 0; }
  .room .name {
    font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px;
  }
  .online-badge {
    width: 10px; height: 10px; border-radius: 50%; background: var(--offline);
  }
  .online-badge.online { background: var(--success); }
  .room .preview {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .room .preview.unread { font-weight: bold; color: var(--text); }
  .room .meta { text-align: right; flex-shrink: 0; }
  .room .time { font-size: 11px; color: var(--muted); }
  .room .unread {
    display: inline-block; background: var(--accent); color: #062525;
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; margin-top: 4px;
  }

  /* CHAT AREA */
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--card);
    flex-shrink: 0;
  }
  .chat-header .header-back-arrow {
    background: none; border: none; color: var(--accent);
    font-size: 24px; cursor: pointer; padding: 0 8px 0 0;
  }
  .chat-header .avatar-link { display: block; flex-shrink: 0; }
  .chat-header .avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--border);
  }
  .chat-header .name { font-weight: 600; }
  .chat-header .status { font-size: 12px; color: var(--muted); }
  .chat-header .last-seen { font-size: 11px; color: var(--muted); }

  .chat-box {
    flex: 1 1 0; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .message {
    display: flex; gap: 8px; max-width: 85%; position: relative;
    user-select: none;
  }
  .message.sent { align-self: flex-end; flex-direction: row-reverse; }
  .message .bubble {
    padding: 10px 14px; border-radius: 16px; background: var(--panel);
    font-size: 14px; line-height: 1.4; word-break: break-word;
    position: relative;
  }
  .message.sent .bubble { background: var(--accent); color: #062525; }
  .message .time {
    font-size: 10px; color: var(--muted); margin-top: 2px;
    align-self: flex-end; white-space: nowrap;
  }
  .message.sent .time { text-align: right; }
  .message .status-text {
    font-size: 10px; color: var(--muted); margin-top: 2px;
    display: flex; align-items: center; gap: 4px;
  }
  .message.sent .status-text { justify-content: flex-end; }

  /* Reply quote inside bubble */
  .reply-quote {
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
    border-left: 2px solid var(--accent); padding-left: 6px;
    cursor: pointer;
    transition: color 0.1s;
  }
  .reply-quote:hover { color: var(--text); }

  /* Deleted placeholder */
  .deleted-placeholder {
    padding: 10px 14px; border-radius: 16px; background: var(--panel);
    font-style: italic; color: var(--muted); font-size: 13px;
    pointer-events: none; user-select: none;
  }

  /* Reply bar */
  .reply-bar {
    background: var(--card); border-top: 1px solid var(--border);
    padding: 8px 16px; display: none; align-items: center; gap: 8px;
  }
  .reply-bar.show { display: flex; }
  .reply-bar .quote {
    flex: 1; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reply-bar button {
    background: none; border: none; color: var(--danger);
    font-size: 14px; cursor: pointer;
  }

  /* Context menu */
  .context-menu {
    position: fixed; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px 0; min-width: 140px; z-index: 200;
    display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .context-menu button {
    display: block; width: 100%; padding: 10px 16px; border: none;
    background: none; color: var(--text); font-size: 14px; text-align: left;
    cursor: pointer; transition: background 0.1s;
  }
  .context-menu button:hover { background: var(--panel); }
  .context-menu .danger { color: var(--danger); }

  .typing-indicator { padding: 4px 16px; color: var(--muted); font-size: 13px; flex-shrink: 0; min-height: 22px; }

  .input-area {
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--card); padding: 12px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px;
  }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; padding: 12px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .input-row button {
    padding: 12px 18px; border: none; border-radius: 8px;
    background: var(--accent); color: #062525; font-weight: 700;
    cursor: pointer; transition: filter 0.15s;
  }
  .input-row button:hover { filter: brightness(1.05); }
  .input-note { text-align: center; font-size: 11px; color: var(--muted); user-select: none; }

  .empty-chat {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
  }

  @media (max-width: 640px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .back-btn { display: block; }
    .chat-box { padding: 12px; }
    .input-area { padding: 10px 12px; }
  }
</style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="back-btn" id="sidebarBackBtn">←</button>
      <h2>Messages</h2>
    </div>
    <div class="new-chat">
      <input type="text" id="newChatUsername" placeholder="Start a chat by username..." />
    </div>
    <div class="room-list" id="roomList"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="chat-header" id="chatHeader" style="display: none;">
      <button class="header-back-arrow" onclick="history.back()">←</button>
      <a class="avatar-link" id="chatAvatarLink" href="#" target="_blank">
        <img class="avatar" id="chatPartnerAvatar" src="" alt="" />
      </a>
      <div>
        <div class="name" id="chatPartnerName"></div>
        <div class="status" id="chatPartnerStatus"></div>
        <div class="last-seen" id="chatPartnerLastSeen"></div>
      </div>
    </div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="chat-box" id="chatBox">
      <!-- The empty placeholder will be hidden by openRoom() -->
      <div class="empty-chat" id="emptyChatPlaceholder" style="display:none;">
        Select a conversation to start chatting
      </div>
    </div>
    <div class="reply-bar" id="replyBar">
      <span class="quote" id="replyQuote"></span>
      <button id="cancelReplyBtn">✕</button>
    </div>
    <div class="input-area" id="inputArea" style="display: none;">
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
      <div class="input-note">Text & emoji only · no files or images</div>
    </div>
  </div>

  <div class="context-menu" id="contextMenu">
    <button id="ctxEdit">Edit</button>
    <button id="ctxDeleteForMe" class="danger">Delete for me</button>
    <button id="ctxDeleteForEveryone" class="danger">Delete for everyone</button>
    <button id="ctxCancel">Cancel</button>
  </div>

<script>
/*
  ══════════════════════════════════════════════════════
  AniChan Realtime Chat — Final v2.1
  ══════════════════════════════════════════════════════
*/
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUser = null, activeRoom = null, partnerId = null;
  let rooms = [], messageSub = null, presenceSub = null;
  let replyToMessage = null;
  let longPressTimer = null;
  let contextMsgId = null;
  let isSending = false;
  const DELETED_KEY = 'anichan_deleted_msgs';

  function resolvePath(f) { return window.location.href.replace(/[^/]*$/, '') + f; }
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    if (now - d < 86400000 && d.getDate() === now.getDate())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(t) { return t.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[m]); }
  function scrollToBottom() { const b = $('chatBox'); b.scrollTop = b.scrollHeight; }

  async function updatePresence(status='online') {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, status, last_active: new Date().toISOString() });
  }
  async function setTyping(roomId, typing) {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, typing_in_room_id: typing ? roomId : null });
  }

  function getDeletedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); } catch { return new Set(); }
  }
  function addDeleted(msgId) {
    const s = getDeletedSet(); s.add(msgId);
    localStorage.setItem(DELETED_KEY, JSON.stringify([...s]));
  }

  // ── Sidebar rendering ──
  function renderRoomList(roomsData) {
    const list = $('roomList'); list.innerHTML = '';
    if (!roomsData.length) { list.innerHTML = '<div style="padding:16px;color:var(--muted);text-align:center">No conversations yet</div>'; return; }
    roomsData.forEach(room => {
      const o = room.other_user;
      const div = document.createElement('div'); div.className = 'room' + (activeRoom===room.id ? ' active' : '');
      const previewClass = room.unread_count ? 'preview unread' : 'preview';
      div.innerHTML = `
        <img class="avatar" src="${o.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        <div class="info">
          <div class="name">${escapeHtml(o.full_name || o.username)}<span class="online-badge ${o.is_online ? 'online' : ''}"></span></div>
          <div class="${previewClass}">${escapeHtml(room.last_message || '')}</div>
        </div>
        <div class="meta"><div class="time">${formatTime(room.last_message_time)}</div>${room.unread_count ? `<span class="unread">${room.unread_count}</span>` : ''}</div>`;
      div.addEventListener('click', () => openRoom(room.id, o.id));
      list.appendChild(div);
    });
  }

  async function loadRooms() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('chat_rooms')
      .select(`id, last_message, last_message_time, user_one_id, user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id, username, full_name, avatar_url, is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id, username, full_name, avatar_url, is_online)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time', { ascending: false });
    if (error) { console.error(error); return; }
    const enriched = [];
    for (const room of data) {
      const partner = room.user_one_id === currentUser.id ? room.user_two : room.user_one;
      const { count } = await supabase.from('messages').select('*', { count:'exact', head:true })
        .eq('room_id', room.id).eq('receiver_id', currentUser.id).eq('is_read', false);
      enriched.push({
        id: room.id,
        last_message: room.last_message,
        last_message_time: room.last_message_time,
        other_user: partner,
        unread_count: count || 0
      });
    }
    rooms = enriched;
    renderRoomList(enriched);
  }

  // ── Open room ──
  async function openRoom(roomId, otherUserId) {
    activeRoom = roomId; partnerId = otherUserId;
    // Immediately hide any placeholder
    $('emptyChatPlaceholder').style.display = 'none';
    $('chatHeader').style.display = 'flex';
    $('inputArea').style.display = 'flex';

    const { data: p } = await supabase.from('profiles').select('username, full_name, avatar_url, is_online, last_seen').eq('id', otherUserId).single();
    if (p) {
      $('chatPartnerAvatar').src = p.avatar_url || DEFAULT_AVATAR;
      $('chatPartnerName').textContent = p.full_name || p.username;
      $('chatPartnerStatus').textContent = p.is_online ? 'Online' : 'Offline';
      $('chatPartnerLastSeen').textContent = p.is_online ? '' : (p.last_seen ? `Last seen: ${new Date(p.last_seen).toLocaleString()}` : 'Last seen: —');
      $('chatAvatarLink').href = `profile.html?user=${otherUserId}`;
    }

    renderRoomList(rooms);
    await loadMessages(roomId);
    subscribeToMessages(roomId);
    $('typingIndicator').textContent = '';
    if (window.innerWidth <= 640) $('sidebar').classList.remove('open');
  }

  // ── Messages ──
  async function loadMessages(roomId) {
    const { data, error } = await supabase.from('messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    renderMessages(data, roomId);
    const unreadIds = data.filter(m => m.receiver_id === currentUser.id && !m.is_read).map(m => m.id);
    if (unreadIds.length) { await supabase.from('messages').update({ is_read: true }).in('id', unreadIds); loadRooms(); }
  }

  function renderMessages(msgs) {
    $('chatBox').innerHTML = '';
    const deleted = getDeletedSet();
    msgs.filter(m => !deleted.has(m.id)).forEach(addMessageElement);
    scrollToBottom();
  }

  function addMessageElement(msg) {
    const box = $('chatBox'), isSent = msg.sender_id === currentUser.id;
    const div = document.createElement('div'); div.className = `message ${isSent ? 'sent' : 'received'}`; div.dataset.msgId = msg.id;

    // Deleted for everyone
    if (msg.is_deleted) {
      div.innerHTML = `<div class="deleted-placeholder">This message was deleted</div><div class="time">${formatTime(msg.created_at)}</div>`;
      box.appendChild(div);
      scrollToBottom();
      return;
    }

    // Reply quote
    let replyHtml = '';
    if (msg.reply_to) {
      const originalEl = document.querySelector(`.message[data-msg-id="${msg.reply_to}"]`);
      const quotedText = originalEl ? originalEl.querySelector('.bubble')?.textContent?.trim() || 'Message' : 'Message';
      replyHtml = `<div class="reply-quote" data-reply-to="${msg.reply_to}">${escapeHtml(quotedText)}</div>`;
    }

    let content = escapeHtml(msg.message || msg.content || '');
    if (msg.edited_at) content += ' <small style="color:var(--muted)">(edited)</small>';

    div.innerHTML = `<div class="bubble">${replyHtml}${content}</div>
      <div class="time">${formatTime(msg.created_at)}</div>`;

    // Click on reply quote to jump to original message
    const replyDiv = div.querySelector('.reply-quote');
    if (replyDiv) {
      replyDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = replyDiv.dataset.replyTo;
        const target = document.querySelector(`.message[data-msg-id="${targetId}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.transition = 'background 0.5s';
          target.style.background = 'var(--panel)';
          setTimeout(() => target.style.background = '', 1500);
        }
      });
    }

    attachSwipe(div, msg);

    if (isSent) {
      div.addEventListener('touchstart', (e) => startLongPress(e, msg));
      div.addEventListener('touchend', cancelLongPress);
      div.addEventListener('touchmove', cancelLongPress);
    }

    box.appendChild(div);
    const atBottom = (box.scrollHeight - box.clientHeight) <= box.scrollTop + 30;
    if (atBottom) scrollToBottom();
  }

  // ── Swipe to reply ──
  function attachSwipe(el, msg) {
    let startX = 0;
    el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
    el.addEventListener('touchend', (e) => {
      const diff = (e.changedTouches[0]?.clientX || startX) - startX;
      if (diff > 80) setReply(msg);
    });
  }

  function setReply(msg) {
    if (msg.is_deleted) return;
    replyToMessage = { id: msg.id, sender: msg.sender_id, content: msg.message || msg.content };
    $('replyQuote').textContent = replyToMessage.content.substring(0, 60);
    $('replyBar').classList.add('show');
    $('messageInput').focus();
  }

  $('cancelReplyBtn').addEventListener('click', () => {
    replyToMessage = null;
    $('replyBar').classList.remove('show');
  });

  // ── Long press context menu ──
  function startLongPress(e, msg) {
    longPressTimer = setTimeout(() => showContextMenu(e, msg), 500);
  }
  function cancelLongPress() { clearTimeout(longPressTimer); }

  function showContextMenu(e, msg) {
    if (msg.is_deleted) return;
    contextMsgId = msg.id;
    const menu = $('contextMenu');
    const canEdit = (Date.now() - new Date(msg.created_at).getTime()) < 15 * 60 * 1000;
    $('ctxEdit').style.display = canEdit ? 'block' : 'none';
    menu.style.display = 'block';
    const x = Math.min(e.touches[0].clientX, window.innerWidth - 160);
    const y = Math.max(e.touches[0].clientY - 100, 10);
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
  }

  document.addEventListener('click', (e) => {
    if (!$('contextMenu').contains(e.target)) $('contextMenu').style.display = 'none';
  });

  $('ctxEdit').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    const newContent = prompt('Edit message:');
    if (!newContent) return;
    supabase.from('messages').update({ message: newContent, edited_at: new Date().toISOString() }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Edit failed');
      else loadMessages(activeRoom);
    });
  });

  $('ctxDeleteForMe').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    addDeleted(contextMsgId);
    loadMessages(activeRoom);
  });

  $('ctxDeleteForEveryone').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    if (!confirm('Delete this message for everyone?')) return;
    supabase.from('messages').update({ is_deleted: true }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Delete failed');
      else loadMessages(activeRoom);
    });
  });

  $('ctxCancel').addEventListener('click', () => $('contextMenu').style.display = 'none');

  // ── Send with status (no duplicates) ──
  async function sendMessage() {
    const input = $('messageInput'), text = input.value.trim();
    if (!text || !activeRoom || !partnerId || isSending) return;
    input.value = '';
    isSending = true;

    // Temporary optimistic message
    const tempId = 'temp-' + Date.now();
    const tempDiv = document.createElement('div');
    tempDiv.className = 'message sent';
    tempDiv.dataset.msgId = tempId;
    tempDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="status-text"><span>sending…</span></div>`;
    $('chatBox').appendChild(tempDiv);
    scrollToBottom();

    const payload = {
      room_id: activeRoom,
      sender_id: currentUser.id,
      receiver_id: partnerId,
      message: text,
      msg_type: 'text',
      reply_to: replyToMessage?.id || null
    };

    // Clear reply bar early
    if (replyToMessage) {
      replyToMessage = null;
      $('replyBar').classList.remove('show');
    }

    // Insert and get the real message
    const { data: inserted, error } = await supabase.from('messages').insert(payload).select().single();

    const statusEl = tempDiv.querySelector('.status-text');
    if (error) {
      statusEl.innerHTML = '<span style="color:var(--danger)">not sent, try again</span>';
    } else if (inserted) {
      // Replace tempId with real ID so realtime won't duplicate
      tempDiv.dataset.msgId = inserted.id;
      statusEl.innerHTML = `<span>sent</span> <span class="time">${formatTime(inserted.created_at)}</span>`;
      // Update sidebar
      await supabase.from('chat_rooms').update({ last_message: text, last_message_time: new Date().toISOString() }).eq('id', activeRoom);
      loadRooms();
    }

    isSending = false;
  }

  // ── Realtime ──
  function subscribeToMessages(roomId) {
    if (messageSub) supabase.removeChannel(messageSub);
    messageSub = supabase.channel(`room:${roomId}`)
      .on('postgres_changes', { event:'*', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` }, (payload) => {
        if (payload.eventType === 'INSERT') {
          const nm = payload.new;
          // Skip if already present (our own sent message)
          if (!document.querySelector(`.message[data-msg-id="${nm.id}"]`)) {
            addMessageElement(nm);
            if (nm.receiver_id === currentUser.id) supabase.from('messages').update({ is_read:true }).eq('id', nm.id).then();
          }
        } else if (payload.eventType === 'UPDATE') {
          loadMessages(roomId);
        }
      }).subscribe();
  }

  // ── Typing ──
  let typingTimeout;
  $('messageInput').addEventListener('input', () => {
    if (!activeRoom) return;
    setTyping(activeRoom, true); clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => setTyping(activeRoom, false), 3000);
  });
  if (presenceSub) supabase.removeChannel(presenceSub);
  presenceSub = supabase.channel('presence-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'user_presence' }, (payload) => {
      if (partnerId && payload.new && payload.new.user_id === partnerId) {
        $('typingIndicator').textContent = (payload.new.typing_in_room_id === activeRoom) ? 'Typing...' : '';
      }
    }).subscribe();

  // ── New chat by username ──
  $('newChatUsername').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { const u = e.target.value.trim(); e.target.value = ''; if (u) await createRoom(u); }
  });
  async function createRoom(username) {
    if (!currentUser) return;
    const { data: user } = await supabase.from('profiles').select('id, username').eq('username', username).maybeSingle();
    if (!user) { alert('User not found'); return; }
    if (user.id === currentUser.id) { alert('Cannot message yourself'); return; }
    const { data: exist } = await supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUser.id},user_two_id.eq.${user.id}),and(user_one_id.eq.${user.id},user_two_id.eq.${currentUser.id})`).maybeSingle();
    if (exist) { openRoom(exist.id, user.id); return; }
    const { data: nr, error } = await supabase.from('chat_rooms').insert({ user_one_id: currentUser.id, user_two_id: user.id }).select('id').single();
    if (error) { alert('Room creation failed'); return; }
    loadRooms(); openRoom(nr.id, user.id);
  }

  // ── Lifecycle ──
  window.addEventListener('beforeunload', () => updatePresence('offline'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) updatePresence('idle'); else { updatePresence('online'); loadRooms(); }
  });
  setInterval(loadRooms, 30000);

  $('sidebarBackBtn').addEventListener('click', () => $('sidebar').classList.remove('open'));
  async function logout() { await updatePresence('offline'); await supabase.auth.signOut(); window.location.href = resolvePath('index.html'); }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = resolvePath('user_login.html'); return; }
    currentUser = session.user;
    await updatePresence('online'); await loadRooms();

    const roomParam = new URLSearchParams(window.location.search).get('room');
    if (roomParam) {
      const { data: room } = await supabase.from('chat_rooms').select('user_one_id, user_two_id').eq('id', roomParam).single();
      if (room) openRoom(roomParam, room.user_one_id === currentUser.id ? room.user_two_id : room.user_one_id);
      else { alert('Chat room not found.'); window.history.replaceState({}, document.title, window.location.pathname); }
    }

    supabase.channel('public:chat_rooms').on('postgres_changes', { event:'*', schema:'public', table:'chat_rooms' }, () => loadRooms()).subscribe();
    $('sendBtn').addEventListener('click', sendMessage);
    $('messageInput').addEventListener('keydown', (e) => { if (e.key==='Enter') sendMessage(); });

    const lb = document.createElement('button'); lb.textContent='Logout';
    lb.style.cssText='background:transparent;border:1px solid var(--border);color:var(--danger);padding:6px 12px;border-radius:8px;cursor:pointer;margin-left:auto;';
    lb.addEventListener('click', logout); document.querySelector('.sidebar-header').appendChild(lb);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
