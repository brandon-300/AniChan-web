<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e12;
    --card: #1a1a1a;
    --panel: rgba(21, 28, 36, 0.75);
    --accent: #51dad3;
    --accent2: #ffb597;
    --text: #f1f1f1;
    --muted: #9aa0a6;
    --border: rgba(255, 255, 255, 0.04);
    --border-solid: #2a2a2a;
    --danger: #ff4757;
    --success: #2ed573;
    --offline: #555;
    --glow: 0 0 12px rgba(81, 218, 211, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app-root { width: 100%; height: 100dvh; overflow: hidden; position: relative; }

  /* ── SCREEN-A: Messages Directory ── */
  .screen-a {
    position: absolute; top: 0; left: 0; width: 100%; height: 100dvh;
    background: #080b0d;
    display: flex; flex-direction: column;
    transition: transform .3s cubic-bezier(.4,0,.2,1); z-index: 1;
  }

  /* Header */
  .screen-a-header {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 16px 12px 16px;
    background: rgba(8, 11, 13, 0.9);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .home-btn {
    background: none; border: none; color: var(--accent);
    font-size: 20px; cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* AniChan brand in header */
  .screen-brand {
    flex: 1;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .screen-brand .brand-ani { color: #fff; }
  .screen-brand .brand-chan { color: var(--accent); }

  /* Search box */
  .search-box { margin: 12px 16px 8px; position: relative; }
  .search-box .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 18px; pointer-events: none;
  }
  .search-box input {
    width: 100%;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid transparent;
    border-radius: 24px;
    padding: 11px 16px 11px 42px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box input::placeholder { color: #4a5d65; }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  /* Thread list */
  .thread-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: 8px 0 80px;
    position: relative;
  }
  .thread-list::-webkit-scrollbar { width: 4px; }
  .thread-list::-webkit-scrollbar-track { background: transparent; }
  .thread-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .thread-item {
    display: flex; align-items: center;
    padding: 12px 14px;
    border-radius: 12px;
    margin: 2px 8px;
    cursor: pointer;
    transition: background .2s;
    border-left: 3px solid transparent;
    position: relative;
  }
  .thread-item:hover {
    background: rgba(255,255,255,0.04);
  }
  .thread-item.active {
    background: rgba(81, 218, 211, 0.08);
    border-left-color: var(--accent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* Avatar */
  .avatar-ctn {
    position: relative; width: 50px; height: 50px;
    margin-right: 14px; flex-shrink: 0;
  }
  .avatar-ctn img {
    width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover; background: #333;
  }
  .online-marker {
    position: absolute; bottom: 1px; right: 0px; left: auto;
    width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid #080b0d;
    background: var(--offline);
    transition: background .3s;
  }
  .online-marker.live { background: var(--success); }

  /* Thread info */
  .thread-info {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 3px;
  }
  .thread-top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .thread-name {
    color: #fff; font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; margin-right: 8px;
  }
  .thread-time { color: #6c7c85; font-size: 12px; flex-shrink: 0; }
  .thread-bottom {
    display: flex; justify-content: space-between;
    align-items: center; gap: 8px;
  }
  .thread-preview {
    color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .thread-preview.typing-preview {
    color: var(--accent);
    font-style: italic;
  }
  .unread-pill {
    background: var(--accent); color: #0a0a0a;
    font-size: 11px; font-weight: 700;
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(81,218,211,.55);
    flex-shrink: 0;
  }

  /* FAB new chat button */
  .new-chat-fab {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a2a28;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(81,218,211,0.4), 0 2px 8px rgba(0,0,0,0.4);
    transition: transform .15s, box-shadow .15s;
    z-index: 10;
  }
  .new-chat-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(81,218,211,0.55), 0 4px 12px rgba(0,0,0,0.4);
  }
  .new-chat-fab:active { transform: scale(0.96); }
  .new-chat-fab .material-symbols-outlined { font-size: 22px; }

  /* Friends overlay */
  .friends-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
    z-index: 300; display: none; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  .friends-overlay.open { display: flex; }
  .friends-panel {
    width: 100%; max-width: 400px; max-height: 70vh;
    background: #1a1f26; border: 1px solid var(--border-solid);
    border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,.6);
  }
  .friends-panel h3 {
    margin-bottom: 16px; font-size: 18px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .friends-panel .close-friends {
    background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer;
  }
  .friends-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
  }
  .friend-item {
    display: flex; align-items: center; gap: 12px; padding: 10px;
    border-radius: 12px; cursor: pointer; transition: background .15s;
  }
  .friend-item:hover { background: rgba(255,255,255,0.05); }
  .friend-avatar {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
    background: var(--panel); border: 1px solid var(--border-solid);
  }
  .friend-name { font-weight: 600; font-size: 15px; }
  .friend-username { color: var(--muted); font-size: 13px; }
  .no-more { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .add-more-btn {
    background: var(--accent); color: #0a2a28; border: none;
    padding: 10px 16px; border-radius: 12px; font-weight: 600;
    font-size: 14px; cursor: pointer; transition: filter .15s; align-self: center;
  }
  .add-more-btn:hover { filter: brightness(1.1); }

  /* ── SCREEN-B: Conversation Room ── */
  .screen-b {
    position: absolute; top: 0; left: 0; width: 100%; height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column;
    transition: transform .3s cubic-bezier(.4,0,.2,1); z-index: 2;
  }

  /* Chat topbar */
  .chat-topbar {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: rgba(21, 28, 36, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    flex-shrink: 0; min-height: 64px;
  }
  .back-arrow {
    display: none; background: none; border: none; color: var(--accent);
    font-size: 24px; cursor: pointer; padding: 0 8px 0 0; flex-shrink: 0;
  }
  .partner-link { display: block; flex-shrink: 0; position: relative; }
  .partner-pic {
    width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--border-solid);
  }
  .partner-online {
    position: absolute; bottom: 1px; right: 0px; left: auto;
    width: 11px; height: 11px;
    border-radius: 50%; border: 2px solid #1a1f26;
    background: var(--offline); transition: background .3s;
  }
  .partner-online.live { background: var(--success); }
  .partner-text { margin-left: 6px; }
  .partner-name { font-weight: 600; font-size: 15px; }
  .partner-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .partner-sub.typing-status { color: var(--accent); font-style: italic; }

  /* Message feed */
  .msg-feed {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-feed::-webkit-scrollbar { width: 4px; }
  .msg-feed::-webkit-scrollbar-track { background: transparent; }
  .msg-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .msg-row { display: flex; flex-direction: column; margin-bottom: 4px; width: 100%; }
  .msg-row.out { align-items: flex-end; }
  .msg-row.in { align-items: flex-start; }

  /* Bubbles */
  .bubble {
    padding: 10px 14px; border-radius: 16px; max-width: 75%;
    font-size: 14px; line-height: 1.5; word-break: break-word;
  }
  .out .bubble {
    background: var(--accent); color: #0a2a28;
    border-bottom-right-radius: 4px;
    box-shadow: 0 0 10px rgba(81,218,211,.2);
  }
  .in .bubble {
    background: #1e262e; color: var(--text);
    border-bottom-left-radius: 4px;
  }

  /* Reply snippet inside bubble */
  .reply-snip {
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 6px;
    overflow: hidden;
    border-left: 3px solid;
  }
  .in .reply-snip {
    background: rgba(0, 0, 0, 0.25);
    border-left-color: var(--accent);
  }
  .out .reply-snip {
    background: rgba(0, 0, 0, 0.15);
    border-left-color: rgba(0,0,0,0.4);
  }
  .reply-snip .reply-user {
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .in .reply-snip .reply-user { color: var(--accent); }
  .out .reply-snip .reply-user { color: rgba(0,0,0,0.7); }
  .reply-snip .reply-body {
    font-size: 12px;
    opacity: 0.8;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .in .reply-snip .reply-body { color: var(--muted); }
  .out .reply-snip .reply-body { color: rgba(0,0,0,0.6); }

  /* Message footer */
  .msg-foot {
    display: flex; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 3px;
    align-items: center;
  }
  .out .msg-foot { justify-content: flex-end; }
  .tick-icon { font-size: 14px; }
  .out .tick-icon.read { color: var(--accent); }

  /* Deleted message */
  .deleted-note {
    padding: 6px 14px; border-radius: 20px;
    background: rgba(255,255,255,.05);
    color: var(--muted); font-size: 13px; font-style: italic;
    border: none; box-shadow: none; max-width: 60%; margin: 4px 0;
  }
  .msg-row.out .deleted-note { margin-left: auto; }
  .msg-row.in .deleted-note { margin-right: auto; }

  /* Unread separator */
  .unread-separator {
    align-self: center;
    background: rgba(81, 218, 211, 0.12);
    border: 1px solid rgba(81, 218, 211, 0.25);
    color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 5px 16px;
    border-radius: 12px;
    margin: 10px 0;
    pointer-events: none;
  }

  /* Date separator */
  .date-separator {
    align-self: center;
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 12px;
    margin: 8px 0;
    pointer-events: none;
  }

  /* Swipe reply icon */
  .swipe-reply-icon {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    color: var(--accent);
    font-size: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .1s;
  }
  .msg-row.in .swipe-reply-icon  { left: -28px; right: auto; }
  .msg-row.out .swipe-reply-icon { right: -28px; left: auto; }
  .msg-row { position: relative; overflow: visible; }

  /* Reply dock above input */
  .reply-strip {
    background: var(--panel);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 10px 8px 10px 14px;
    display: none; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .reply-strip.open { display: flex; }
  .reply-strip-content { flex: 1; min-width: 0; }
  .reply-strip-user {
    font-size: 12px; font-weight: 700; color: var(--accent);
    margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reply-strip-text {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reply-strip button {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 4px; transition: color .15s;
  }
  .reply-strip button:hover { color: var(--danger); }

  /* Reply jump highlight */
  @keyframes replyFlash {
    0%   { background: rgba(81,218,211,0.35); }
    100% { background: transparent; }
  }
  .msg-row.reply-highlight .bubble {
    animation: replyFlash 1.2s ease-out forwards;
    border-radius: 16px;
  }

  /* ── Typing Indicator Styling ── */
  .typing-indicator-container {
    padding: 6px 16px;
    font-size: 0.8rem;
    color: var(--accent);
    font-style: italic;
    min-height: 24px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    flex-shrink: 0;
  }
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .typing-dots span {
    width: 4px;
    height: 4px;
    background-color: var(--accent);
    border-radius: 50%;
    animation: typingBlink 1.4s infinite both;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes typingBlink {
    0%, 100% { opacity: .2; }
    20% { opacity: 1; }
  }

  /* Compose area */
  .compose-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: rgba(21, 28, 36, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 10px 8px 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .compose-area #msgInput {
    flex-grow: 1;
    min-width: 0;
    padding: 12px 16px; border-radius: 24px;
    background: rgba(0,0,0,0.25);
    border: 1px solid transparent;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .compose-area #msgInput::placeholder { color: #4a5d65; }
  .compose-area #msgInput:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .send-circle {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: #0a2a28;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
    transition: filter .15s, transform .1s;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(81,218,211,0.35);
  }
  .send-circle:hover { filter: brightness(1.1); }
  .send-circle:active { transform: scale(0.94); }
  .send-circle .material-symbols-outlined { font-size: 20px; }

  /* Edited label */
  .edited-label {
    font-size: 10px; opacity: 0.65; margin-top: 3px;
    display: block; font-style: italic; letter-spacing: 0.2px;
  }
  .out .edited-label { color: rgba(0,0,0,0.55); }
  .in  .edited-label { color: var(--muted); }

  /* Context menu */
  .ctx-menu {
    position: fixed; background: #1a1f26;
    border: 1px solid var(--border-solid);
    border-radius: 14px; padding: 4px 0; min-width: 180px; z-index: 200;
    display: none; box-shadow: 0 12px 32px rgba(0,0,0,.6);
  }
  .ctx-menu button {
    display: block; width: 100%; padding: 12px 18px; border: none;
    background: none; color: var(--text); font-size: 14px; text-align: left;
    cursor: pointer; transition: background .1s;
  }
  .ctx-menu button:hover { background: rgba(255,255,255,0.05); }
  .ctx-menu .danger { color: var(--danger); }
  .ctx-menu .split { height: 1px; background: var(--border-solid); margin: 2px 0; }

  /* ── Call Log Bubble ── */
  .call-log-bubble {
    min-width: 180px;
    cursor: default;
  }
  .call-log-bubble.tappable { cursor: pointer; }
  .call-log-inner {
    display: flex; align-items: center; gap: 10px;
  }
  .call-log-icon {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 17px;
  }
  .call-log-icon.outgoing { background: rgba(81,218,211,0.15); color: var(--accent); }
  .call-log-icon.missed   { background: rgba(255,71,87,0.15);  color: var(--danger); }
  .call-log-icon.incoming { background: rgba(46,213,115,0.15); color: var(--success); }
  .call-log-text { flex: 1; min-width: 0; }
  .call-log-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .call-log-sub {
    font-size: 12px; color: var(--muted); margin-top: 1px;
  }

  /* ── Call Buttons in Topbar ── */
  .call-btns {
    display: none; align-items: center; gap: 4px; margin-left: auto;
  }
  .call-btn {
    background: none; border: none; color: var(--muted);
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
    font-size: 20px;
  }
  .call-btn:hover { background: rgba(255,255,255,0.08); color: var(--accent); }
  .call-btn:active { background: rgba(81,218,211,.15); }

  /* ── Incoming call overlay ── */
  .incoming-call-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
  }
  .incoming-call-overlay.visible { display: flex; }
  .incoming-call-avatar {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--accent);
    box-shadow: 0 0 0 8px rgba(81,218,211,.12), 0 0 0 16px rgba(81,218,211,.06);
    animation: callPulse 1.8s ease-in-out infinite;
  }
  @keyframes callPulse {
    0%, 100% { box-shadow: 0 0 0 8px rgba(81,218,211,.12), 0 0 0 16px rgba(81,218,211,.06); }
    50%       { box-shadow: 0 0 0 12px rgba(81,218,211,.2), 0 0 0 24px rgba(81,218,211,.1); }
  }
  .incoming-call-name {
    font-size: 22px; font-weight: 700; color: #fff;
  }
  .incoming-call-type {
    font-size: 14px; color: var(--muted);
  }
  .incoming-call-actions {
    display: flex; gap: 32px; margin-top: 12px;
  }
  .call-action-btn {
    width: 62px; height: 62px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; transition: transform .1s, filter .15s;
  }
  .call-action-btn:active { transform: scale(0.92); }
  .call-action-btn.accept { background: var(--success); color: #fff; }
  .call-action-btn.decline { background: var(--danger); color: #fff; }
  .call-action-btn.accept:hover { filter: brightness(1.15); }
  .call-action-btn.decline:hover { filter: brightness(1.15); }

  /* ── Active call screen ── */
  .active-call-screen {
    position: fixed; inset: 0; z-index: 500;
    background: #090d10;
    display: none; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 48px 24px max(32px, env(safe-area-inset-bottom));
  }
  .active-call-screen.visible { display: flex; }

  /* Video containers */
  .video-remote-wrap {
    position: absolute; inset: 0; background: #050709; overflow: hidden;
  }
  .video-remote-wrap video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .video-local-wrap {
    position: absolute; bottom: 130px; right: 16px;
    width: 110px; height: 165px; border-radius: 14px;
    overflow: hidden; background: #1a1f26;
    border: 2px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .video-local-wrap video { width: 100%; height: 100%; object-fit: cover; }

  /* Top info bar over video */
  .call-info-bar {
    position: relative; z-index: 11;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .call-info-avatar {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .call-info-name { font-size: 20px; font-weight: 700; color: #fff; }
  .call-info-status { font-size: 13px; color: rgba(255,255,255,0.5); }
  .call-timer { font-size: 15px; font-weight: 500; color: var(--accent); margin-top: 2px; }

  /* Controls row */
  .call-controls {
    position: relative; z-index: 11;
    display: flex; gap: 20px; align-items: center;
  }
  .ctrl-btn {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transition: background .15s, transform .1s;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.18); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.toggled { background: rgba(81,218,211,0.2); color: var(--accent); }
  .ctrl-btn.end-call {
    width: 64px; height: 64px; font-size: 24px;
    background: var(--danger); color: #fff;
    box-shadow: 0 4px 20px rgba(255,71,87,0.4);
  }
  .ctrl-btn.end-call:hover { filter: brightness(1.1); }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
    flex-direction: column; gap: 12px;
  }
  .empty-state .material-symbols-outlined { font-size: 48px; color: rgba(81,218,211,0.2); }

  /* Responsive */
  @media (max-width: 768px) {
    .screen-a { transform: translateX(0); }
    .screen-b { transform: translateX(100%); }
    .app-root.chat-open .screen-a { transform: translateX(-100%); }
    .app-root.chat-open .screen-b { transform: translateX(0); }
    .back-arrow { display: block; }
  }
  @media (min-width: 769px) {
    .app-root { display: flex; }
    .screen-a { position: relative; width: 340px; flex-shrink: 0; transform: none !important; border-right: 1px solid var(--border); }
    .screen-b { position: relative; flex: 1; transform: none !important; }
    .back-arrow { display: none; }
  }
</style>
</head>
<body>

<script>
(() => {
  const SUPABASE_URL  = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  // ── State ──
  let currentUser = null, activeRoom = null, partnerId = null;
  let rooms = [], filteredRooms = [];
  let messageSub = null, presenceSub = null, profilesSub = null;
  let broadcastChannel = null;
  let replyTo = null, ctxMsgId = null, sending = false;
  const DELETED_KEY = 'anichan_deleted_msgs';
  const sentIds = new Set();

  // Tracks which users are currently typing (by user id)
  const typingUsers = new Map();

  // ── Helpers ──
  function esc(t) {
    return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
  }
  function fmtTimeOnly(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }
  function fmtChat(iso) {
    if (!iso) return '';
    const d = new Date(iso), n = new Date(), diff = n - d, mins = Math.floor(diff / 60000);
    if (mins < 1)  return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)  return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7)  return `${days}d ago`;
    return d.toLocaleDateString();
  }
  function getDel()    { try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); } catch { return new Set(); } }
  function addDel(id)  { const s = getDel(); s.add(id); localStorage.setItem(DELETED_KEY, JSON.stringify([...s])); }

  // ── Presence (DB) ──
  async function presence(status = 'online') {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, status, last_active: new Date().toISOString() });
    const isOnline = status === 'online';
    await supabase.from('profiles').update({ is_online: isOnline, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  }

  // ── Typing broadcast via Supabase Realtime Broadcast ──
  // Uses a per-room broadcast channel (not DB writes)
  let typingTimeout = null;

  function setupBroadcastChannel(roomId) {
    if (broadcastChannel) supabase.removeChannel(broadcastChannel);
    broadcastChannel = supabase.channel(`typing:${roomId}`, { config: { broadcast: { self: false } } })
      .on('broadcast', { event: 'typing' }, ({ payload }) => {
        if (!payload || payload.user_id === currentUser.id) return;
        handleTypingBroadcast(payload.user_id, payload.is_typing);
      })
      .subscribe();
  }

  function broadcastTyping(isTyping) {
    if (!broadcastChannel || !currentUser) return;
    broadcastChannel.send({
      type: 'broadcast',
      event: 'typing',
      payload: { user_id: currentUser.id, is_typing: isTyping }
    });
  }

  function handleTypingBroadcast(userId, isTyping) {
    // Update right panel header + typing indicator if this is the active partner
    if (userId === partnerId) {
      const sub = $('partnerSub');
      const indicator = $('typingIndicator');
      if (isTyping) {
        sub.textContent = 'typing...';
        sub.classList.add('typing-status');
        const partnerName = $('partnerName')?.textContent || 'Someone';
        indicator.innerHTML = `${partnerName} is typing <div class="typing-dots"><span></span><span></span><span></span></div>`;
      } else {
        sub.classList.remove('typing-status');
        indicator.innerHTML = '';
        // Restore status from cached room data
        const room = rooms.find(r => r.other_user.id === userId);
        if (room) setPartnerStatus(room.other_user.is_online, room.other_user.last_seen);
      }
    }
    // Update left panel thread preview
    if (isTyping) {
      typingUsers.set(userId, true);
    } else {
      typingUsers.delete(userId);
    }
    renderRooms(filteredRooms);
  }

  // ── Partner status helper ──
  function setPartnerStatus(isOnline, lastSeen) {
    const sub = $('partnerSub');
    if (sub.classList.contains('typing-status')) return; // Don't override while typing
    if (isOnline) {
      $('partnerDot').classList.add('live');
      sub.textContent = 'online';
    } else {
      $('partnerDot').classList.remove('live');
      sub.textContent = lastSeen ? `last seen ${fmtChat(lastSeen)}` : 'Offline';
    }
  }

  // ── Rooms ──
  function filterRooms(q) {
    const t = q.trim().toLowerCase();
    filteredRooms = t
      ? rooms.filter(r => (r.other_user.full_name || r.other_user.username).toLowerCase().includes(t))
      : [...rooms];
    renderRooms(filteredRooms);
  }

  function renderRooms(data) {
    const list = $('roomList');
    list.innerHTML = '';
    if (!data.length) {
      list.innerHTML = '<div style="padding:24px 16px;color:var(--muted);text-align:center;font-size:14px">No conversations yet</div>';
      return;
    }
    data.forEach(room => {
      const o = room.other_user;
      const isTyping = typingUsers.has(o.id);
      const d = document.createElement('div');
      d.className = 'thread-item' + (activeRoom === room.id ? ' active' : '');
      d.dataset.roomId  = room.id;
      d.dataset.otherId = o.id;

      const previewHtml = isTyping
        ? `<p class="thread-preview typing-preview">typing...</p>`
        : `<p class="thread-preview">${esc(room.last_message || '')}</p>`;

      const unreadHtml = room.unread_count
        ? `<span class="unread-pill">${room.unread_count}</span>`
        : '';

      d.innerHTML = `
        <div class="avatar-ctn">
          <img src="${o.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" alt="" />
          <div class="online-marker${o.is_online ? ' live' : ''}"></div>
        </div>
        <div class="thread-info">
          <div class="thread-top">
            <span class="thread-name">${esc(o.full_name || o.username)}</span>
            <span class="thread-time">${fmtChat(room.last_message_time)}</span>
          </div>
          <div class="thread-bottom">
            ${previewHtml}
            ${unreadHtml}
          </div>
        </div>`;
      list.appendChild(d);
    });
  }

  async function loadRooms() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('chat_rooms')
      .select(`id,last_message,last_message_time,user_one_id,user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id,username,full_name,avatar_url,is_online,last_seen),
        user_two:profiles!chat_rooms_user_two_id_fkey(id,username,full_name,avatar_url,is_online,last_seen)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time', { ascending: false });
    if (error) { console.error(error); return; }

    const enriched = [];
    for (const room of data) {
      const partner = room.user_one_id === currentUser.id ? room.user_two : room.user_one;
      const { count } = await supabase
        .from('messages').select('*', { count: 'exact', head: true })
        .eq('room_id', room.id)
        .eq('receiver_id', currentUser.id)
        .eq('is_read', false)
        .eq('is_deleted', false); // Filters out messages deleted for everyone
      enriched.push({
        id: room.id,
        last_message: room.last_message,
        last_message_time: room.last_message_time,
        other_user: partner,
        unread_count: count || 0
      });
    }
    rooms = enriched;
    filterRooms($('searchInput').value);
  }

  // ── Profile subscription for real-time online dots ──
  // ── Online status: dual-channel approach ──
  // Channel 1: postgres_changes on profiles — catches DB writes from ALL pages
  //            (login page, index, profile, chat). Works regardless of what
  //            page the other user has open.
  // Channel 2: Supabase Presence — instant peer-to-peer for users in chat.html
  let presenceChannel = null;
  let profilesChangeSub = null;

  function subscribeToProfiles() {
    // ── Channel 1: DB changes listener ──
    if (profilesChangeSub) supabase.removeChannel(profilesChangeSub);
    profilesChangeSub = supabase.channel('profile-is-online-changes')
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'profiles'
      }, payload => {
        const updated = payload.new;
        // Client-side filter — only care about our conversation partners
        const partnerIds = new Set(rooms.map(r => r.other_user.id));
        if (!partnerIds.has(updated.id)) return;
        // This fires for BOTH online=true (login) and online=false (logout)
        updateOnlineDot(updated.id, !!updated.is_online, updated.last_seen);
      })
      .subscribe();

    // ── Channel 2: Presence for instant peer detection inside chat.html ──
    if (presenceChannel) supabase.removeChannel(presenceChannel);
    presenceChannel = supabase.channel('online-users', {
      config: { presence: { key: currentUser.id } }
    });
    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        const state = presenceChannel.presenceState();
        rooms.forEach(room => {
          if (state[room.other_user.id]) {
            updateOnlineDot(room.other_user.id, true);
          }
        });
      })
      .on('presence', { event: 'join' }, ({ key }) => {
        // Only update UI dot — never write to DB for other users
        updateOnlineDot(key, true);
      })
      .on('presence', { event: 'leave' }, ({ key }) => {
        // Handled by postgres_changes Channel 1 — fires when is_online changes in DB
      })
      .subscribe(async status => {
        if (status === 'SUBSCRIBED') {
          await supabase.from('profiles')
            .update({ is_online: true, last_seen: new Date().toISOString() })
            .eq('id', currentUser.id);
          await presenceChannel.track({
            user_id: currentUser.id,
            online_at: new Date().toISOString()
          });
        }
      });
  }

  function updateOnlineDot(userId, isOnline, lastSeen = null) {
    // Update cached rooms array
    rooms.forEach(room => {
      if (room.other_user.id === userId) {
        room.other_user.is_online = isOnline;
        if (lastSeen) room.other_user.last_seen = lastSeen;
      }
    });
    renderRooms(filteredRooms);
    // Update active chat header
    if (userId === partnerId) {
      const room = rooms.find(r => r.other_user.id === userId);
      setPartnerStatus(isOnline, lastSeen || room?.other_user.last_seen);
    }
    // DB writes for offline state are handled by the user's own logout flow,
    // not by observers — avoids race conditions and permission issues
  }

  // ── Mark all messages in a room as read ──
  async function markAsRead(roomId) {
    // Call the security definer Postgres function
    await supabase.rpc('mark_messages_read', {
      room_id: roomId
    });
    // Zero the cached unread count and hide the pill immediately
    const room = rooms.find(r => r.id === roomId);
    if (room) room.unread_count = 0;
    // Hide the pill directly in the DOM without a full re-render
    const activeItem = document.querySelector(`.thread-item[data-room-id="${roomId}"]`);
    if (activeItem) {
      const pill = activeItem.querySelector('.unread-pill');
      if (pill) pill.remove();
    }
  }

  // ── Open room ──
  async function openRoom(roomId, otherId) {
    activeRoom = roomId;
    partnerId  = otherId;

    // Slide to chat screen immediately — before any async calls
    if (window.innerWidth <= 768) $('appRoot').classList.add('chat-open');

    // Instantly hide the unread pill from the UI for a snappy feel
    const activeItem = document.querySelector(`.thread-item[data-room-id="${roomId}"]`);
    if (activeItem) {
      const pill = activeItem.querySelector('.unread-pill');
      if (pill) pill.remove();
    }

    $('emptyState').style.display = 'none';
    $('chatTopbar').style.display = 'flex';
    $('composeArea').style.display = 'flex';

    // Reset partner dot while fetching
    $('partnerDot').classList.remove('live');
    $('partnerSub').textContent = '';
    $('partnerSub').classList.remove('typing-status');

    const { data: p } = await supabase
      .from('profiles').select('username,full_name,avatar_url,is_online,last_seen')
      .eq('id', otherId).single();
    if (p) {
      $('partnerPic').src = p.avatar_url || DEFAULT_AVATAR;
      $('partnerName').textContent = p.full_name || p.username;
      setPartnerStatus(p.is_online, p.last_seen);
      $('partnerLink').href = `profile.html?user=${otherId}`;
    }

    // Setup broadcast channel for this room
    setupBroadcastChannel(roomId);
    setupCallChannel(roomId);
    showCallButtons(true);

    renderRooms(filteredRooms);
    await loadMsgs(roomId);
    subMsgs(roomId);
    $('typingIndicator').innerHTML = '';
  }

  function closeRoom() {
    $('appRoot').classList.remove('chat-open');
  }
  $('backArrow').addEventListener('click', closeRoom);

  // Delegated click on room list
  $('roomList').addEventListener('click', e => {
    const item = e.target.closest('.thread-item');
    if (!item || !item.dataset.roomId) return;
    openRoom(item.dataset.roomId, item.dataset.otherId);
  });

  // ── Messages ──
  async function loadMsgs(roomId) {
    const { data, error } = await supabase
      .from('messages').select('*')
      .eq('room_id', roomId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }

    sentIds.clear();

    // Find unread messages to insert separator
    const del = getDel();
    const unreadIds = new Set(
      data.filter(m => 
        m.receiver_id === currentUser.id && 
        !m.is_read && 
        !m.is_deleted &&  // Ignores messages deleted for everyone
        !del.has(m.id)    // Ignores messages deleted locally just for you
      ).map(m => m.id)
    );

    renderMsgs(data, unreadIds);

    // Mark as read in the database AFTER we've rendered the unread separator
    if (unreadIds.size > 0) {
      markAsRead(roomId);
    }
  }

  function renderMsgs(msgs, unreadIds = new Set()) {
    $('msgFeed').innerHTML = '';
    const del = getDel();
    let lastDate = '';
    let separatorInserted = false;

    msgs.filter(m => !del.has(m.id)).forEach(msg => {
      // Date separator
      const msgDate = fmtDate(msg.created_at);
      if (msgDate && msgDate !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-separator';
        sep.textContent = msgDate;
        $('msgFeed').appendChild(sep);
        lastDate = msgDate;
      }

      // Unread separator — insert before the first unread message
      if (!separatorInserted && unreadIds.has(msg.id)) {
        const unreadCount = unreadIds.size;
        const uSep = document.createElement('div');
        uSep.className = 'unread-separator';
        uSep.textContent = `${unreadCount} unread message${unreadCount > 1 ? 's' : ''}`;
        $('msgFeed').appendChild(uSep);
        separatorInserted = true;
      }

      addMsg(msg);
    });

    // Use a slight timeout to ensure the DOM has painted before scrolling
    setTimeout(() => {
      const uSep = $('msgFeed').querySelector('.unread-separator');
      if (uSep) {
        uSep.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else {
        $('msgFeed').scrollTop = $('msgFeed').scrollHeight;
      }
    }, 600); // 600ms gives perfect visibility to the pill layout before dropping down
  }

  function renderCallLogBubble(msg) {
    const feed = $('msgFeed');
    const cl = msg.call_log;
    const out = msg.sender_id === currentUser.id; // caller = outgoing, receiver = incoming
    const isMissed   = cl.status === 'missed';
    const isNoAnswer = cl.status === 'no_answer';
    const isRinging  = cl.status === 'ringing';

    // Determine content
    let iconName, iconClass, title, sub, tappable = false;
    const callLabel = cl.type === 'video' ? 'Video' : 'Voice';
    const emoji     = cl.type === 'video' ? '📹' : '📞';

    if (out) {
      iconName  = cl.type === 'video' ? 'videocam' : 'call_made';
      iconClass = isNoAnswer ? 'missed' : 'outgoing';
      title     = `${callLabel} call`;
      sub       = isNoAnswer ? 'No answer' : 'Ringing';
    } else {
      iconName  = cl.type === 'video' ? 'videocam_off' : 'call_received';
      if (isMissed) {
        iconClass = 'missed'; title = `Missed ${callLabel.toLowerCase()} call`; sub = 'Tap to call back'; tappable = true;
      } else {
        iconClass = 'incoming'; title = `${callLabel} call`; sub = 'Ringing';
      }
    }

    // Remove existing row for this msg id if re-rendering (UPDATE event)
    const existing = feed.querySelector(`.msg-row[data-msg-id="${msg.id}"]`);
    if (existing) existing.remove();

    // Build as a standard msg-row so alignment, swipe-reply, long-press all work
    const row = document.createElement('div');
    row.className = `msg-row ${out ? 'out' : 'in'}`;
    row.dataset.msgId = msg.id;
    row.dataset.callId = cl.call_id;
    row.style.position = 'relative';

    const iconSide = out ? 'left' : 'right';
    const replyIconHtml = `<span class="material-symbols-outlined swipe-reply-icon" style="${iconSide}:-28px">reply</span>`;

    row.innerHTML = `
      ${replyIconHtml}
      <div class="bubble call-log-bubble${tappable ? ' tappable' : ''}">
        <div class="call-log-inner">
          <div class="call-log-icon ${iconClass}">
            <span class="material-symbols-outlined">${iconName}</span>
          </div>
          <div class="call-log-text">
            <div class="call-log-title">${title}</div>
            <div class="call-log-sub">${sub}</div>
          </div>
        </div>
      </div>
      <div class="msg-foot">
        <span>${fmtTimeOnly(msg.created_at)}</span>
        ${out ? '<span class="material-symbols-outlined tick-icon read" style="font-size:14px">done_all</span>' : ''}
      </div>`;

    if (tappable) {
      row.querySelector('.call-log-bubble').addEventListener('click', () => {
        startCall(cl.type || 'voice');
      });
    }

    // Swipe to reply — uses emoji + label as the reply preview text
    const replyMsg = {
      ...msg,
      message: `${emoji} ${title}`,
      content: `${emoji} ${title}`
    };
    attachSwipe(row, replyMsg);

    // Long press context menu (reply only — no edit/delete for call logs)
    let clLongTimer;
    row.addEventListener('touchstart', e => {
      clLongTimer = setTimeout(() => {
        // Only allow reply action for call log bubbles
        ctxMsgId = msg.id;
        const menu = $('ctxMenu');
        $('ctxEdit').style.display   = 'none';
        $('ctxDelAll').style.display = 'none';
        const delAllDivider = $('ctxDelAll').previousElementSibling;
        if (delAllDivider?.classList.contains('split')) delAllDivider.style.display = 'none';
        $('ctxDelMe').style.display  = 'none';
        menu.style.display = 'block';
        const tx = e.touches[0];
        menu.style.left = Math.min(tx.clientX, window.innerWidth - 200) + 'px';
        menu.style.top  = Math.max(tx.clientY - 120, 10) + 'px';
      }, 500);
    }, { passive: true });
    row.addEventListener('touchend',  () => clearTimeout(clLongTimer));
    row.addEventListener('touchmove', () => clearTimeout(clLongTimer));

    feed.appendChild(row);
  }

  function addMsg(msg) {
    const feed = $('msgFeed');
    const out  = msg.sender_id === currentUser.id;

    // ── Call log bubble ──
    if (msg.msg_type === 'call_log' && msg.call_log) {
      renderCallLogBubble(msg);
      return;
    }

    if (msg.is_deleted) {
      const row = document.createElement('div');
      row.className = `msg-row ${out ? 'out' : 'in'}`;
      const p = document.createElement('div');
      p.className = 'deleted-note';
      p.textContent = 'This message was deleted';
      row.appendChild(p);
      feed.appendChild(row);
      return;
    }

    const row = document.createElement('div');
    row.className = `msg-row ${out ? 'out' : 'in'}`;
    row.dataset.msgId = msg.id;
    row.style.position = 'relative';

    // Reply snippet — uses stored reply_text/reply_sender_id (for both users),
    // falls back to DOM scrape for old messages sent before those columns existed
    let replyHtml = '';
    if (msg.reply_to) {
      let quotedText = msg.reply_text || null;
      let quotedName = null;

      if (msg.reply_sender_id) {
        // New messages: resolve from stored fields — same result on both screens
        quotedName = msg.reply_sender_id === currentUser.id
          ? (currentUser?.user_metadata?.full_name || 'You')
          : ($('partnerName')?.textContent || 'Them');
      }

      if (!quotedText || !quotedName) {
        // Fallback for old messages: scrape the DOM
        const orig = $('msgFeed').querySelector(`.msg-row[data-msg-id="${msg.reply_to}"]`);
        if (orig) {
          if (!quotedText) {
            const bubble = orig.querySelector('.bubble');
            // Get last text node inside bubble, skipping reply-snip
            const nodes = [...bubble.childNodes].filter(n => !n.classList?.contains('reply-snip') && n.textContent.trim());
            quotedText = nodes[nodes.length - 1]?.textContent?.trim() || '';
          }
          if (!quotedName) {
            quotedName = orig.classList.contains('out')
              ? (currentUser?.user_metadata?.full_name || 'You')
              : ($('partnerName')?.textContent || 'Them');
          }
        }
      }

      quotedText = quotedText || '(message)';
      quotedName = quotedName || 'Unknown';

      replyHtml = `
        <div class="reply-snip" data-reply-target="${msg.reply_to}" style="cursor:pointer;">
          <div class="reply-user">${esc(quotedName)}</div>
          <div class="reply-body">${esc(quotedText)}</div>
        </div>`;
    }

    let content = esc(msg.message || '');
    const editedHtml = (msg.edited_at || msg.is_edited)
      ? '<span class="edited-label">(edited)</span>'
      : '';

    // Swipe reply icon
    const iconSide = out ? 'left' : 'right';
    const replyIconHtml = `<span class="material-symbols-outlined swipe-reply-icon" style="${iconSide}:-28px">reply</span>`;

    row.innerHTML = `
      ${replyIconHtml}
      <div class="bubble">
        ${replyHtml}
        ${content}
        ${editedHtml}
      </div>
      <div class="msg-foot">
        <span>${fmtTimeOnly(msg.created_at)}</span>
        ${out ? '<span class="material-symbols-outlined tick-icon read" style="font-size:14px">done_all</span>' : ''}
      </div>`;

    attachSwipe(row, msg);

    // Reply-snip click: scroll to original message and flash highlight
    const snip = row.querySelector('.reply-snip');
    if (snip) {
      snip.addEventListener('click', e => {
        e.stopPropagation();
        const targetId = snip.dataset.replyTarget;
        const targetRow = $('msgFeed').querySelector(`.msg-row[data-msg-id="${targetId}"]`);
        if (targetRow) {
          targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetRow.classList.remove('reply-highlight');
          void targetRow.offsetWidth; // force reflow to restart animation
          targetRow.classList.add('reply-highlight');
          setTimeout(() => targetRow.classList.remove('reply-highlight'), 1200);
        }
      });
    }

    // Long press on ALL messages — ownership enforced inside showCtx()
    let rowLongTimer;
    row.addEventListener('touchstart', e => { rowLongTimer = setTimeout(() => showCtx(e, msg), 500); }, { passive: true });
    row.addEventListener('touchend',   () => clearTimeout(rowLongTimer));
    row.addEventListener('touchmove',  () => clearTimeout(rowLongTimer));

    feed.appendChild(row);
  }

  // ── Swipe to reply ──
  function attachSwipe(el, msg) {
    let sx = 0, dragging = false;
    const icon = el.querySelector('.swipe-reply-icon');
    const THRESHOLD = 72;

    el.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX;
      dragging = true;
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - sx;
      // Only allow rightward swipe for received, leftward not needed — both dirs work
      const progress = Math.max(0, Math.min(dx, THRESHOLD)) / THRESHOLD;
      if (dx > 8) {
        el.style.transform = `translateX(${Math.min(dx, THRESHOLD)}px)`;
        if (icon) icon.style.opacity = String(progress);
      }
    }, { passive: true });

    el.addEventListener('touchend', e => {
      if (!dragging) return;
      dragging = false;
      const dx = (e.changedTouches[0]?.clientX || sx) - sx;
      el.style.transform = '';
      if (icon) icon.style.opacity = '0';
      if (dx >= THRESHOLD) setReply(msg);
    });
  }

  function setReply(msg) {
    if (msg.is_deleted) return;
    const out = msg.sender_id === currentUser.id;
    const senderName = out
      ? (currentUser?.user_metadata?.full_name || 'You')
      : ($('partnerName')?.textContent || 'Them');
    replyTo = { id: msg.id, sender: msg.sender_id, content: msg.message || '', senderName };
    $('replyStripUser').textContent = senderName;
    $('replyPreview').textContent   = replyTo.content.substring(0, 80);
    $('replyStrip').classList.add('open');
    $('msgInput').focus();
  }

  $('cancelReply').addEventListener('click', () => {
    replyTo = null;
    $('replyStrip').classList.remove('open');
  });

  // ── Context menu ──
  let longTimer;
  function showCtx(e, msg) {
    if (msg.is_deleted) return;
    // Always read the current ID from the DOM — avoids stale tmp- closure bug
    const domRow = e.target.closest('.msg-row');
    ctxMsgId = domRow ? domRow.dataset.msgId : msg.id;
    const menu = $('ctxMenu');
    const isMine = msg.sender_id === currentUser.id;
    const withinEditWindow = (Date.now() - new Date(msg.created_at).getTime()) < 5 * 60 * 1000;

    // Edit: only my messages, only within 5 minutes
    $('ctxEdit').style.display = (isMine && withinEditWindow) ? 'block' : 'none';

    // Delete for everyone + its divider: only my messages
    $('ctxDelAll').style.display = isMine ? 'block' : 'none';
    // Hide the divider above ctxDelAll when not mine
    const delAllDivider = $('ctxDelAll').previousElementSibling;
    if (delAllDivider && delAllDivider.classList.contains('split')) {
      delAllDivider.style.display = isMine ? 'block' : 'none';
    }

    // Delete for me: always visible
    $('ctxDelMe').style.display = 'block';

    menu.style.display = 'block';
    const tx = e.touches[0];
    menu.style.left = Math.min(tx.clientX, window.innerWidth - 200) + 'px';
    menu.style.top  = Math.max(tx.clientY - 120, 10) + 'px';
  }
  document.addEventListener('click', e => {
    if (!$('ctxMenu').contains(e.target)) $('ctxMenu').style.display = 'none';
  });
  $('ctxEdit').addEventListener('click', () => {
    $('ctxMenu').style.display = 'none';
    if (ctxMsgId && ctxMsgId.startsWith('tmp-')) {
      alert('Message is still sending — please wait a moment and try again.');
      return;
    }
    const c = prompt('Edit message:');
    if (!c || !c.trim()) return;
    supabase.from('messages')
      .update({ message: c.trim(), edited_at: new Date().toISOString(), is_edited: true })
      .eq('id', ctxMsgId)
      .then(({ error }) => { if (error) alert('Edit failed'); else loadMsgs(activeRoom); });
  });
  $('ctxDelMe').addEventListener('click', () => {
    $('ctxMenu').style.display = 'none';
    addDel(ctxMsgId);
    loadMsgs(activeRoom);
  });
  $('ctxDelAll').addEventListener('click', () => {
    $('ctxMenu').style.display = 'none';
    if (!confirm('Delete for everyone?')) return;
    supabase.from('messages').update({ is_deleted: true }).eq('id', ctxMsgId)
      .then(({ error }) => { if (error) alert('Delete failed'); else loadMsgs(activeRoom); });
  });
  $('ctxCancel').addEventListener('click', () => { $('ctxMenu').style.display = 'none'; });

  // ── Send ──
  async function sendMsg() {
    const inp = $('msgInput'), txt = inp.value.trim();
    if (!txt || !activeRoom || !partnerId || sending) return;
    inp.value = '';
    sending = true;

    // Stop typing broadcast
    clearTimeout(typingTimeout);
    broadcastTyping(false);

    const tmp = 'tmp-' + Date.now();
    const row = document.createElement('div');
    row.className = 'msg-row out';
    row.dataset.msgId = tmp;
    row.innerHTML = `<div class="bubble">${esc(txt)}</div><div class="msg-foot"><span style="color:var(--muted)">sending…</span></div>`;
    // Attach long-press immediately so the optimistic bubble is interactable
    const tmpMsg = { id: tmp, sender_id: currentUser.id, message: txt, created_at: new Date().toISOString(), is_deleted: false };
    let tmpLongTimer;
    row.addEventListener('touchstart', e => { tmpLongTimer = setTimeout(() => showCtx(e, tmpMsg), 500); }, { passive: true });
    row.addEventListener('touchend',   () => clearTimeout(tmpLongTimer));
    row.addEventListener('touchmove',  () => clearTimeout(tmpLongTimer));
    $('msgFeed').appendChild(row);
    $('msgFeed').scrollTop = $('msgFeed').scrollHeight;

    const payload = {
      room_id: activeRoom, sender_id: currentUser.id, receiver_id: partnerId,
      message: txt, msg_type: 'text',
      reply_to: replyTo?.id || null,
      reply_text: replyTo?.content || null,
      reply_sender_id: replyTo?.sender || null
    };
    if (replyTo) { replyTo = null; $('replyStrip').classList.remove('open'); }

    const { data: ins, error } = await supabase.from('messages').insert(payload).select().single();
    const foot = row.querySelector('.msg-foot');
    if (error) {
      foot.innerHTML = '<span style="color:var(--danger)">not sent</span>';
    } else if (ins) {
      sentIds.add(ins.id);
      row.dataset.msgId = ins.id;
      foot.innerHTML = `<span>${fmtTimeOnly(ins.created_at)}</span> <span class="material-symbols-outlined tick-icon read" style="font-size:14px">done_all</span>`;
      await supabase.from('chat_rooms').update({ last_message: txt, last_message_time: new Date().toISOString() }).eq('id', activeRoom);
      loadRooms();
      // Clear typing indicator and broadcast stop-typing on send
      clearTimeout(typingTimeout);
      broadcastTyping(false);
      $('typingIndicator').innerHTML = '';
      // Force scroll to bottom after message is confirmed sent
      setTimeout(() => {
        $('msgFeed').scrollTop = $('msgFeed').scrollHeight;
      }, 100);
    }
    sending = false;
  }

  // ── Realtime messages ──
  function subMsgs(roomId) {
    if (messageSub) supabase.removeChannel(messageSub);
    messageSub = supabase.channel(`room:${roomId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, payload => {
        if (payload.eventType === 'INSERT') {
          const nm = payload.new;
          if (!sentIds.has(nm.id) && !document.querySelector(`.msg-row[data-msg-id="${nm.id}"]`)) {
            addMsg(nm);
            $('msgFeed').scrollTop = $('msgFeed').scrollHeight;
            if (nm.receiver_id === currentUser.id) {
              supabase.from('messages').update({ is_read: true }).eq('id', nm.id).then();
            }
            loadRooms();
          }
        } else if (payload.eventType === 'UPDATE') {
          loadMsgs(roomId);
          loadRooms();
        }
      }).subscribe();
  }

  // ── Typing Detection Listener ──
  $('msgInput').addEventListener('input', () => {
    if (!broadcastChannel || !activeRoom) return;
    broadcastTyping(true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => broadcastTyping(false), 2000);
  });

  // Presence subscription removed — typing handled via Realtime Broadcast only

  // ── New chat (friends overlay) ──
  async function loadFriends() {
    const { data, error } = await supabase
      .from('profiles').select('id,username,full_name,avatar_url').neq('id', currentUser.id).order('username');
    if (error) { console.error(error); return []; }
    return data || [];
  }

  function showFriendsOverlay() {
    loadFriends().then(friends => {
      const list = $('friendsList');
      list.innerHTML = '';
      if (!friends.length) {
        list.innerHTML = '<div style="padding:16px;color:var(--muted);text-align:center">No other users found</div>';
      } else {
        friends.forEach(f => {
          const div = document.createElement('div');
          div.className = 'friend-item';
          div.innerHTML = `
            <img class="friend-avatar" src="${f.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" alt="" />
            <div>
              <div class="friend-name">${esc(f.full_name || f.username)}</div>
              <div class="friend-username">@${esc(f.username)}</div>
            </div>`;
          div.addEventListener('click', () => {
            $('friendsOverlay').classList.remove('open');
            startOrOpenChat(f);
          });
          list.appendChild(div);
        });
      }
      $('friendsOverlay').classList.add('open');
    });
  }

  function startOrOpenChat(friend) {
    supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUser.id},user_two_id.eq.${friend.id}),and(user_one_id.eq.${friend.id},user_two_id.eq.${currentUser.id})`)
      .maybeSingle()
      .then(({ data: exist }) => {
        if (exist) {
          openRoom(exist.id, friend.id);
        } else {
          supabase.from('chat_rooms').insert({ user_one_id: currentUser.id, user_two_id: friend.id }).select('id').single()
            .then(({ data: nr, error }) => {
              if (error) { alert('Could not start chat'); return; }
              loadRooms();
              openRoom(nr.id, friend.id);
            });
        }
      });
  }

  $('newChatBtn').addEventListener('click', showFriendsOverlay);
  $('closeFriends').addEventListener('click', () => $('friendsOverlay').classList.remove('open'));
  $('friendsOverlay').addEventListener('click', e => { if (e.target.id === 'friendsOverlay') $('friendsOverlay').classList.remove('open'); });
  $('addMoreBtn').addEventListener('click', () => window.location.href = 'find_friends.html');

  // ── Home button — navigate only, logout handled elsewhere ──
  $('homeBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  // ── Search ──
  $('searchInput').addEventListener('input', () => filterRooms($('searchInput').value));

  // ── Send button & Enter key ──
  $('sendBtn').addEventListener('click', sendMsg);
  $('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

  // ── Lifecycle ──
  // Presence is set online at init and offline only on explicit logout.
  // Heartbeat: refresh rooms every 30s — online status handled by presence channel
  setInterval(() => { loadRooms(); }, 30000);

  // ── Init ──
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'user_login.html'; return; }
    currentUser = session.user;
    await presence('online');
    await loadRooms();
    subscribeToProfiles();

    // Deep-link to a specific room via ?room=
    const rp = new URLSearchParams(window.location.search).get('room');
    if (rp) {
      const { data: room } = await supabase.from('chat_rooms').select('user_one_id,user_two_id').eq('id', rp).single();
      if (room) openRoom(rp, room.user_one_id === currentUser.id ? room.user_two_id : room.user_one_id);
      else { alert('Chat room not found.'); window.history.replaceState({}, document.title, window.location.pathname); }
    }

    supabase.channel('public:chat_rooms')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_rooms' }, () => loadRooms())
      .subscribe();
  }

  document.addEventListener('DOMContentLoaded', init);
  // ── Show/hide call buttons when room opens ──
  function showCallButtons(show) {
    $('callBtns').style.display = show ? 'flex' : 'none';
  }

  // ── Helper: is partner currently online? ──
  function isPartnerOnline() {
    const room = rooms.find(r => r.other_user.id === partnerId);
    return room ? !!room.other_user.is_online : false;
  }

  // ── WebRTC / Call Feature ──
  const ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

  let callChannel = null;
  let pc = null;
  let localStream = null;
  let callState = 'idle'; // idle | outgoing | incoming | active
  let callType = 'voice';
  let callTimerInterval = null;
  let callSeconds = 0;
  let isMuted = false;
  let isSpeaker = true;
  let callPartnerId = null;
  let noAnswerTimeout = null;
  let callerMsgId = null;
  let receiverMsgId = null;
  let currentCallId = null;
  let timerStarted = false; // prevents double-start on receiver side

  function getCallPartnerInfo() {
    const name = $('partnerName').textContent;
    const pic  = $('partnerPic').src;
    return { name, pic };
  }

  // ── Insert caller's own call log row ──
  async function insertCallerLog(status) {
    const { data: row, error } = await supabase.from('messages').insert({
      room_id: activeRoom,
      sender_id: currentUser.id,
      receiver_id: partnerId,
      msg_type: 'call_log',
      content: callType === 'video' ? 'Video call' : 'Voice call',
      call_log: { type: callType, status, call_id: currentCallId }
    }).select().single();
    if (error) console.error('insertCallerLog:', error);
    if (row) callerMsgId = row.id;
  }

  // ── Insert receiver's own call log row (called on receiver side) ──
  async function insertReceiverLog(status) {
    const { data: row, error } = await supabase.from('messages').insert({
      room_id: activeRoom,
      sender_id: currentUser.id,
      receiver_id: partnerId,
      msg_type: 'call_log',
      content: callType === 'video' ? 'Video call' : 'Voice call',
      call_log: { type: callType, status, call_id: currentCallId }
    }).select().single();
    if (error) console.error('insertReceiverLog:', error);
    if (row) receiverMsgId = row.id;
  }

  // Setup per-room call signaling channel
  function setupCallChannel(roomId) {
    if (callChannel) supabase.removeChannel(callChannel);
    callChannel = supabase.channel(`call:${roomId}`, { config: { broadcast: { self: false } } })
      .on('broadcast', { event: 'call-signal' }, ({ payload }) => {
        if (!payload || payload.to !== currentUser.id) return;
        handleSignal(payload);
      })
      .subscribe();
  }

  async function sendSignal(data) {
    if (!callChannel) return;
    await callChannel.send({
      type: 'broadcast', event: 'call-signal',
      payload: { ...data, from: currentUser.id, to: callPartnerId || partnerId }
    });
  }

  async function handleSignal(payload) {
    const { type, sdp, candidate, callType: ct, callId: cid } = payload;

    if (type === 'call-offer') {
      callPartnerId = payload.from;
      callType = ct || 'voice';
      currentCallId = cid || null;
      callerMsgId = null;
      receiverMsgId = null;
      showIncomingCall(callType);
      window._pendingOffer = payload;
      return;
    }

    if (type === 'call-accepted') {
      clearTimeout(noAnswerTimeout);
      $('callInfoStatus').textContent = 'Ringing...';
      noAnswerTimeout = setTimeout(() => {
        hangup(true, 'no_answer');
      }, 60000);
      return;
    }

    if (type === 'call-answer' && pc) {
      clearTimeout(noAnswerTimeout);
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp }));
      return;
    }

    if (type === 'ice-candidate' && pc) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {}
      return;
    }

    if (type === 'call-decline') {
      // Receiver declined — update caller's own row to no_answer
      if (callerMsgId) {
        await supabase.from('messages').update({
          call_log: { type: callType, status: 'no_answer', call_id: currentCallId }
        }).eq('id', callerMsgId);
      }
      hangup(false, null);
      return;
    }

    if (type === 'call-end') {
      // Caller ended — update receiver's own row to missed if still ringing
      if (receiverMsgId) {
        await supabase.from('messages').update({
          call_log: { type: callType, status: 'missed', call_id: currentCallId }
        }).eq('id', receiverMsgId);
      }
      hangup(false, null);
      return;
    }
  }

  function showIncomingCall(type) {
    callState = 'incoming';
    const { name, pic } = getCallPartnerInfo();
    $('incomingCallAvatar').src = pic;
    $('incomingCallName').textContent = name;
    $('incomingCallType').textContent = `Incoming ${type === 'video' ? 'video' : 'voice'} call...`;
    if (type === 'video') {
      $('acceptCallBtn').querySelector('.material-symbols-outlined').textContent = 'videocam';
    } else {
      $('acceptCallBtn').querySelector('.material-symbols-outlined').textContent = 'call';
    }
    $('incomingCallOverlay').classList.add('visible');
  }

  function showActiveCallScreen(statusText = 'Calling...') {
    const { name, pic } = getCallPartnerInfo();
    $('callInfoAvatar').src = pic;
    $('callInfoName').textContent = name;
    $('callInfoStatus').textContent = statusText;
    $('callTimer').style.display = 'none';
    if (callType === 'video') {
      $('videoRemoteWrap').style.display = 'block';
      $('videoLocalWrap').style.display = 'block';
    } else {
      $('videoRemoteWrap').style.display = 'none';
      $('videoLocalWrap').style.display = 'none';
    }
    $('incomingCallOverlay').classList.remove('visible');
    $('activeCallScreen').classList.add('visible');
  }

  function startCallTimer() {
    callSeconds = 0;
    $('callTimer').style.display = 'block';
    $('callInfoStatus').textContent = 'Connected';
    callTimerInterval = setInterval(() => {
      callSeconds++;
      const m = Math.floor(callSeconds / 60);
      const s = String(callSeconds % 60).padStart(2, '0');
      $('callTimer').textContent = `${m}:${s}`;
    }, 1000);
  }

  function stopCallTimer() {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
  }

  async function startCall(type) {
    if (callState !== 'idle') return;
    callType = type;
    callState = 'outgoing';
    callPartnerId = partnerId;
    currentCallId = crypto.randomUUID();
    callerMsgId = null;
    receiverMsgId = null;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: type === 'video' ? { facingMode: 'user' } : false
      });
    } catch (err) {
      alert('Could not access microphone' + (type === 'video' ? '/camera' : '') + '.\n' + err.message);
      callState = 'idle';
      return;
    }

    if (type === 'video') $('localVideo').srcObject = localStream;

    // Pre-unlock audio playback while still inside the user gesture
    let audio = document.getElementById('_callAudio');
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = '_callAudio';
      audio.autoplay = true;
      audio.setAttribute('playsinline', '');
      document.body.appendChild(audio);
    }
    audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAA=='; // silent stub
    audio.play().catch(() => {});

    const online = isPartnerOnline();
    showActiveCallScreen(online ? 'Ringing...' : 'Calling...');

    // Caller inserts only their own row
    await insertCallerLog('ringing');

    setupPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // Send callId so receiver knows which call this belongs to
    await sendSignal({ type: 'call-offer', sdp: offer.sdp, callType: type, callId: currentCallId });

    noAnswerTimeout = setTimeout(() => {
      hangup(true, 'no_answer');
    }, 60000);
  }

  function setupPeerConnection() {
    if (pc) { pc.close(); pc = null; }
    pc = new RTCPeerConnection(ICE_SERVERS);

    pc.onicecandidate = ({ candidate }) => {
      if (candidate) sendSignal({ type: 'ice-candidate', candidate });
    };

    // Use a single MediaStream, add tracks as they arrive
    const remoteStream = new MediaStream();

    pc.ontrack = (event) => {
      remoteStream.addTrack(event.track);

      if (callType === 'video') {
        $('remoteVideo').srcObject = remoteStream;
        if (localStream) $('localVideo').srcObject = localStream;
      } else {
        // Audio element already created and unlocked in startCall/acceptCall
        const audio = document.getElementById('_callAudio');
        if (audio) {
          audio.srcObject = remoteStream;
          audio.play().catch(() => {});
        }
      }

      // Start timer once on first audio track — use timerStarted flag not callState
      if (event.track.kind === 'audio' && !timerStarted) {
        timerStarted = true;
        callState = 'active';
        startCallTimer();
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
        hangup(false, null);
      }
    };
  }

  async function acceptCall() {
    const pending = window._pendingOffer;
    if (!pending) return;
    window._pendingOffer = null;

    // Pre-unlock audio inside the user gesture (accept button tap)
    let audio = document.getElementById('_callAudio');
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = '_callAudio';
      audio.autoplay = true;
      audio.setAttribute('playsinline', '');
      document.body.appendChild(audio);
    }
    audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAA==';
    audio.play().catch(() => {});

    // Receiver inserts their own row
    await insertReceiverLog('ringing');

    // Signal caller that we accepted
    await sendSignal({ type: 'call-accepted', receiverMsgId });

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: callType === 'video' ? { facingMode: 'user' } : false
      });
    } catch (err) {
      alert('Could not access microphone' + (callType === 'video' ? '/camera' : '') + '.\n' + err.message);
      await sendSignal({ type: 'call-decline' });
      if (receiverMsgId) {
        await supabase.from('messages').update({
          call_log: { type: callType, status: 'missed', call_id: currentCallId }
        }).eq('id', receiverMsgId);
      }
      resetCallUI();
      return;
    }

    if (callType === 'video') $('localVideo').srcObject = localStream;
    showActiveCallScreen('Connecting...');
    setupPeerConnection();
    // Set active AFTER setupPeerConnection so ontrack timer check works
    callState = 'active';
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: pending.sdp }));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendSignal({ type: 'call-answer', sdp: answer.sdp });
  }

  async function hangup(sendSignalToRemote = true, finalStatus = null) {
    clearTimeout(noAnswerTimeout);
    if (sendSignalToRemote) {
      if (callState === 'incoming') {
        await sendSignal({ type: 'call-decline' });
      } else {
        await sendSignal({ type: 'call-end' });
      }
    }
    // Each side only updates their own row
    if (finalStatus === 'no_answer' && callerMsgId) {
      await supabase.from('messages').update({
        call_log: { type: callType, status: 'no_answer', call_id: currentCallId }
      }).eq('id', callerMsgId);
    }
    if (finalStatus === 'missed' && receiverMsgId) {
      await supabase.from('messages').update({
        call_log: { type: callType, status: 'missed', call_id: currentCallId }
      }).eq('id', receiverMsgId);
    }
    resetCallUI();
  }

  function resetCallUI() {
    stopCallTimer();
    clearTimeout(noAnswerTimeout);
    if (pc) { pc.close(); pc = null; }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    const audio = document.getElementById('_callAudio');
    if (audio) { audio.srcObject = null; }
    $('localVideo').srcObject = null;
    $('remoteVideo').srcObject = null;
    $('incomingCallOverlay').classList.remove('visible');
    $('activeCallScreen').classList.remove('visible');
    window._pendingOffer = null;
    callState = 'idle';
    callPartnerId = null;
    isMuted = false;
    isSpeaker = true;
    timerStarted = false;
    callerMsgId = null;
    receiverMsgId = null;
    currentCallId = null;
    $('toggleMuteBtn').querySelector('.material-symbols-outlined').textContent = 'mic';
    $('toggleMuteBtn').classList.remove('toggled');
    // Restore call buttons if a room is still open
    if (activeRoom) showCallButtons(true);
  }

  // ── Call button event listeners ──
  $('voiceCallBtn').addEventListener('click', () => startCall('voice'));
  $('videoCallBtn').addEventListener('click', () => startCall('video'));
  $('acceptCallBtn').addEventListener('click', acceptCall);
  $('declineCallBtn').addEventListener('click', async () => {
    // Insert receiver row as missed before hanging up (they never accepted)
    if (!receiverMsgId && currentCallId) await insertReceiverLog('missed');
    else if (receiverMsgId) {
      await supabase.from('messages').update({
        call_log: { type: callType, status: 'missed', call_id: currentCallId }
      }).eq('id', receiverMsgId);
    }
    hangup(true, null);
  });
  $('endCallBtn').addEventListener('click', () => hangup(true, null));

  $('toggleMuteBtn').addEventListener('click', () => {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => { t.enabled = !isMuted; });
    const icon = $('toggleMuteBtn').querySelector('.material-symbols-outlined');
    icon.textContent = isMuted ? 'mic_off' : 'mic';
    $('toggleMuteBtn').classList.toggle('toggled', isMuted);
  });

  $('toggleSpeakerBtn').addEventListener('click', () => {
    isSpeaker = !isSpeaker;
    const audio = document.getElementById('_callAudio');
    if (audio) audio.muted = !isSpeaker;
    const icon = $('toggleSpeakerBtn').querySelector('.material-symbols-outlined');
    icon.textContent = isSpeaker ? 'volume_up' : 'volume_off';
    $('toggleSpeakerBtn').classList.toggle('toggled', !isSpeaker);
  });

})();
</script>
</body>
</html>
