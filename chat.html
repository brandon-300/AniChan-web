<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
    --glow:0 0 12px rgba(81,218,211,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .app-root{width:100%;height:100dvh;overflow:hidden;position:relative}

  /* ── SCREEN-A: Messages Directory ── */
  .screen-a{
    position:absolute;top:0;left:0;width:100%;height:100dvh;
    background:#080b0d;display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1;
  }
  .screen-a-inner{padding:20px 16px;display:flex;flex-direction:column;height:100%}
  .screen-title{color:#fff;font-size:28px;font-weight:700;margin-bottom:16px}
  .search-box{margin-bottom:24px}
  .search-box input{
    width:100%;background:#0c1214;border:2px solid var(--accent);border-radius:50px;
    padding:12px 20px;color:#fff;font-size:15px;outline:none;
    box-shadow:var(--glow);
  }
  .search-box input::placeholder{color:#4a5d65}
  .thread-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .thread-item{
    display:flex;align-items:center;padding:12px;border-radius:14px;
    cursor:pointer;transition:background .2s;
  }
  .thread-item.active{
    background:linear-gradient(135deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 100%);
    border:1px solid rgba(81,218,211,.25);
    box-shadow:0 0 18px rgba(81,218,211,.08);
  }
  .avatar-ctn{
    position:relative;width:50px;height:50px;margin-right:14px;flex-shrink:0;
  }
  .avatar-ctn img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;background:#333;
  }
  .online-marker{
    position:absolute;bottom:1px;right:1px;width:12px;height:12px;
    border-radius:50%;border:2px solid #080b0d;
    background:var(--offline);
  }
  .online-marker.live{background:var(--success)}
  .thread-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .thread-top{display:flex;justify-content:space-between;align-items:center}
  .thread-name{color:#fff;font-weight:600;font-size:16px}
  .thread-time{color:#6c7c85;font-size:12px}
  .thread-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .thread-preview{
    color:#8fa0a8;font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .unread-pill{
    background:var(--accent);color:#0a0a0a;font-size:11px;font-weight:700;
    min-width:20px;height:20px;padding:0 6px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px rgba(81,218,211,.55);flex-shrink:0;
  }

  /* ── SCREEN-B: Conversation Room ── */
  .screen-b{
    position:absolute;top:0;left:0;width:100%;height:100dvh;
    background:var(--bg);display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:2;
  }
  .chat-topbar{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;
    background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);flex-shrink:0;
  }
  .back-arrow{
    display:none;background:none;border:none;color:var(--accent);
    font-size:24px;cursor:pointer;padding:0 8px 0 0;
  }
  .partner-link{display:block;flex-shrink:0;position:relative}
  .partner-pic{
    width:40px;height:40px;border-radius:50%;object-fit:cover;
    border:2px solid var(--border);
  }
  .partner-online{
    position:absolute;bottom:1px;right:1px;width:10px;height:10px;
    border-radius:50%;border:2px solid var(--card);
    background:var(--offline);
  }
  .partner-online.live{background:var(--success)}
  .partner-text{margin-left:8px}
  .partner-name{font-weight:600;font-size:15px}
  .partner-sub{font-size:12px;color:var(--muted)}

  .msg-feed{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:8px;
    -webkit-overflow-scrolling:touch;
  }
  .msg-row{display:flex;flex-direction:column;margin-bottom:6px;width:100%}
  .msg-row.out{align-items:flex-end}
  .msg-row.in{align-items:flex-start}

  .bubble{
    padding:10px 14px;border-radius:16px;max-width:75%;
    font-size:14px;line-height:1.45;word-break:break-word;
  }
  .out .bubble{
    background:var(--accent);color:#0a2a28;
    border-bottom-right-radius:4px;
    box-shadow:0 0 10px rgba(81,218,211,.25);
  }
  .in .bubble{
    background:var(--panel);color:var(--text);
    border-bottom-left-radius:4px;
  }
  .reply-snip{
    font-size:11px;margin-bottom:4px;padding-left:6px;
    border-left:2px solid rgba(0,0,0,.4);
    cursor:pointer;
  }
  .out .reply-snip{color:rgba(0,0,0,.6);border-left-color:rgba(0,0,0,.4)}
  .in .reply-snip{color:var(--muted);border-left-color:var(--accent)}

  .msg-foot{
    display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:3px;
  }
  .out .msg-foot{justify-content:flex-end}
  .tick-icon{font-size:14px}
  .out .tick-icon.read{color:var(--accent)}

  .deleted-note{
    padding:8px 14px;border-radius:12px;background:var(--panel);
    font-style:italic;color:var(--muted);font-size:13px;
    text-align:center;margin:8px auto;border:1px dashed var(--border);
    max-width:60%;
  }

  .reply-strip{
    background:var(--card);border-top:1px solid var(--border);
    padding:8px 16px;display:none;align-items:center;gap:8px;flex-shrink:0;
  }
  .reply-strip.open{display:flex}
  .reply-strip .preview{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reply-strip button{background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer}

  .typing-bar{padding:4px 16px;flex-shrink:0;display:flex;align-items:center;gap:8px}
  .typing-anim{
    display:none;align-items:center;gap:4px;
    background:var(--panel);padding:6px 14px;border-radius:14px;
  }
  .typing-anim.on{display:flex}
  .typing-anim span{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-anim span:nth-child(2){animation-delay:.15s}
  .typing-anim span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0)}
    30%{transform:translateY(-6px)}
  }

  .compose-area{
    flex-shrink:0;border-top:1px solid var(--border);
    background:var(--card);padding:12px 16px;
    padding-bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:6px;
  }
  .compose-row{display:flex;gap:8px}
  .compose-row input{
    flex:1;padding:12px;border-radius:20px;
    background:var(--panel);border:2px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .compose-row input:focus{
    border-color:var(--accent);
    box-shadow:var(--glow);
  }
  .send-circle{
    width:44px;height:44px;border-radius:50%;
    background:var(--accent);color:#0a2a28;
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;transition:filter .15s;flex-shrink:0;
  }
  .send-circle:hover{filter:brightness(1.1)}
  .send-circle .material-symbols-outlined{font-size:20px}

  .ctx-menu{
    position:fixed;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:4px 0;min-width:160px;z-index:200;
    display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .ctx-menu button{
    display:block;width:100%;padding:10px 16px;border:none;
    background:none;color:var(--text);font-size:14px;text-align:left;
    cursor:pointer;transition:background .1s;
  }
  .ctx-menu button:hover{background:var(--panel)}
  .ctx-menu .danger{color:var(--danger)}
  .ctx-menu .split{height:1px;background:var(--border);margin:2px 0}

  .empty-state{
    flex:1;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:20px;
  }

  /* ── Mobile screen swap ── */
  @media (max-width:768px){
    .screen-a{transform:translateX(0)}
    .screen-b{transform:translateX(100%)}
    .app-root.chat-open .screen-a{transform:translateX(-100%)}
    .app-root.chat-open .screen-b{transform:translateX(0)}
    .back-arrow{display:block}
  }
  @media (min-width:769px){
    .app-root{display:flex}
    .screen-a{position:relative;width:350px;flex-shrink:0;transform:none!important}
    .screen-b{position:relative;flex:1;transform:none!important}
    .back-arrow{display:none}
  }
</style>
</head>
<body>
<div class="app-root" id="appRoot">
  <!-- SCREEN-A: Messages Directory -->
  <div class="screen-a" id="screenA">
    <div class="screen-a-inner">
      <h1 class="screen-title">Messages</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search/new-chat" />
      </div>
      <div class="thread-list" id="roomList"></div>
    </div>
  </div>

  <!-- SCREEN-B: Conversation Room -->
  <div class="screen-b" id="screenB">
    <div class="chat-topbar" id="chatTopbar" style="display:none;">
      <button class="back-arrow" id="backArrow">←</button>
      <a class="partner-link" id="partnerLink" href="#" target="_blank">
        <img class="partner-pic" id="partnerPic" src="" alt="" />
        <div class="partner-online" id="partnerDot"></div>
      </a>
      <div class="partner-text">
        <div class="partner-name" id="partnerName"></div>
        <div class="partner-sub" id="partnerSub"></div>
      </div>
    </div>
    <div class="typing-bar">
      <div class="typing-anim" id="typingAnim">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="msg-feed" id="msgFeed">
      <div class="empty-state" id="emptyState">
        Select a conversation to start chatting
      </div>
    </div>
    <div class="reply-strip" id="replyStrip">
      <span class="preview" id="replyPreview"></span>
      <button id="cancelReply">✕</button>
    </div>
    <div class="compose-area" id="composeArea" style="display:none;">
      <div class="compose-row">
        <input type="text" id="msgInput" placeholder="Type a message..." />
        <button class="send-circle" id="sendBtn">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu">
  <button id="ctxEdit">Edit</button>
  <div class="split"></div>
  <button id="ctxDelMe" class="danger">Delete for me</button>
  <div class="split"></div>
  <button id="ctxDelAll" class="danger">Delete for everyone</button>
  <button id="ctxCancel" style="color:var(--muted)">Cancel</button>
</div>

<script>
/*
  AniChan Chat – Telegram‑style dual screen
  Swipe hint and jump button removed, logout replaced with back‑to‑home.
*/
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUser = null, activeRoom = null, partnerId = null;
  let rooms = [], filteredRooms = [];
  let messageSub = null, presenceSub = null;
  let replyTo = null, ctxMsgId = null, sending = false;
  const DELETED_KEY = 'anichan_deleted_msgs';
  const sentIds = new Set();

  function esc(t){ return t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }
  function fmtTime(iso){
    if(!iso) return '';
    const d=new Date(iso), n=new Date();
    if(n-d<86400000 && d.getDate()===n.getDate()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  function fmtChat(iso){
    if(!iso) return '';
    const d=new Date(iso), n=new Date(), diff=n-d, mins=Math.floor(diff/60000);
    if(mins<1) return 'Just now';
    if(mins<60) return `${mins}m ago`;
    const hrs=Math.floor(mins/60);
    if(hrs<24) return `${hrs}h ago`;
    const days=Math.floor(hrs/24);
    if(days<7) return `${days}d ago`;
    return d.toLocaleDateString();
  }

  async function presence(s='online'){
    if(!currentUser) return;
    await supabase.from('user_presence').upsert({user_id:currentUser.id,status:s,last_active:new Date().toISOString()});
  }
  async function typing(room, on){
    if(!currentUser) return;
    await supabase.from('user_presence').upsert({user_id:currentUser.id,typing_in_room_id:on?room:null});
  }

  // ── Sidebar ──
  function filterRooms(q){
    const t=q.trim().toLowerCase();
    filteredRooms=t?rooms.filter(r=>(r.other_user.full_name||r.other_user.username).toLowerCase().includes(t)):[...rooms];
    renderRooms(filteredRooms);
  }
  function renderRooms(data){
    const list=$('roomList'); list.innerHTML='';
    if(!data.length){list.innerHTML='<div style="padding:16px;color:var(--muted);text-align:center">No conversations</div>';return;}
    data.forEach(room=>{
      const o=room.other_user;
      const d=document.createElement('div');
      d.className='thread-item'+(activeRoom===room.id?' active':'');
      d.innerHTML=`
        <div class="avatar-ctn">
          <img src="${o.avatar_url||DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
          <div class="online-marker${o.is_online?' live':''}"></div>
        </div>
        <div class="thread-info">
          <div class="thread-top"><span class="thread-name">${esc(o.full_name||o.username)}</span><span class="thread-time">${fmtChat(room.last_message_time)}</span></div>
          <div class="thread-bottom"><p class="thread-preview">${esc(room.last_message||'')}</p>${room.unread_count?`<span class="unread-pill">${room.unread_count}</span>`:''}</div>
        </div>`;
      d.addEventListener('click',()=>openRoom(room.id,o.id));
      list.appendChild(d);
    });
  }

  async function loadRooms(){
    if(!currentUser) return;
    const {data,error}=await supabase.from('chat_rooms')
      .select(`id,last_message,last_message_time,user_one_id,user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id,username,full_name,avatar_url,is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id,username,full_name,avatar_url,is_online)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time',{ascending:false});
    if(error){console.error(error);return;}
    const enriched=[];
    for(const room of data){
      const partner=room.user_one_id===currentUser.id?room.user_two:room.user_one;
      const {count}=await supabase.from('messages').select('*',{count:'exact',head:true})
        .eq('room_id',room.id).eq('receiver_id',currentUser.id).eq('is_read',false);
      enriched.push({id:room.id,last_message:room.last_message,last_message_time:room.last_message_time,other_user:partner,unread_count:count||0});
    }
    rooms=enriched;
    filterRooms($('searchInput').value);
  }

  // ── Open room ──
  async function openRoom(roomId,otherId){
    activeRoom=roomId; partnerId=otherId;
    $('emptyState').style.display='none';
    $('chatTopbar').style.display='flex';
    $('composeArea').style.display='flex';
    const {data:p}=await supabase.from('profiles').select('username,full_name,avatar_url,is_online,last_seen').eq('id',otherId).single();
    if(p){
      $('partnerPic').src=p.avatar_url||DEFAULT_AVATAR;
      $('partnerName').textContent=p.full_name||p.username;
      $('partnerSub').textContent=p.is_online?'Online':(p.last_seen?`last-seen ${fmtChat(p.last_seen)}`:'Offline');
      $('partnerLink').href=`profile.html?user=${otherId}`;
      $('partnerDot').classList.toggle('live',p.is_online);
    }
    renderRooms(filteredRooms);
    await loadMsgs(roomId);
    subMsgs(roomId);
    $('typingAnim').classList.remove('on');
    if(window.innerWidth<=768) $('appRoot').classList.add('chat-open');
  }

  function closeRoom(){
    $('appRoot').classList.remove('chat-open');
  }
  $('backArrow').addEventListener('click',closeRoom);

  // ── Messages ──
  async function loadMsgs(roomId){
    const {data,error}=await supabase.from('messages').select('*').eq('room_id',roomId).order('created_at',{ascending:true});
    if(error){console.error(error);return;}
    sentIds.clear();
    renderMsgs(data);
    const unread=data.filter(m=>m.receiver_id===currentUser.id&&!m.is_read).map(m=>m.id);
    if(unread.length){await supabase.from('messages').update({is_read:true}).in('id',unread);loadRooms();}
  }

  function renderMsgs(msgs){
    $('msgFeed').innerHTML='';
    const del=getDel();
    msgs.filter(m=>!del.has(m.id)).forEach(addMsg);
  }

  function addMsg(msg){
    const feed=$('msgFeed'), out=msg.sender_id===currentUser.id;
    if(msg.is_deleted){
      const p=document.createElement('div');
      p.className='deleted-note';p.textContent='This message was deleted';
      feed.appendChild(p);return;
    }
    const row=document.createElement('div');
    row.className=`msg-row ${out?'out':'in'}`;
    row.dataset.msgId=msg.id;

    let replyHtml='';
    if(msg.reply_to){
      const orig=document.querySelector(`.msg-row[data-msg-id="${msg.reply_to}"]`);
      const txt=orig?orig.querySelector('.bubble')?.textContent?.trim()||'Message':'Message';
      replyHtml=`<div class="reply-snip" data-reply-to="${msg.reply_to}">${esc(txt)}</div>`;
    }

    let content=esc(msg.message||'');
    if(msg.edited_at) content+=' <small style="opacity:0.7">(edited)</small>';

    row.innerHTML=`<div class="bubble">${replyHtml}${content}</div>
      <div class="msg-foot"><span>${fmtTime(msg.created_at)}</span>${out?' <span class="material-symbols-outlined tick-icon read" style="font-size:14px">done_all</span>':''}</div>`;

    const rDiv=row.querySelector('.reply-snip');
    if(rDiv){
      rDiv.addEventListener('click',e=>{
        e.stopPropagation();
        const tid=rDiv.dataset.replyTo;
        const t=document.querySelector(`.msg-row[data-msg-id="${tid}"]`);
        if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.background='var(--panel)';setTimeout(()=>t.style.background='',1500);}
      });
    }

    attachSwipe(row,msg);
    if(out){
      row.addEventListener('touchstart',e=>startLong(e,msg));
      row.addEventListener('touchend',cancelLong);
      row.addEventListener('touchmove',cancelLong);
    }
    feed.appendChild(row);
  }

  // ── Swipe reply (functionality kept, label removed) ──
  function attachSwipe(el,msg){
    let sx=0;
    el.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
    el.addEventListener('touchend',e=>{if((e.changedTouches[0]?.clientX||sx)-sx>80) setReply(msg);});
  }
  function setReply(msg){
    if(msg.is_deleted) return;
    replyTo={id:msg.id,sender:msg.sender_id,content:msg.message||''};
    $('replyPreview').textContent=replyTo.content.substring(0,60);
    $('replyStrip').classList.add('open');
    $('msgInput').focus();
  }
  $('cancelReply').addEventListener('click',()=>{replyTo=null;$('replyStrip').classList.remove('open');});

  // ── Long press ──
  let longT;
  function startLong(e,msg){longT=setTimeout(()=>showCtx(e,msg),500);}
  function cancelLong(){clearTimeout(longT);}
  function showCtx(e,msg){
    if(msg.is_deleted) return;
    ctxMsgId=msg.id;
    const m=$('ctxMenu'), can=(Date.now()-new Date(msg.created_at).getTime())<15*60*1000;
    $('ctxEdit').style.display=can?'block':'none';
    m.style.display='block';
    m.style.left=Math.min(e.touches[0].clientX,window.innerWidth-180)+'px';
    m.style.top=(e.touches[0].clientY-100)+'px';
  }
  document.addEventListener('click',e=>{if(!$('ctxMenu').contains(e.target)) $('ctxMenu').style.display='none';});
  $('ctxEdit').addEventListener('click',()=>{
    $('ctxMenu').style.display='none';
    const c=prompt('Edit message:'); if(!c) return;
    supabase.from('messages').update({message:c,edited_at:new Date().toISOString()}).eq('id',ctxMsgId).then(({error})=>{if(error)alert('Edit failed');else loadMsgs(activeRoom);});
  });
  $('ctxDelMe').addEventListener('click',()=>{$('ctxMenu').style.display='none';addDel(ctxMsgId);loadMsgs(activeRoom);});
  $('ctxDelAll').addEventListener('click',()=>{
    $('ctxMenu').style.display='none';
    if(!confirm('Delete for everyone?')) return;
    supabase.from('messages').update({is_deleted:true}).eq('id',ctxMsgId).then(({error})=>{if(error)alert('Delete failed');else loadMsgs(activeRoom);});
  });
  $('ctxCancel').addEventListener('click',()=>$('ctxMenu').style.display='none');

  // ── Send ──
  async function sendMsg(){
    const inp=$('msgInput'), txt=inp.value.trim();
    if(!txt||!activeRoom||!partnerId||sending) return;
    inp.value=''; sending=true;
    const tmp='tmp-'+Date.now();
    const row=document.createElement('div');
    row.className='msg-row out';row.dataset.msgId=tmp;
    row.innerHTML=`<div class="bubble">${esc(txt)}</div><div class="msg-foot"><span style="color:var(--muted)">sending…</span></div>`;
    $('msgFeed').appendChild(row);

    const payload={room_id:activeRoom,sender_id:currentUser.id,receiver_id:partnerId,message:txt,msg_type:'text',reply_to:replyTo?.id||null};
    if(replyTo){replyTo=null;$('replyStrip').classList.remove('open');}

    const {data:ins,error}=await supabase.from('messages').insert(payload).select().single();
    const foot=row.querySelector('.msg-foot');
    if(error){foot.innerHTML='<span style="color:var(--danger)">not sent</span>';}
    else if(ins){
      sentIds.add(ins.id);row.dataset.msgId=ins.id;
      foot.innerHTML=`<span>${fmtTime(ins.created_at)}</span> <span class="material-symbols-outlined tick-icon read" style="font-size:14px">done_all</span>`;
      await supabase.from('chat_rooms').update({last_message:txt,last_message_time:new Date().toISOString()}).eq('id',activeRoom);
      loadRooms();
    }
    sending=false;
  }

  // ── Realtime ──
  function subMsgs(roomId){
    if(messageSub) supabase.removeChannel(messageSub);
    messageSub=supabase.channel(`room:${roomId}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:`room_id=eq.${roomId}`},payload=>{
        if(payload.eventType==='INSERT'){
          const nm=payload.new;
          if(!sentIds.has(nm.id)&&!document.querySelector(`.msg-row[data-msg-id="${nm.id}"]`)){
            addMsg(nm);
            if(nm.receiver_id===currentUser.id) supabase.from('messages').update({is_read:true}).eq('id',nm.id).then();
          }
        }else if(payload.eventType==='UPDATE'){loadMsgs(roomId);}
      }).subscribe();
  }

  // ── Typing ──
  let typingTO;
  $('msgInput').addEventListener('input',()=>{
    if(!activeRoom) return;
    typing(activeRoom,true);clearTimeout(typingTO);
    typingTO=setTimeout(()=>typing(activeRoom,false),3000);
  });
  if(presenceSub) supabase.removeChannel(presenceSub);
  presenceSub=supabase.channel('presence-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'user_presence'},payload=>{
      if(partnerId&&payload.new&&payload.new.user_id===partnerId){
        $('typingAnim').classList.toggle('on',payload.new.typing_in_room_id===activeRoom);
      }
    }).subscribe();

  // ── New chat ──
  $('searchInput').addEventListener('input',()=>filterRooms($('searchInput').value));
  $('searchInput').addEventListener('keydown',async e=>{
    if(e.key==='Enter'){
      const u=e.target.value.trim(); if(!u) return;
      const match=filteredRooms.find(r=>(r.other_user.username||'').toLowerCase()===u.toLowerCase());
      if(match){openRoom(match.id,match.other_user.id);e.target.value='';}
      else{e.target.value='';await createRoom(u);}
    }
  });
  async function createRoom(username){
    if(!currentUser) return;
    const {data:user}=await supabase.from('profiles').select('id,username').eq('username',username).maybeSingle();
    if(!user){alert('User not found');return;}
    if(user.id===currentUser.id){alert('Cannot message yourself');return;}
    const {data:exist}=await supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUser.id},user_two_id.eq.${user.id}),and(user_one_id.eq.${user.id},user_two_id.eq.${currentUser.id})`).maybeSingle();
    if(exist){openRoom(exist.id,user.id);return;}
    const {data:nr,error}=await supabase.from('chat_rooms').insert({user_one_id:currentUser.id,user_two_id:user.id}).select('id').single();
    if(error){alert('Room creation failed');return;}
    loadRooms();openRoom(nr.id,user.id);
  }

  function getDel(){try{return new Set(JSON.parse(localStorage.getItem(DELETED_KEY)||'[]'));}catch{return new Set();}}
  function addDel(id){const s=getDel();s.add(id);localStorage.setItem(DELETED_KEY,JSON.stringify([...s]));}

  window.addEventListener('beforeunload',()=>presence('offline'));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)presence('idle');else{presence('online');loadRooms();}});
  setInterval(loadRooms,30000);

  async function init(){
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){window.location.href='user_login.html';return;}
    currentUser=session.user;
    await presence('online');await loadRooms();

    const rp=new URLSearchParams(window.location.search).get('room');
    if(rp){
      const {data:room}=await supabase.from('chat_rooms').select('user_one_id,user_two_id').eq('id',rp).single();
      if(room) openRoom(rp,room.user_one_id===currentUser.id?room.user_two_id:room.user_one_id);
      else{alert('Chat room not found.');window.history.replaceState({},document.title,window.location.pathname);}
    }

    supabase.channel('public:chat_rooms').on('postgres_changes',{event:'*',schema:'public',table:'chat_rooms'},()=>loadRooms()).subscribe();
    $('sendBtn').addEventListener('click',sendMsg);
    $('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

    // ── Back to Home button (replaces logout) ──
    const homeBtn = document.createElement('button');
    homeBtn.textContent = '← Back to Home';
    homeBtn.style.cssText = 'background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--text);padding:6px 14px;border-radius:10px;cursor:pointer;margin-left:auto;font-size:13px;font-weight:600;';
    homeBtn.addEventListener('click', () => { window.location.href = 'index.html'; });
    document.querySelector('.screen-a-inner').appendChild(homeBtn);
  }

  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
