<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e12;
    --card: #1a1a1a;
    --panel: rgba(21, 28, 36, 0.75);
    --accent: #51dad3;
    --accent2: #ffb597;
    --text: #f1f1f1;
    --muted: #9aa0a6;
    --border: rgba(255, 255, 255, 0.04);
    --border-solid: #2a2a2a;
    --danger: #ff4757;
    --success: #2ed573;
    --offline: #555;
    --glow: 0 0 12px rgba(81, 218, 211, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app-root { width: 100%; height: 100dvh; overflow: hidden; position: relative; }

  /* ── SCREEN-A: Messages Directory ── */
  .screen-a {
    position: absolute; top: 0; left: 0; width: 100%; height: 100dvh;
    background: #080b0d;
    display: flex; flex-direction: column;
    transition: transform .3s cubic-bezier(.4,0,.2,1); z-index: 1;
  }

  .screen-a-header {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 16px 12px 16px;
    background: rgba(8, 11, 13, 0.9);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .home-btn {
    background: none; border: none; color: var(--accent);
    font-size: 20px; cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .screen-brand {
    flex: 1;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .screen-brand .brand-ani { color: #fff; }
  .screen-brand .brand-chan { color: var(--accent); }

  .search-box { margin: 12px 16px 8px; position: relative; }
  .search-box .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 18px; pointer-events: none;
  }
  .search-box input {
    width: 100%;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid transparent;
    border-radius: 24px;
    padding: 11px 16px 11px 42px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box input::placeholder { color: #4a5d65; }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  .thread-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: 8px 0 80px;
    position: relative;
  }
  .thread-list::-webkit-scrollbar { width: 4px; }
  .thread-list::-webkit-scrollbar-track { background: transparent; }
  .thread-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .thread-item {
    display: flex; align-items: center;
    padding: 12px 14px;
    border-radius: 12px;
    margin: 2px 8px;
    cursor: pointer;
    transition: background .2s;
    border-left: 3px solid transparent;
    position: relative;
  }
  .thread-item:hover { background: rgba(255,255,255,0.04); }
  .thread-item.active {
    background: rgba(81, 218, 211, 0.08);
    border-left-color: var(--accent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .avatar-ctn { position: relative; width: 50px; height: 50px; margin-right: 14px; flex-shrink: 0; }
  .avatar-ctn img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #333; }
  .online-marker {
    position: absolute; bottom: 1px; right: 0px; left: auto;
    width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid #080b0d;
    background: var(--offline);
    transition: background .3s;
  }
  .online-marker.live { background: var(--success); }

  .thread-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .thread-top { display: flex; justify-content: space-between; align-items: center; }
  .thread-name {
    color: #fff; font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; margin-right: 8px;
  }
  .thread-time { color: #6c7c85; font-size: 12px; flex-shrink: 0; }
  .thread-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .thread-preview {
    color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .thread-preview.typing-preview { color: var(--accent); font-style: italic; }
  .unread-pill {
    background: var(--accent); color: #0a0a0a;
    font-size: 11px; font-weight: 700;
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(81,218,211,.55);
    flex-shrink: 0;
  }

  .new-chat-fab {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a2a28;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(81,218,211,0.4), 0 2px 8px rgba(0,0,0,0.4);
    transition: transform .15s, box-shadow .15s;
    z-index: 10;
  }
  .new-chat-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(81,218,211,0.55), 0 4px 12px rgba(0,0,0,0.4); }
  .new-chat-fab:active { transform: scale(0.96); }
  .new-chat-fab .material-symbols-outlined { font-size: 22px; }

  .friends-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
    z-index: 300; display: none; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  .friends-overlay.open { display: flex; }
  .friends-panel {
    width: 100%; max-width: 400px; max-height: 70vh;
    background: #1a1f26; border: 1px solid var(--border-solid);
    border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,.6);
  }
  .friends-panel h3 {
    margin-bottom: 16px; font-size: 18px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .friends-panel .close-friends { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
  .friends-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .friend-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; transition: background .15s; }
  .friend-item:hover { background: rgba(255,255,255,0.05); }
  .friend-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--panel); border: 1px solid var(--border-solid); }
  .friend-name { font-weight: 600; font-size: 15px; }
  .friend-username { color: var(--muted); font-size: 13px; }
  .no-more { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .add-more-btn {
    background: var(--accent); color: #0a2a28; border: none;
    padding: 10px 16px; border-radius: 12px; font-weight: 600;
    font-size: 14px; cursor: pointer; transition: filter .15s; align-self: center;
  }
  .add-more-btn:hover { filter: brightness(1.1); }

  /* ── SCREEN-B: Conversation Room ── */
  .screen-b {
    position: absolute; top: 0; left: 0; width: 100%; height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column;
    transition: transform .3s cubic-bezier(.4,0,.2,1); z-index: 2;
  }

  .chat-topbar {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: rgba(21, 28, 36, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    flex-shrink: 0; min-height: 64px;
  }
  .back-arrow { display: none; background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; padding: 0 8px 0 0; flex-shrink: 0; }
  .partner-link { display: block; flex-shrink: 0; position: relative; }
  .partner-pic { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-solid); }
  .partner-online {
    position: absolute; bottom: 1px; right: 0px; left: auto;
    width: 11px; height: 11px;
    border-radius: 50%; border: 2px solid #1a1f26;
    background: var(--offline); transition: background .3s;
  }
  .partner-online.live { background: var(--success); }
  .partner-text { margin-left: 6px; }
  .partner-name { font-weight: 600; font-size: 15px; }
  .partner-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .partner-sub.typing-status { color: var(--accent); font-style: italic; }

  .msg-feed {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-feed::-webkit-scrollbar { width: 4px; }
  .msg-feed::-webkit-scrollbar-track { background: transparent; }
  .msg-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .msg-row { display: flex; flex-direction: column; margin-bottom: 4px; width: 100%; }
  .msg-row.out { align-items: flex-end; }
  .msg-row.in { align-items: flex-start; }

  .bubble { padding: 10px 14px; border-radius: 16px; max-width: 75%; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .out .bubble { background: var(--accent); color: #0a2a28; border-bottom-right-radius: 4px; box-shadow: 0 0 10px rgba(81,218,211,.2); }
  .in .bubble { background: #1e262e; color: var(--text); border-bottom-left-radius: 4px; }

  .reply-snip { border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; overflow: hidden; border-left: 3px solid; }
  .in .reply-snip { background: rgba(0, 0, 0, 0.25); border-left-color: var(--accent); }
  .out .reply-snip { background: rgba(0, 0, 0, 0.15); border-left-color: rgba(0,0,0,0.4); }
  .reply-snip .reply-user { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
  .in .reply-snip .reply-user { color: var(--accent); }
  .out .reply-snip .reply-user { color: rgba(0,0,0,0.7); }
  .reply-snip .reply-body { font-size: 12px; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
  .in .reply-snip .reply-body { color: var(--muted); }
  .out .reply-snip .reply-body { color: rgba(0,0,0,0.6); }

  .msg-foot { display: flex; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 3px; align-items: center; }
  .out .msg-foot { justify-content: flex-end; }
  .tick-icon { font-size: 14px; }
  .out .tick-icon.read { color: var(--accent); }

  .deleted-note {
    padding: 6px 14px; border-radius: 20px;
    background: rgba(255,255,255,.05);
    color: var(--muted); font-size: 13px; font-style: italic;
    border: none; box-shadow: none; max-width: 60%; margin: 4px 0;
  }
  .msg-row.out .deleted-note { margin-left: auto; }
  .msg-row.in .deleted-note { margin-right: auto; }

  .unread-separator {
    align-self: center;
    background: rgba(81, 218, 211, 0.12);
    border: 1px solid rgba(81, 218, 211, 0.25);
    color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 5px 16px;
    border-radius: 12px;
    margin: 10px 0;
    pointer-events: none;
  }

  .date-separator {
    align-self: center;
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 12px;
    margin: 8px 0;
    pointer-events: none;
  }

  .swipe-reply-icon {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    color: var(--accent);
    font-size: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .1s;
  }
  .msg-row.in .swipe-reply-icon  { left: -28px; right: auto; }
  .msg-row.out .swipe-reply-icon { right: -28px; left: auto; }
  .msg-row { position: relative; overflow: visible; }

  .reply-strip {
    background: var(--panel);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 10px 8px 10px 14px;
    display: none; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .reply-strip.open { display: flex; }
  .reply-strip-content { flex: 1; min-width: 0; }
  .reply-strip-user { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply-strip-text { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply-strip button { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 4px; transition: color .15s; }
  .reply-strip button:hover { color: var(--danger); }

  @keyframes replyFlash { 0% { background: rgba(81,218,211,0.35); } 100% { background: transparent; } }
  .msg-row.reply-highlight .bubble { animation: replyFlash 1.2s ease-out forwards; border-radius: 16px; }

  .typing-indicator-container {
    padding: 6px 16px;
    font-size: 0.8rem;
    color: var(--accent);
    font-style: italic;
    min-height: 24px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    flex-shrink: 0;
  }
  .typing-dots { display: inline-flex; align-items: center; gap: 2px; }
  .typing-dots span { width: 4px; height: 4px; background-color: var(--accent); border-radius: 50%; animation: typingBlink 1.4s infinite both; }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes typingBlink { 0%, 100% { opacity: .2; } 20% { opacity: 1; } }

  .compose-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: rgba(21, 28, 36, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 10px 8px 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .compose-area #msgInput {
    flex-grow: 1;
    min-width: 0;
    padding: 12px 16px; border-radius: 24px;
    background: rgba(0,0,0,0.25);
    border: 1px solid transparent;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .compose-area #msgInput::placeholder { color: #4a5d65; }
  .compose-area #msgInput:focus { border-color: var(--accent); box-shadow: var(--glow); }
  .send-circle {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: #0a2a28;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
    transition: filter .15s, transform .1s;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(81,218,211,0.35);
  }
  .send-circle:hover { filter: brightness(1.1); }
  .send-circle:active { transform: scale(0.94); }
  .send-circle .material-symbols-outlined { font-size: 20px; }

  .edited-label { font-size: 10px; opacity: 0.65; margin-top: 3px; display: block; font-style: italic; letter-spacing: 0.2px; }
  .out .edited-label { color: rgba(0,0,0,0.55); }
  .in  .edited-label { color: var(--muted); }

  .ctx-menu {
    position: fixed; background: #1a1f26;
    border: 1px solid var(--border-solid);
    border-radius: 14px; padding: 4px 0; min-width: 180px; z-index: 200;
    display: none; box-shadow: 0 12px 32px rgba(0,0,0,.6);
  }
  .ctx-menu button { display: block; width: 100%; padding: 12px 18px; border: none; background: none; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; transition: background .1s; }
  .ctx-menu button:hover { background: rgba(255,255,255,0.05); }
  .ctx-menu .danger { color: var(--danger); }
  .ctx-menu .split { height: 1px; background: var(--border-solid); margin: 2px 0; }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
    flex-direction: column; gap: 12px;
  }
  .empty-state .material-symbols-outlined { font-size: 48px; color: rgba(81,218,211,0.2); }

  /* ── Call overlay & related styles ── */
  .call-actions { display: flex; gap: 8px; margin-left: auto; }
  .call-actions button {
    background: none; border: none;
    color: var(--accent); font-size: 22px;
    cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .call-actions button:hover { background: rgba(81,218,211,0.12); }

  .call-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.95);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .call-overlay.active { display: flex; }

  .call-videos { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; padding: 20px; }
  .call-videos video { max-width: 45%; max-height: 80vh; border-radius: 12px; background: #000; border: 1px solid var(--border); }
  #localVideo { width: 160px; height: 120px; position: absolute; bottom: 100px; right: 20px; border-radius: 12px; border: 2px solid var(--accent); }

  .call-controls { display: flex; gap: 20px; margin-top: 20px; position: absolute; bottom: 40px; }
  .call-controls button {
    width: 56px; height: 56px; border-radius: 50%;
    border: none; background: var(--panel);
    color: var(--text); font-size: 24px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .call-controls button:hover { background: var(--card); }
  #endCallBtn { background: var(--danger); color: #fff; }
  #endCallBtn:hover { background: #e03a4e; }

  .call-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 16px; border-radius: 20px; }

  .incoming-call-popup {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
  }
  .incoming-call-popup.hidden { display: none; }
  .incoming-call-popup:not(.hidden) { display: flex; }

  .incoming-call-content {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px;
    text-align: center; color: var(--text);
    min-width: 280px;
  }
  .incoming-call-content p { margin-bottom: 16px; font-size: 16px; }
  .incoming-call-content button {
    margin: 0 8px; padding: 10px 20px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .incoming-call-content button:hover { background: var(--card); }
  #acceptCallBtn { background: var(--success); color: #fff; border-color: transparent; }
  #declineCallBtn { background: var(--danger); color: #fff; border-color: transparent; }

  @media (max-width: 768px) {
    .screen-a { transform: translateX(0); }
    .screen-b { transform: translateX(100%); }
    .app-root.chat-open .screen-a { transform: translateX(-100%); }
    .app-root.chat-open .screen-b { transform: translateX(0); }
    .back-arrow { display: block; }
  }
  @media (min-width: 769px) {
    .app-root { display: flex; }
    .screen-a { position: relative; width: 340px; flex-shrink: 0; transform: none !important; border-right: 1px solid var(--border); }
    .screen-b { position: relative; flex: 1; transform: none !important; }
    .back-arrow { display: none; }
  }
</style>
</head>
<body>
<div class="app-root" id="appRoot">
  <div class="screen-a" id="screenA">
    <div class="screen-a-header">
      <button class="home-btn" id="homeBtn" title="Back to Home"><span class="material-symbols-outlined">home</span></button>
      <div class="screen-brand"><span class="brand-ani">Ani</span><span class="brand-chan">Chan</span></div>
    </div>
    <div class="search-box">
      <span class="search-icon material-symbols-outlined">search</span>
      <input type="text" id="searchInput" placeholder="Search a conversation" autocomplete="off" />
    </div>
    <div class="thread-list" id="roomList"></div>
    <button class="new-chat-fab" id="newChatBtn" title="New chat"><span class="material-symbols-outlined">edit</span></button>
  </div>

  <div class="screen-b" id="screenB">

  function fmtTimeOnly(iso) { if (!iso) return ''; return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
  function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); }
  function fmtChat(iso) {
    if (!iso) return '';
    const d = new Date(iso), n = new Date(), diff = n - d, mins = Math.floor(diff / 60000);
    if (mins < 1)  return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)  return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7)  return `${days}d ago`;
    return d.toLocaleDateString();
  }
  function getDel()    { try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); } catch { return new Set(); } }

  function handleTypingBroadcast(userId, isTyping) {
    if (userId === partnerId) {

      } else {

        if (room) setPartnerStatus(room.other_user.is_online, room.other_user.last_seen);

    }
    if (isTyping) typingUsers.set(userId, true); else typingUsers.delete(userId);
    renderRooms(filteredRooms);
  }
  function setPartnerStatus(isOnline, lastSeen) {
    const sub = $('partnerSub');
    if (sub.classList.contains('typing-status')) return;
    if (isOnline) { $('partnerDot').classList.add('live'); sub.textContent = 'online'; }

  function filterRooms(q) {
    const t = q.trim().toLowerCase();
    filteredRooms = t ? rooms.filter(r => (r.other_user.full_name || r.other_user.username).toLowerCase().includes(t)) : [...rooms];
    renderRooms(filteredRooms);
  }
  function renderRooms(data) {
    const list = $('roomList'); list.innerHTML = '';
    if (!data.length) { list.innerHTML = '<div style="padding:24px 16px;color:var(--muted);text-align:center;font-size:14px">No conversations yet</div>'; return; }
    data.forEach(room => {
      const o = room.other_user; const isTyping = typingUsers.has(o.id);
      const d = document.createElement('div');
      d.className = 'thread-item' + (activeRoom === room.id ? ' active' : '');
      d.dataset.roomId = room.id; d.dataset.otherId = o.id;
      const previewHtml = isTyping ? `<p class="thread-preview typing-preview">typing...</p>` : `<p class="thread-preview">${esc(room.last_message || '')}</p>`;
      const unreadHtml = room.unread_count ? `<span class="unread-pill">${room.unread_count}</span>` : '';
      d.innerHTML = `
        <div class="avatar-ctn"><img src="${o.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" alt="" /><div class="online-marker${o.is_online ? ' live' : ''}"></div></div>
        <div class="thread-info">
          <div class="thread-top"><span class="thread-name">${esc(o.full_name || o.username)}</span><span class="thread-time">${fmtChat(room.last_message_time)}</span></div>
          <div class="thread-bottom">${previewHtml}${unreadHtml}</div>
        </div>`;
      list.appendChild(d);
    });
  }
  async function loadRooms() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('chat_rooms')
      .select(`id,last_message,last_message_time,user_one_id,user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id,username,full_name,avatar_url,is_online,last_seen),
        user_two:profiles!chat_rooms_user_two_id_fkey(id,username,full_name,avatar_url,is_online,last_seen)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time', { ascending: false });
    if (error) return;
    const enriched = [];
    for (const room of data) {
      const partner = room.user_one_id === currentUser.id ? room.user_two : room.user_one;
      const { count } = await supabase
        .from('messages').select('*', { count: 'exact', head: true })
        .eq('room_id', room.id).eq('receiver_id', currentUser.id).eq('is_read', false).eq('is_deleted', false);
      enriched.push({ id: room.id, last_message: room.last_message, last_message_time: room.last_message_time, other_user: partner, unread_count: count || 0 });
    }
    rooms = enriched;
    filterRooms($('searchInput').value);
  }

  // ── Profile subscription ──
  let presenceChannel = null, profilesChangeSub = null;
  function subscribeToProfiles() {
    if (profilesChangeSub) supabase.removeChannel(profilesChangeSub);
    profilesChangeSub = supabase.channel('profile-status-chan')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, payload => {
        const updated = payload.new; const partnerIds = new Set(rooms.map(r => r.other_user.id));
        if (!partnerIds.has(updated.id)) return;
        updateOnlineDot(updated.id, !!updated.is_online, updated.last_seen);
      })
      .subscribe();
    if (presenceChannel) supabase.removeChannel(presenceChannel);
    presenceChannel = supabase.channel('online-users', { config: { presence: { key: currentUser.id } } });
    presenceChannel
      .on('presence', { event: 'sync' }, () => { const state = presenceChannel.presenceState(); rooms.forEach(room => { if (state[room.other_user.id]) updateOnlineDot(room.other_user.id, true); }); })
      .on('presence', { event: 'join' }, ({ key }) => updateOnlineDot(key, true))
      .subscribe(async status => {
        if (status === 'SUBSCRIBED') {
          await supabase.from('profiles').update({ is_online: true, last_seen: new Date().toISOString() }).eq('id', currentUser.id);
          await presenceChannel.track({ user_id: currentUser.id, online_at: new Date().toISOString() });
        }
      });
  }
  function updateOnlineDot(userId, isOnline, lastSeen = null) {
    rooms.forEach(room => { if (room.other_user.id === userId) { room.other_user.is_online = isOnline; if (lastSeen) room.other_user.last_seen = lastSeen; } });
    renderRooms(filteredRooms);
    if (userId === partnerId) { const room = rooms.find(r => r.other_user.id === userId); setPartnerStatus(isOnline, lastSeen || room?.other_user.last_seen); }
  }

  // ═══════════════════════════════════════
  //  WEBRTC CALL FUNCTIONS (FIXED)
  // ═══════════════════════════════════════

  async function getMedia(constraints) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('localVideo').srcObject = localStream;
    } catch (e) {
      console.error('getUserMedia error:', e);
      alert('Could not access microphone/camera. Please check permissions.');
      throw e;
    }
  }

  function createPeerConnection() {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.onicecandidate = (event) => {
      if (event.candidate && currentCallId) {
        supabase.from('call_signals').insert({ call_id: currentCallId, sender_id: currentUser.id, signal_type: 'candidate', payload: event.candidate.toJSON() }).then();
      }
    };
    pc.ontrack = (event) => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
    if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    return pc;
  }

  async function startCall(type) {
    if (!activeRoom || !partnerId) { alert('Please open a conversation first.'); return; }
    if (callActive) { alert('A call is already in progress.'); return; }
    try {
      await getMedia({ audio: true, video: type === 'video' });
      const { data: call, error } = await supabase.from('calls').insert({
        room_id: activeRoom, caller_id: currentUser.id, receiver_id: partnerId, status: 'pending', media_type: type
      }).select('id').single();
      if (error) throw error;
      currentCallId = call.id; currentCallType = type; callInitiator = true; callActive = true;
      document.getElementById('callOverlay').classList.add('active');
      document.getElementById('callTimer').textContent = '00:00';
      document.getElementById('muteBtn').querySelector('span').textContent = 'mic';
      document.getElementById('cameraBtn').querySelector('span').textContent = 'videocam';
      peerConnection = createPeerConnection();
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await supabase.from('call_signals').insert({
        call_id: currentCallId, sender_id: currentUser.id, signal_type: 'offer', payload: peerConnection.localDescription.toJSON()
      });
      subscribeToCallSignals(currentCallId);
      startCallTimer();
      ignoreNextIncomingCall = true;
      setTimeout(() => { ignoreNextIncomingCall = false; }, 2000);
    } catch (e) { console.error('Start call error:', e); cleanupCall(); }
  }

  function subscribeToCallSignals(callId) {
    if (callChannel) supabase.removeChannel(callChannel);
    callChannel = supabase.channel(`call-signals-${callId}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_signals', filter: `call_id=eq.${callId}` }, async (payload) => {
        const signal = payload.new;
        if (signal.sender_id === currentUser.id) return;
        if (signal.signal_type === 'hangup') { cleanupCall(); return; }
        if (!peerConnection) {
          if (!localStream) try { await getMedia({ audio: true, video: currentCallType === 'video' }); } catch { return; }
          peerConnection = createPeerConnection();
        }
        try {
          if (signal.signal_type === 'candidate') {
            await peerConnection.addIceCandidate(new RTCIceCandidate(signal.payload));
          }
        } catch (e) { console.error(e); }
      })
      .subscribe();
  }

  function startCallTimer() {
    callStartTime = Date.now();
    clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('callTimer').textContent = `${mins}:${secs}`;
    }, 1000);
  }

  async function acceptCall() {
    if (!currentCallId || !partnerId) return;
    callInitiator = false; callActive = true;
    document.getElementById('incomingCallPopup').classList.add('hidden');
    document.getElementById('callOverlay').classList.add('active');
    document.getElementById('muteBtn').querySelector('span').textContent = 'mic';
    document.getElementById('cameraBtn').querySelector('span').textContent = 'videocam';
    try {
      await getMedia({ audio: true, video: currentCallType === 'video' });
      // Fetch the offer that was already sent by the caller
      const { data: signals, error } = await supabase.from('call_signals')
        .select('*').eq('call_id', currentCallId).eq('signal_type', 'offer').neq('sender_id', currentUser.id).maybeSingle();
      if (error || !signals) throw new Error('Offer not found');
      peerConnection = createPeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signals.payload));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await supabase.from('call_signals').insert({
        call_id: currentCallId, sender_id: currentUser.id, signal_type: 'answer', payload: peerConnection.localDescription.toJSON()
      });
      await supabase.from('calls').update({ status: 'active' }).eq('id', currentCallId);
      // Add any ICE candidates that might have been sent already
      const { data: candidates } = await supabase.from('call_signals')
        .select('*').eq('call_id', currentCallId).eq('signal_type', 'candidate').neq('sender_id', currentUser.id);
      if (candidates) {
        for (const c of candidates) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(c.payload));
        }
      }
      startCallTimer();
      subscribeToCallSignals(currentCallId); // for future candidates & hangup
    } catch (e) {
      console.error('Accept call error:', e);
      declineCall();
    }
  }

  async function declineCall() {
    if (!currentCallId) return;
    try { await supabase.from('calls').update({ status: 'rejected' }).eq('id', currentCallId); } catch (e) { console.error(e); }
    cleanupCall();
  }

  async function endCall() {
    if (!currentCallId) return;
    try {
      await supabase.from('call_signals').insert({ call_id: currentCallId, sender_id: currentUser.id, signal_type: 'hangup', payload: {} });
      await supabase.from('calls').update({ status: 'ended' }).eq('id', currentCallId);
    } catch (e) { console.error(e); }
    cleanupCall();
  }

  function cleanupCall() {
    if (peerConnection) { peerConnection.close(); peerConnection = null; }
    if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('callOverlay').classList.remove('active');
    document.getElementById('incomingCallPopup').classList.add('hidden');
    clearInterval(callTimerInterval); callTimerInterval = null; callStartTime = null;
    if (callChannel) { supabase.removeChannel(callChannel); callChannel = null; }
    currentCallId = null; currentCallType = null; callInitiator = false; callActive = false;
  }

  function toggleMute() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) { audioTrack.enabled = !audioTrack.enabled; document.getElementById('muteBtn').querySelector('span').textContent = audioTrack.enabled ? 'mic' : 'mic_off'; }
  }
  function toggleCamera() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) { videoTrack.enabled = !videoTrack.enabled; document.getElementById('cameraBtn').querySelector('span').textContent = videoTrack.enabled ? 'videocam' : 'videocam_off'; }
  }

  // ═══════════════════════════════════════
  //  INCOMING CALL DETECTION
  // ═══════════════════════════════════════
  function subscribeToIncomingCalls() {
    if (incomingChannel) supabase.removeChannel(incomingChannel);
    incomingChannel = supabase.channel('incoming-calls')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: `receiver_id=eq.${currentUser.id}` }, (payload) => {
        if (ignoreNextIncomingCall) return;
        const call = payload.new;
        if (call.status === 'pending' && !callActive) {
          currentCallId = call.id; currentCallType = call.media_type; callInitiator = false;
          document.getElementById('incomingCallType').textContent = call.media_type === 'video' ? 'Video Call' : 'Voice Call';
          document.getElementById('incomingCaller').textContent = document.getElementById('partnerName')?.textContent || 'User';
          document.getElementById('incomingCallPopup').classList.remove('hidden');
          // Do NOT subscribe to signals here; acceptCall will do it after media is ready
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: `receiver_id=eq.${currentUser.id}` }, (payload) => {
        const call = payload.new;
        if (call.id === currentCallId && (call.status === 'ended' || call.status === 'rejected')) {
          if (!callActive) cleanupCall();
        }
      })
      .subscribe();
  }

  // ── Call button listeners ──
  $('voiceCallBtn').addEventListener('click', () => startCall('audio'));
  $('videoCallBtn').addEventListener('click', () => startCall('video'));
  $('muteBtn').addEventListener('click', toggleMute);
  $('cameraBtn').addEventListener('click', toggleCamera);
  $('endCallBtn').addEventListener('click', endCall);
  $('acceptCallBtn').addEventListener('click', acceptCall);
  $('declineCallBtn').addEventListener('click', declineCall);

  // ... (rest of chat initialization, friends, etc.)

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'user_login.html'; return; }
    currentUser = session.user;
    await presence('online');
