<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AniChan · Chat</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          accent2: '#ffb597',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573',
          offline: '#555555'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .message .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
  .message.sent .bubble { background: #51dad3; color: #062525; }
  .message.received .bubble { background: #1a1a1a; }
  .deleted-placeholder { padding: 10px 14px; border-radius: 16px; background: #1a1a1a; font-style: italic; color: #9aa0a6; font-size: 13px; pointer-events: none; user-select: none; }
  .context-menu { position: fixed; background: #161616; border: 1px solid #222; border-radius: 12px; padding: 4px 0; min-width: 140px; z-index: 200; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .context-menu button { display: block; width: 100%; padding: 10px 16px; border: none; background: none; color: #f1f1f1; font-size: 14px; text-align: left; cursor: pointer; transition: background 0.1s; }
  .context-menu button:hover { background: #1a1a1a; }
  .reply-quote { font-size: 11px; color: #9aa0a6; margin-bottom: 4px; border-left: 2px solid #51dad3; padding-left: 6px; cursor: pointer; }
  .reply-quote:hover { color: #f1f1f1; }
  .status-text { font-size: 10px; color: #9aa0a6; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body class="bg-dark text-white font-sans h-screen overflow-hidden flex">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-80 bg-card border-r border-border flex flex-col z-10 transition-transform duration-300 md:relative fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0">
    <div class="p-4 border-b border-border flex items-center gap-3">
      <button id="sidebarBackBtn" class="md:hidden text-accent text-2xl">←</button>
      <h2 class="text-base font-semibold flex-1">Messages</h2>
    </div>
    <div class="p-3 border-b border-border">
      <input type="text" id="newChatUsername" placeholder="Start a chat by username..." class="w-full p-2.5 rounded-lg bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
    </div>
    <div id="roomList" class="flex-1 overflow-y-auto"></div>
  </aside>

  <!-- Chat area -->
  <div class="flex-1 flex flex-col min-w-0 min-h-0">

    <!-- Header -->
    <div id="chatHeader" class="p-3 border-b border-border flex items-center gap-3 bg-card flex-shrink-0" style="display:none;">
      <button class="text-accent text-2xl bg-transparent border-none cursor-pointer" onclick="history.back()">←</button>
      <a id="chatAvatarLink" href="#" target="_blank" class="flex-shrink-0">
        <img id="chatPartnerAvatar" src="" alt="" class="w-10 h-10 rounded-full object-cover border-2 border-border" />
      </a>
      <div>
        <div id="chatPartnerName" class="font-semibold"></div>
        <div id="chatPartnerStatus" class="text-xs text-muted"></div>
        <div id="chatPartnerLastSeen" class="text-xs text-muted"></div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div id="typingIndicator" class="px-4 py-1 text-muted text-xs min-h-[22px] flex-shrink-0"></div>

    <!-- Messages -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-2 flex flex-col">
      <div id="emptyChatPlaceholder" class="flex-1 flex items-center justify-center text-muted text-sm" style="display:none;">
        Select a conversation to start chatting
      </div>
    </div>

    <!-- Reply bar -->
    <div id="replyBar" class="bg-card border-t border-border p-2 px-4 items-center gap-2 hidden">
      <span id="replyQuote" class="flex-1 text-xs text-muted truncate"></span>
      <button id="cancelReplyBtn" class="text-danger text-sm">✕</button>
    </div>

    <!-- Input area -->
    <div id="inputArea" class="bg-card border-t border-border p-3 flex flex-col gap-1.5 flex-shrink-0" style="display:none;">
      <div class="flex gap-2">
        <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 p-3 rounded-lg bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
        <button id="sendBtn" class="px-5 py-3 rounded-lg bg-accent text-black font-bold text-sm hover:brightness-110 transition">Send</button>
      </div>
      <div class="text-center text-xs text-muted select-none">Text & emoji only · no files or images</div>
    </div>
  </div>

  <!-- Context menu (for long press) -->
  <div id="contextMenu" class="context-menu">
    <button id="ctxEdit">Edit</button>
    <button id="ctxDeleteForMe" class="text-danger">Delete for me</button>
    <button id="ctxDeleteForEveryone" class="text-danger">Delete for everyone</button>
    <button id="ctxCancel">Cancel</button>
  </div>

<script>
/*
  ══════════════════════════════════════════════════════
  AniChan Realtime Chat — Redesigned UI
  All original features: swipe reply, long-press edit/delete,
  send status, delete for everyone placeholder, typing indicator.
  ══════════════════════════════════════════════════════
*/
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUser = null, activeRoom = null, partnerId = null;
  let rooms = [], messageSub = null, presenceSub = null;
  let replyToMessage = null;
  let longPressTimer = null;
  let contextMsgId = null;
  let isSending = false;
  const DELETED_KEY = 'anichan_deleted_msgs';

  function resolvePath(f) { return window.location.href.replace(/[^/]*$/, '') + f; }
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    if (now - d < 86400000 && d.getDate() === now.getDate())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(t) { return t.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[m]); }
  function scrollToBottom() { const b = $('chatBox'); b.scrollTop = b.scrollHeight; }

  async function updatePresence(status='online') {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, status, last_active: new Date().toISOString() });
  }
  async function setTyping(roomId, typing) {
    if (!currentUser) return;
    await supabase.from('user_presence').upsert({ user_id: currentUser.id, typing_in_room_id: typing ? roomId : null });
  }

  function getDeletedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); } catch { return new Set(); }
  }
  function addDeleted(msgId) {
    const s = getDeletedSet(); s.add(msgId);
    localStorage.setItem(DELETED_KEY, JSON.stringify([...s]));
  }

  // ── Sidebar ──
  function renderRoomList(roomsData) {
    const list = $('roomList'); list.innerHTML = '';
    if (!roomsData.length) { list.innerHTML = '<div class="p-4 text-muted text-center">No conversations yet</div>'; return; }
    roomsData.forEach(room => {
      const o = room.other_user;
      const div = document.createElement('div');
      div.className = 'flex items-center gap-3 p-3 cursor-pointer hover:bg-panel transition border-b border-border ' + (activeRoom===room.id ? 'bg-panel' : '');
      const previewClass = room.unread_count ? 'font-bold text-white' : 'text-muted';
      div.innerHTML = `
        <img class="w-12 h-12 rounded-full object-cover border-2 border-border" src="${o.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm flex items-center gap-1.5">
            ${escapeHtml(o.full_name || o.username)}
            <span class="inline-block w-2.5 h-2.5 rounded-full ${o.is_online ? 'bg-success' : 'bg-offline'}"></span>
          </div>
          <div class="text-xs ${previewClass} mt-0.5 truncate">${escapeHtml(room.last_message || '')}</div>
        </div>
        <div class="text-right flex-shrink-0">
          <div class="text-xs text-muted">${formatTime(room.last_message_time)}</div>
          ${room.unread_count ? `<span class="inline-block bg-accent text-black text-xs font-bold px-1.5 py-0.5 rounded-full mt-1">${room.unread_count}</span>` : ''}
        </div>`;
      div.addEventListener('click', () => openRoom(room.id, o.id));
      list.appendChild(div);
    });
  }

  async function loadRooms() {
    if (!currentUser) return;
    const { data, error } = await supabase
      .from('chat_rooms')
      .select(`id, last_message, last_message_time, user_one_id, user_two_id,
        user_one:profiles!chat_rooms_user_one_id_fkey(id, username, full_name, avatar_url, is_online),
        user_two:profiles!chat_rooms_user_two_id_fkey(id, username, full_name, avatar_url, is_online)`)
      .or(`user_one_id.eq.${currentUser.id},user_two_id.eq.${currentUser.id}`)
      .order('last_message_time', { ascending: false });
    if (error) { console.error(error); return; }
    const enriched = [];
    for (const room of data) {
      const partner = room.user_one_id === currentUser.id ? room.user_two : room.user_one;
      const { count } = await supabase.from('messages').select('*', { count:'exact', head:true })
        .eq('room_id', room.id).eq('receiver_id', currentUser.id).eq('is_read', false);
      enriched.push({ id: room.id, last_message: room.last_message, last_message_time: room.last_message_time, other_user: partner, unread_count: count||0 });
    }
    rooms = enriched;
    renderRoomList(enriched);
  }

  // ── Open room ──
  async function openRoom(roomId, otherUserId) {
    activeRoom = roomId; partnerId = otherUserId;
    $('emptyChatPlaceholder').style.display = 'none';
    $('chatHeader').style.display = 'flex';
    $('inputArea').style.display = 'flex';
    const { data: p } = await supabase.from('profiles').select('username, full_name, avatar_url, is_online, last_seen').eq('id', otherUserId).single();
    if (p) {
      $('chatPartnerAvatar').src = p.avatar_url || DEFAULT_AVATAR;
      $('chatPartnerName').textContent = p.full_name || p.username;
      $('chatPartnerStatus').textContent = p.is_online ? 'Online' : 'Offline';
      $('chatPartnerLastSeen').textContent = p.is_online ? '' : (p.last_seen ? `Last seen: ${new Date(p.last_seen).toLocaleString()}` : 'Last seen: —');
      $('chatAvatarLink').href = `profile.html?user=${otherUserId}`;
    }
    renderRoomList(rooms);
    await loadMessages(roomId);
    subscribeToMessages(roomId);
    $('typingIndicator').textContent = '';
    // Close sidebar on mobile
    if (window.innerWidth < 768) $('sidebar').classList.add('-translate-x-full');
  }

  // ── Messages ──
  async function loadMessages(roomId) {
    const { data, error } = await supabase.from('messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    renderMessages(data, roomId);
    const unreadIds = data.filter(m => m.receiver_id === currentUser.id && !m.is_read).map(m => m.id);
    if (unreadIds.length) { await supabase.from('messages').update({ is_read: true }).in('id', unreadIds); loadRooms(); }
  }

  function renderMessages(msgs) {
    $('chatBox').innerHTML = '';
    const deleted = getDeletedSet();
    msgs.filter(m => !deleted.has(m.id)).forEach(addMessageElement);
    scrollToBottom();
  }

  function addMessageElement(msg) {
    const box = $('chatBox'), isSent = msg.sender_id === currentUser.id;
    const div = document.createElement('div');
    div.className = `message flex gap-2 max-w-[85%] ${isSent ? 'sent self-end flex-row-reverse' : 'received'}`;
    div.dataset.msgId = msg.id;

    // Deleted for everyone placeholder
    if (msg.is_deleted) {
      div.innerHTML = `<div class="deleted-placeholder">This message was deleted</div><div class="text-xs text-muted mt-1 self-end whitespace-nowrap">${formatTime(msg.created_at)}</div>`;
      box.appendChild(div);
      scrollToBottom();
      return;
    }

    let replyHtml = '';
    if (msg.reply_to) {
      const originalEl = document.querySelector(`.message[data-msg-id="${msg.reply_to}"]`);
      const quotedText = originalEl ? originalEl.querySelector('.bubble')?.textContent?.trim() || 'Message' : 'Message';
      replyHtml = `<div class="reply-quote" data-reply-to="${msg.reply_to}">${escapeHtml(quotedText)}</div>`;
    }

    let content = escapeHtml(msg.message || msg.content || '');
    if (msg.edited_at) content += ' <small class="text-muted">(edited)</small>';

    div.innerHTML = `
      <div class="bubble">${replyHtml}${content}</div>
      <div class="text-xs text-muted mt-1 self-end whitespace-nowrap">${formatTime(msg.created_at)}</div>`;

    // Click on reply quote to jump
    const replyDiv = div.querySelector('.reply-quote');
    if (replyDiv) {
      replyDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        const targetId = replyDiv.dataset.replyTo;
        const target = document.querySelector(`.message[data-msg-id="${targetId}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.background = 'var(--panel)';
          setTimeout(() => target.style.background = '', 1500);
        }
      });
    }

    // Swipe to reply
    attachSwipe(div, msg);

    // Long press for sent messages
    if (isSent) {
      div.addEventListener('touchstart', (e) => startLongPress(e, msg));
      div.addEventListener('touchend', cancelLongPress);
      div.addEventListener('touchmove', cancelLongPress);
    }

    box.appendChild(div);
    const atBottom = (box.scrollHeight - box.clientHeight) <= box.scrollTop + 30;
    if (atBottom) scrollToBottom();
  }

  // ── Swipe to reply ──
  function attachSwipe(el, msg) {
    let startX = 0;
    el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
    el.addEventListener('touchend', (e) => {
      const diff = (e.changedTouches[0]?.clientX || startX) - startX;
      if (diff > 80) setReply(msg);
    });
  }

  function setReply(msg) {
    if (msg.is_deleted) return;
    replyToMessage = { id: msg.id, sender: msg.sender_id, content: msg.message || msg.content };
    $('replyQuote').textContent = replyToMessage.content.substring(0, 60);
    $('replyBar').classList.remove('hidden');
    $('replyBar').classList.add('flex');
    $('messageInput').focus();
  }

  $('cancelReplyBtn').addEventListener('click', () => {
    replyToMessage = null;
    $('replyBar').classList.add('hidden');
    $('replyBar').classList.remove('flex');
  });

  // ── Long press context menu ──
  function startLongPress(e, msg) {
    longPressTimer = setTimeout(() => showContextMenu(e, msg), 500);
  }
  function cancelLongPress() { clearTimeout(longPressTimer); }

  function showContextMenu(e, msg) {
    if (msg.is_deleted) return;
    contextMsgId = msg.id;
    const menu = $('contextMenu');
    const canEdit = (Date.now() - new Date(msg.created_at).getTime()) < 15 * 60 * 1000;
    $('ctxEdit').style.display = canEdit ? 'block' : 'none';
    menu.style.display = 'block';
    menu.style.left = Math.min(e.touches[0].clientX, window.innerWidth - 160) + 'px';
    menu.style.top = (e.touches[0].clientY - 100) + 'px';
  }

  document.addEventListener('click', (e) => {
    if (!$('contextMenu').contains(e.target)) $('contextMenu').style.display = 'none';
  });

  $('ctxEdit').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    const newContent = prompt('Edit message:');
    if (!newContent) return;
    supabase.from('messages').update({ message: newContent, edited_at: new Date().toISOString() }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Edit failed');
      else loadMessages(activeRoom);
    });
  });

  $('ctxDeleteForMe').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    addDeleted(contextMsgId);
    loadMessages(activeRoom);
  });

  $('ctxDeleteForEveryone').addEventListener('click', () => {
    $('contextMenu').style.display = 'none';
    if (!confirm('Delete this message for everyone?')) return;
    supabase.from('messages').update({ is_deleted: true }).eq('id', contextMsgId).then(({error}) => {
      if (error) alert('Delete failed');
      else loadMessages(activeRoom);
    });
  });

  $('ctxCancel').addEventListener('click', () => $('contextMenu').style.display = 'none');

  // ── Send with status ──
  async function sendMessage() {
    const input = $('messageInput'), text = input.value.trim();
    if (!text || !activeRoom || !partnerId || isSending) return;
    input.value = '';
    isSending = true;

    const tempId = 'temp-' + Date.now();
    const tempDiv = document.createElement('div');
    tempDiv.className = 'message sent self-end flex-row-reverse flex gap-2 max-w-[85%]';
    tempDiv.dataset.msgId = tempId;
    tempDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="status-text"><span>sending…</span></div>`;
    $('chatBox').appendChild(tempDiv);
    scrollToBottom();

    const payload = {
      room_id: activeRoom,
      sender_id: currentUser.id,
      receiver_id: partnerId,
      message: text,
      msg_type: 'text',
      reply_to: replyToMessage?.id || null
    };

    if (replyToMessage) {
      replyToMessage = null;
      $('replyBar').classList.add('hidden');
      $('replyBar').classList.remove('flex');
    }

    const { data: inserted, error } = await supabase.from('messages').insert(payload).select().single();

    const statusEl = tempDiv.querySelector('.status-text');
    if (error) {
      statusEl.innerHTML = '<span class="text-danger">not sent, try again</span>';
    } else if (inserted) {
      tempDiv.dataset.msgId = inserted.id;
      statusEl.innerHTML = `<span>sent</span> <span class="text-xs text-muted">${formatTime(inserted.created_at)}</span>`;
      await supabase.from('chat_rooms').update({ last_message: text, last_message_time: new Date().toISOString() }).eq('id', activeRoom);
      loadRooms();
    }
    isSending = false;
  }

  // ── Realtime ──
  function subscribeToMessages(roomId) {
    if (messageSub) supabase.removeChannel(messageSub);
    messageSub = supabase.channel(`room:${roomId}`)
      .on('postgres_changes', { event:'*', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` }, (payload) => {
        if (payload.eventType === 'INSERT') {
          const nm = payload.new;
          if (!document.querySelector(`.message[data-msg-id="${nm.id}"]`)) {
            addMessageElement(nm);
            if (nm.receiver_id === currentUser.id) supabase.from('messages').update({ is_read:true }).eq('id', nm.id).then();
          }
        } else if (payload.eventType === 'UPDATE') {
          loadMessages(roomId);
        }
      }).subscribe();
  }

  // ── Typing ──
  let typingTimeout;
  $('messageInput').addEventListener('input', () => {
    if (!activeRoom) return;
    setTyping(activeRoom, true); clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => setTyping(activeRoom, false), 3000);
  });
  if (presenceSub) supabase.removeChannel(presenceSub);
  presenceSub = supabase.channel('presence-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'user_presence' }, (payload) => {
      if (partnerId && payload.new && payload.new.user_id === partnerId) {
        $('typingIndicator').textContent = (payload.new.typing_in_room_id === activeRoom) ? 'Typing...' : '';
      }
    }).subscribe();

  // ── New chat by username ──
  $('newChatUsername').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { const u = e.target.value.trim(); e.target.value = ''; if (u) await createRoom(u); }
  });
  async function createRoom(username) {
    if (!currentUser) return;
    const { data: user } = await supabase.from('profiles').select('id, username').eq('username', username).maybeSingle();
    if (!user) { alert('User not found'); return; }
    if (user.id === currentUser.id) { alert('Cannot message yourself'); return; }
    const { data: exist } = await supabase.from('chat_rooms').select('id')
      .or(`and(user_one_id.eq.${currentUser.id},user_two_id.eq.${user.id}),and(user_one_id.eq.${user.id},user_two_id.eq.${currentUser.id})`).maybeSingle();
    if (exist) { openRoom(exist.id, user.id); return; }
    const { data: nr, error } = await supabase.from('chat_rooms').insert({ user_one_id: currentUser.id, user_two_id: user.id }).select('id').single();
    if (error) { alert('Room creation failed'); return; }
    loadRooms(); openRoom(nr.id, user.id);
  }

  // ── Lifecycle ──
  window.addEventListener('beforeunload', () => updatePresence('offline'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) updatePresence('idle'); else { updatePresence('online'); loadRooms(); }
  });
  setInterval(loadRooms, 30000);

  $('sidebarBackBtn').addEventListener('click', () => $('sidebar').classList.toggle('-translate-x-full'));
  async function logout() { await updatePresence('offline'); await supabase.auth.signOut(); window.location.href = resolvePath('index.html'); }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = resolvePath('user_login.html'); return; }
    currentUser = session.user;
    await updatePresence('online'); await loadRooms();

    const roomParam = new URLSearchParams(window.location.search).get('room');
    if (roomParam) {
      const { data: room } = await supabase.from('chat_rooms').select('user_one_id, user_two_id').eq('id', roomParam).single();
      if (room) openRoom(roomParam, room.user_one_id === currentUser.id ? room.user_two_id : room.user_one_id);
      else { alert('Chat room not found.'); window.history.replaceState({}, document.title, window.location.pathname); }
    }

    supabase.channel('public:chat_rooms').on('postgres_changes', { event:'*', schema:'public', table:'chat_rooms' }, () => loadRooms()).subscribe();
    $('sendBtn').addEventListener('click', sendMessage);
    $('messageInput').addEventListener('keydown', (e) => { if (e.key==='Enter') sendMessage(); });

    const lb = document.createElement('button'); lb.textContent='Logout';
    lb.className = 'ml-auto bg-transparent border border-red-900/40 text-danger px-3 py-1.5 rounded-lg text-sm hover:bg-red-900/20 transition cursor-pointer';
    lb.addEventListener('click', logout);
    document.querySelector('#sidebar .p-4').appendChild(lb);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
