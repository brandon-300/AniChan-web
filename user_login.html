<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:16px;position:relative;overflow-y:auto;
    -webkit-font-smoothing:antialiased;
  }
  .bg-glow{position:fixed;inset:0;z-index:0}
  .bg-glow::before,.bg-glow::after{
    content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;
  }
  .bg-glow::before{width:500px;height:500px;background:var(--accent);top:-20%;left:-10%}
  .bg-glow::after{width:400px;height:400px;background:var(--accent2);bottom:-20%;right:-10%;opacity:0.08}

  .container{
    position:relative;z-index:1;width:100%;max-width:440px;
    background:rgba(26,26,26,.70);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:24px;padding:32px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);margin:20px 0;
  }
  .tabs{display:flex;gap:0;margin-bottom:28px;background:var(--panel);border-radius:14px;padding:4px}
  .tab-btn{
    flex:1;padding:10px;border:none;background:transparent;
    color:var(--muted);font-size:15px;font-weight:600;
    border-radius:12px;cursor:pointer;transition:all .25s ease;
  }
  .tab-btn.active{background:var(--accent);color:#0a2a28;box-shadow:0 4px 12px rgba(81,218,211,.3)}
  .forms-wrapper{overflow:hidden;position:relative}
  .forms-slider{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .form-panel{min-width:100%;padding:0 2px}
  .form-panel h2{font-size:22px;font-weight:700;margin-bottom:20px;text-align:center}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field input,.field select{
    width:100%;padding:12px 14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s;font-family:inherit;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field input.invalid-age{border-color:var(--danger)!important;color:var(--danger)!important}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:48px}
  .pwd-wrap .reveal{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);font-size:20px;
    cursor:pointer;padding:4px;line-height:1;
  }
  .pwd-wrap .reveal:hover{color:var(--text)}
  .submit-btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:var(--accent);color:#0a2a28;font-size:15px;font-weight:700;
    cursor:pointer;transition:filter .15s;margin-top:8px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .submit-btn:hover{filter:brightness(1.08)}
  .submit-btn:disabled{opacity:0.7;cursor:not-allowed;filter:none;}
  .err-msg{font-size:12px;color:var(--danger);margin-top:8px;display:none}
  .err-msg.show{display:block}
  .success-msg{font-size:12px;color:var(--accent);margin-top:8px;display:none}
  .success-msg.show{display:block}
  .age-error-text{font-size:11px;color:var(--danger);margin-top:4px;display:none}
  .age-error-text.show{display:block}
  .switch-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
  .switch-link button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font:inherit}
  .back-link{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:24px;font-size:14px;color:var(--muted);text-decoration:none;
    transition:color .15s;
  }
  .back-link:hover{color:var(--text)}
  .back-link .material-symbols-outlined{font-size:18px}
  .forgot-link{display:block;text-align:right;margin-top:8px}
  .forgot-link a{font-size:12px;color:var(--muted);text-decoration:underline}
  .forgot-link a:hover{color:var(--text)}
  .dob-row{display:flex;gap:8px}
  .dob-row select{flex:1;padding:12px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239aa0a6'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:30px}
  .dob-row select:focus{border-color:var(--accent)}

  /* Google button */
  .google-btn{
    width:100%;padding:12px;border-radius:12px;
    background:#fff;color:#000;font-size:14px;font-weight:600;
    border:1px solid var(--border);cursor:pointer;
    transition:background .15s;margin-top:12px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .google-btn:hover{background:#eee}
  .google-btn img{width:20px;height:20px}

  /* Onboarding overlay */
  .onboarding-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.6);backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    animation:fadeIn .3s ease;
  }
  .onboarding-overlay.hidden{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .onboarding-card{
    width:100%;max-width:420px;
    background:rgba(26,26,26,.70);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:24px;
    padding:32px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .onboarding-card h2{text-align:center;margin-bottom:8px}
  .onboarding-card p{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}

  /* Suspension / Deletion message area */
  .suspension-msg {
    background: rgba(255,71,87,0.1);
    border: 1px solid var(--danger);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    text-align: center;
    display: none;
  }
  .suspension-msg.show { display: block; }
  .countdown {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 8px;
  }

  /* Toast notification */
  #loginToast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  #loginToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #loginToast.success { border-color: var(--success); color: var(--success); }
  #loginToast.error { border-color: var(--danger); color: var(--danger); }

  /* Appeal section */
  .appeal-btn {
    margin-top: 12px;
    padding: 10px 20px;
    border-radius: 12px;
    background: var(--accent2);
    color: #000;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .appeal-btn:hover { filter: brightness(1.1); }
  .appeal-area {
    margin-top: 12px;
    display: none;
  }
  .appeal-area textarea {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    resize: vertical;
    min-height: 80px;
  }
  .appeal-area button {
    margin-top: 8px;
    padding: 8px 16px;
    border-radius: 10px;
    background: var(--accent);
    color: #0a2a28;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .appeal-status {
    margin-top: 12px;
    color: var(--accent);
    font-size: 14px;
    display: none;
  }

  /* Loading spinner */
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-spinner{
    display:inline-block;width:16px;height:16px;
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:#0a2a28;
    border-radius:50%;
    animation:spin .6s linear infinite;
    vertical-align:middle;flex-shrink:0;
  }
  .onboarding-card .btn-spinner {
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:#0a2a28;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container" id="loginContainer">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">Log in</button>
      <button class="tab-btn" id="tabSignup">Sign up</button>
    </div>
    <div class="forms-wrapper">
      <div class="forms-slider" id="slider">

        <!-- LOGIN PANEL -->
        <div class="form-panel" id="loginPanel">
          <h2>Welcome back</h2>
          <div class="field">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" type="text" autocomplete="username" placeholder="Your username" />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="pwd-wrap">
              <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="reveal" data-target="loginPassword"><span class="material-symbols-outlined">visibility</span></button>
            </div>
          </div>
          <div class="forgot-link"><a href="forgot_password.html">Forgot password?</a></div>
          <!-- Suspension / Deletion message area -->
          <div class="suspension-msg" id="suspensionMsg">
            <p id="suspensionText"></p>
            <div class="countdown" id="countdownTimer"></div>
            <!-- Appeal for deletion -->
            <button class="appeal-btn" id="appealBtn" style="display:none;">Appeal</button>
            <div class="appeal-area" id="appealArea">
              <textarea id="appealMessage" placeholder="Write your appeal..."></textarea>
              <button id="submitAppealBtn">Send Appeal</button>
            </div>
            <div class="appeal-status" id="appealStatus"></div>
          </div>
          <div class="err-msg" id="loginErr"></div>
          <button class="submit-btn" id="loginSubmit">
            <span id="loginBtnText">Log in</span>
          </button>

          <!-- Google sign-in button -->
          <button class="google-btn" id="googleLoginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
            Continue with Google
          </button>

          <div class="switch-link">
            Don't have an account? <button id="switchToSignup">Sign up</button>
          </div>
        </div>

        <!-- SIGNUP PANEL -->
        <div class="form-panel" id="signupPanel">
          <h2>Create account</h2>
          <div class="field">
            <label for="signupFirstName">First name</label>
            <input id="signupFirstName" type="text" autocomplete="given-name" placeholder="First name" />
          </div>
          <div class="field">
            <label for="signupLastName">Last name</label>
            <input id="signupLastName" type="text" autocomplete="family-name" placeholder="Last name" />
          </div>
          <div class="field">
            <label>Date of birth</label>
            <div class="dob-row">
              <select id="dobDay"><option value="">Day</option></select>
              <select id="dobMonth"><option value="">Month</option></select>
              <select id="dobYear"><option value="">Year</option></select>
            </div>
          </div>
          <div class="field">
            <label for="signupAge">Age (auto‑calculated)</label>
            <input id="signupAge" type="text" readonly placeholder="From date of birth" />
            <div class="age-error-text" id="ageError"></div>
          </div>
          <div class="field">
            <label for="signupCountry">Country</label>
            <input id="signupCountry" type="text" placeholder="Your country" />
          </div>
          <div class="field">
            <label for="signupUsername">Username</label>
            <input id="signupUsername" type="text" autocomplete="username" placeholder="Choose a username" />
          </div>
          <div class="field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com" />
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <div class="pwd-wrap">
              <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 chars, 1 letter, 1 number, 1 special" />
              <button type="button" class="reveal" data-target="signupPassword"><span class="material-symbols-outlined">visibility</span></button>
            </div>
          </div>
          <div class="err-msg" id="signupErr"></div>
          <div class="success-msg" id="signupSuccess"></div>
          <button class="submit-btn" id="signupSubmit">
            <span id="signupBtnText">Sign up</span>
          </button>
          <div class="switch-link">
            Already have an account? <button id="switchToLogin">Log in</button>
          </div>
        </div>
      </div>
    </div>
    <a href="index.html" class="back-link">
      <span class="material-symbols-outlined">arrow_back</span> Back to Home
    </a>
  </div>

  <!-- ONBOARDING OVERLAY -->
  <div class="onboarding-overlay hidden" id="onboardingOverlay">
    <div class="onboarding-card">
      <h2>Complete your profile</h2>
      <p>Please fill in a few more details to continue.</p>

      <div class="field">
        <label for="obUsername">Username</label>
        <input id="obUsername" type="text" autocomplete="off" placeholder="Choose a username" />
      </div>

      <div class="field">
        <label>Date of birth</label>
        <div class="dob-row">
          <select id="obDobDay"><option value="">Day</option></select>
          <select id="obDobMonth"><option value="">Month</option></select>
          <select id="obDobYear"><option value="">Year</option></select>
        </div>
      </div>

      <div class="field">
        <label for="obAge">Age (auto‑calculated)</label>
        <input id="obAge" type="text" readonly placeholder="From date of birth" />
      </div>

      <div class="field">
        <label for="obCountry">Country</label>
        <input id="obCountry" type="text" placeholder="Your country" />
      </div>

      <div class="err-msg" id="obErr"></div>
      <div class="success-msg" id="obSuccess"></div>

      <button class="submit-btn" id="obSubmit">
        <span id="obSubmitText">Complete</span>
      </button>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="loginToast"></div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const slider = $("slider");
  const tabLogin = $("tabLogin");
  const tabSignup = $("tabSignup");

  // ── Improved redirect helper ──
  function getRedirectUrl() {
    const urlParams = new URLSearchParams(window.location.search);

    // 1. Explicit ?redirect=... param
    if (urlParams.get('redirect')) return urlParams.get('redirect');

    // 2. Saved in sessionStorage by another page
    const stored = sessionStorage.getItem('login_redirect');
    if (stored) { sessionStorage.removeItem('login_redirect'); return stored; }

    // 3. Fallback to the referring page (if it's on the same domain and not the login page itself)
    if (document.referrer) {
      try {
        const ref = new URL(document.referrer);
        if (ref.hostname === window.location.hostname && !ref.pathname.includes('user_login.html')) {
          return ref.pathname + ref.search;
        }
      } catch (e) {}
    }

    // 4. Default to index.html
    return 'index.html';
  }

  // DOB dropdowns for SIGNUP
  const dobDay = $("dobDay"), dobMonth = $("dobMonth"), dobYear = $("dobYear");
  const signupAge = $("signupAge"), ageError = $("ageError");
  const currentYear = new Date().getFullYear();
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  for (let i = 1; i <= 12; i++) { const o = document.createElement("option"); o.value = i; o.textContent = monthNames[i-1]; dobMonth.appendChild(o); }
  for (let y = currentYear; y >= 1900; y--) { const o = document.createElement("option"); o.value = y; o.textContent = y; dobYear.appendChild(o); }
  function getDaysInMonth(m, y) { if (!m || !y) return 31; return new Date(y, m, 0).getDate(); }
  function populateDays() {
    const m = parseInt(dobMonth.value), y = parseInt(dobYear.value), days = getDaysInMonth(m||1, y||2000), cur = dobDay.value ? parseInt(dobDay.value) : 0;
    dobDay.innerHTML = '<option value="">Day</option>';
    for (let d = 1; d <= days; d++) { const o = document.createElement("option"); o.value = d; o.textContent = d; dobDay.appendChild(o); }
    if (cur > 0 && cur <= days) dobDay.value = cur; else dobDay.value = "";
  }
  dobMonth.addEventListener("change", populateDays); dobYear.addEventListener("change", populateDays); populateDays();
  function updateAgeField() {
    const d = parseInt(dobDay.value), m = parseInt(dobMonth.value), y = parseInt(dobYear.value);
    if (!d || !m || !y) { signupAge.value = ""; signupAge.classList.remove("invalid-age"); ageError.classList.remove("show"); return; }
    const dob = new Date(y, m-1, d), now = new Date();
    let age = now.getFullYear() - dob.getFullYear();
    const md = now.getMonth() - dob.getMonth(); if (md < 0 || (md === 0 && now.getDate() < dob.getDate())) age--;
    signupAge.value = age;
    if (age < 14) { signupAge.classList.add("invalid-age"); ageError.textContent = "You must be at least 14 years old."; ageError.classList.add("show"); }
    else { signupAge.classList.remove("invalid-age"); ageError.classList.remove("show"); }
  }
  dobDay.addEventListener("change", updateAgeField); dobMonth.addEventListener("change", updateAgeField); dobYear.addEventListener("change", updateAgeField);

  // Tab switching
  function switchToLogin() { slider.style.transform = "translateX(0)"; tabLogin.classList.add("active"); tabSignup.classList.remove("active"); clearMessages(); }
  function switchToSignup() { slider.style.transform = "translateX(-100%)"; tabSignup.classList.add("active"); tabLogin.classList.remove("active"); clearMessages(); }
  tabLogin.addEventListener("click", switchToLogin); tabSignup.addEventListener("click", switchToSignup);
  $("switchToSignup").addEventListener("click", switchToSignup); $("switchToLogin").addEventListener("click", switchToLogin);

  document.querySelectorAll(".reveal").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      if (input) {
        const isPw = input.type === "password";
        input.type = isPw ? "text" : "password";
        btn.querySelector('span').textContent = isPw ? "visibility_off" : "visibility";
      }
    });
  });

  // ── Toast helper ──
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = $('loginToast');
    toast.textContent = msg;
    toast.className = type;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function clearMessages() {
    $("loginErr").classList.remove("show"); $("signupErr").classList.remove("show"); $("signupSuccess").classList.remove("show");
    signupAge.classList.remove("invalid-age"); ageError.classList.remove("show");
    hideStatusMessage();
  }
  function isValidPassword(pw) { return pw.length >= 8 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw) && /[^a-zA-Z0-9]/.test(pw); }

  function setButtonLoading(btn, loading, label) {
    if (loading) {
      btn._originalHTML = btn.innerHTML;
      btn._originalDisabled = btn.disabled;
      btn.disabled = true;
      btn.innerHTML = `<span class="btn-spinner"></span> ${label || 'Loading…'}`;
    } else {
      btn.innerHTML = btn._originalHTML || btn.innerHTML;
      btn.disabled = btn._originalDisabled || false;
      delete btn._originalHTML;
      delete btn._originalDisabled;
    }
  }

  // ── Suspension / Deletion UI logic ──
  let countdownInterval = null;
  let unsuspendPollInterval = null;

  function hideStatusMessage() {
    $("suspensionMsg").classList.remove("show");
    $("loginSubmit").style.display = "";
    $("loginPassword").style.display = "";
    $("appealBtn").style.display = "none";
    $("appealArea").style.display = "none";
    $("appealStatus").style.display = "none";
    if (countdownInterval) clearInterval(countdownInterval);
    if (unsuspendPollInterval) clearInterval(unsuspendPollInterval);
  }

  function showSuspension(adminNote, suspendedUntilISO) {
    const suspendedUntil = new Date(suspendedUntilISO);
    const now = new Date();
    if (suspendedUntil <= now) {
      hideStatusMessage();
      return;
    }

    $("loginSubmit").style.display = "none";
    $("loginPassword").style.display = "none";
    $("suspensionMsg").classList.add("show");
    $("suspensionText").textContent = "Account suspended" + (adminNote ? ": " + adminNote : ".");
    $("appealBtn").style.display = "none";
    $("appealArea").style.display = "none";
    $("appealStatus").style.display = "none";
    $("countdownTimer").style.display = "block";

    function updateCountdown() {
      const now = new Date();
      const diff = suspendedUntil - now;
      if (diff <= 0) {
        clearInterval(countdownInterval);
        clearInterval(unsuspendPollInterval);
        hideStatusMessage();
        showToast("Your suspension has ended. You can now log in.", "success");
        $("loginUsername").value = "";
        $("loginPassword").value = "";
        return;
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      $("countdownTimer").textContent = `${days > 0 ? days + 'd ' : ''}${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    }

    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);

    unsuspendPollInterval = setInterval(async () => {
      const username = $("loginUsername").value.trim();
      if (!username) return;
      const { data } = await supabase
        .from("profiles")
        .select("is_suspended")
        .eq("username", username)
        .maybeSingle();
      if (data && !data.is_suspended) {
        clearInterval(unsuspendPollInterval);
        clearInterval(countdownInterval);
        hideStatusMessage();
        showToast("Your suspension has been lifted. You can now log in.", "success");
        $("loginUsername").value = "";
        $("loginPassword").value = "";
      }
    }, 10000);
  }

  function showDeletionPending(adminNote, deletedAtISO, lastAppealAt) {
    const deletedAt = new Date(deletedAtISO);
    const now = new Date();
    const permanentDeletion = new Date(deletedAt.getTime() + 24 * 60 * 60 * 1000);
    const diff = permanentDeletion - now;

    if (diff <= 0) {
      hideStatusMessage();
      return;
    }

    const username = $("loginUsername").value.trim();

    $("loginSubmit").style.display = "none";
    $("loginPassword").style.display = "none";
    $("suspensionMsg").classList.add("show");
    $("suspensionText").textContent = "Account scheduled for deletion" + (adminNote ? ": " + adminNote : ".");
    $("countdownTimer").style.display = "block";
    const hoursLeft = Math.max(1, Math.ceil(diff / (1000 * 60 * 60)));
    $("countdownTimer").textContent = `Time remaining: ${hoursLeft} hour(s)`;

    // Determine appeal state from lastAppealAt
    let appealCooldownRemaining = 0;
    if (lastAppealAt) {
      const elapsed = now - new Date(lastAppealAt);
      const cooldownMs = 10 * 60 * 1000; // 10 minutes
      appealCooldownRemaining = Math.max(0, cooldownMs - elapsed);
    }

    // Clear any previous appeal UI
    $("appealBtn").style.display = "none";
    $("appealArea").style.display = "none";
    $("appealStatus").style.display = "none";

    if (appealCooldownRemaining > 0) {
      // Show waiting message with countdown
      $("appealStatus").style.display = "block";
      const minutesLeft = Math.ceil(appealCooldownRemaining / 60000);
      $("appealStatus").textContent = "Your appeal has been received and is now waiting for the admins to respond. The admin would respond in the next minutes. In the case the admin didn't respond you can resend another appeal in " + minutesLeft + " minutes.";

      // Start a timer to update the countdown and eventually show the appeal button again
      const cooldownInterval = setInterval(() => {
        const elapsed = Date.now() - new Date(lastAppealAt).getTime();
        const remaining = Math.max(0, 10 * 60 * 1000 - elapsed);
        if (remaining <= 0) {
          clearInterval(cooldownInterval);
          $("appealStatus").style.display = "none";
          $("appealBtn").style.display = "inline-block";
        } else {
          const mins = Math.ceil(remaining / 60000);
          $("appealStatus").textContent = "Your appeal has been received and is now waiting for the admins to respond. The admin would respond in the next minutes. In the case the admin didn't respond you can resend another appeal in " + mins + " minutes.";
        }
      }, 30000);
    } else {
      // Show appeal button
      $("appealBtn").style.display = "inline-block";
    }

    // Appeal button handler
    $("appealBtn").onclick = () => {
      $("appealBtn").style.display = "none";
      $("appealArea").style.display = "block";
      $("appealMessage").value = "";
    };

    // Submit appeal
    $("submitAppealBtn").onclick = async () => {
      const message = $("appealMessage").value.trim();
      if (!message) return;
      if (!username) return;

      const { data: profile } = await supabase
        .from("profiles")
        .select("id")
        .eq("username", username)
        .maybeSingle();

      if (!profile) return;

      const btn = $("submitAppealBtn");
      btn.disabled = true;
      btn.textContent = "Sending...";

      const res = await fetch('/api/user/appeal-deletion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: profile.id, message })
      });

      if (res.ok) {
        // Sent successfully – the API updates last_appeal_at, so we re-fetch to get the new timestamp
        const { data: updated } = await supabase
          .from("profiles")
          .select("last_appeal_at")
          .eq("id", profile.id)
          .single();

        // Re-render with the new last_appeal_at
        showDeletionPending(adminNote, deletedAtISO, updated?.last_appeal_at || new Date().toISOString());
        showToast("Appeal sent successfully.", "success");
      } else {
        btn.textContent = "Failed";
        btn.disabled = false;
        showToast("Failed to send appeal.", "error");
      }
    };

    // Poll for deletion cancellation
    unsuspendPollInterval = setInterval(async () => {
      if (!username) return;
      const { data } = await supabase
        .from("profiles")
        .select("is_pending_delete")
        .eq("username", username)
        .maybeSingle();
      if (data && !data.is_pending_delete) {
        clearInterval(unsuspendPollInterval);
        hideStatusMessage();
        showToast("Your account deletion has been cancelled. You can now log in.", "success");
        $("loginUsername").value = "";
        $("loginPassword").value = "";
      }
    }, 10000);
  }

  // ── Pre‑login status check ──
  async function checkStatus(username) {
    const { data, error } = await supabase
      .from("profiles")
      .select("is_suspended, suspended_until, admin_note, is_pending_delete, deleted_at, last_appeal_at")
      .eq("username", username)
      .maybeSingle();
    if (error || !data) return false;

    if (data.is_pending_delete && data.deleted_at) {
      showDeletionPending(data.admin_note, data.deleted_at, data.last_appeal_at);
      return true;
    }
    if (data.is_suspended && data.suspended_until) {
      showSuspension(data.admin_note, data.suspended_until);
      return true;
    }
    if (data.is_suspended) {
      await supabase.from("profiles").update({ is_suspended: false, suspended_until: null, admin_note: null }).eq("username", username);
    }
    return false;
  }

  // ── Login (email/password) ──
  $("loginSubmit").addEventListener("click", async () => {
    const username = $("loginUsername").value.trim(), password = $("loginPassword").value, err = $("loginErr");
    err.classList.remove("show");
    if (!username || !password) { err.textContent = "Please enter both username and password."; err.classList.add("show"); return; }

    const blocked = await checkStatus(username);
    if (blocked) return;

    const btn = $("loginSubmit");
    setButtonLoading(btn, true, 'Logging in…');
    try {
      const { data: profile } = await supabase.from("profiles").select("email, id").eq("username", username).maybeSingle();
      if (!profile) { err.textContent = "Username does not exist."; err.classList.add("show"); setButtonLoading(btn, false); return; }
      const { error: authErr } = await supabase.auth.signInWithPassword({ email: profile.email, password });
      if (authErr) throw authErr;
      const { data: full } = await supabase.from("profiles").select("is_suspended, suspended_until, admin_note, is_pending_delete, deleted_at, last_appeal_at").eq("id", profile.id).single();
      if (full?.is_pending_delete) {
        const delAt = new Date(full.deleted_at), now = new Date();
        const permanent = new Date(delAt.getTime() + 24*60*60*1000);
        const diff = permanent - now;
        if (diff <= 0) {
          err.textContent = "Account no longer exists.";
          err.classList.add("show");
          setButtonLoading(btn, false);
          return;
        }
        const hours = Math.ceil(diff / (1000*60*60));
        err.textContent = `Account scheduled for deletion. Note: "${full.admin_note}". Time left: ${hours} hour(s).`;
        err.classList.add("show");
        showDeletionPending(full.admin_note, full.deleted_at, full.last_appeal_at);
        setButtonLoading(btn, false);
        return;
      }
      if (full?.is_suspended) {
        const until = new Date(full.suspended_until);
        if (until > new Date()) {
          const rem = until - new Date(), d = Math.floor(rem/(1000*60*60*24)), h = Math.floor((rem%(1000*60*60*24))/(1000*60*60));
          err.textContent = `Account suspended. Note: "${full.admin_note}". Remaining: ${d}d ${h}h.`;
          err.classList.add("show");
          showSuspension(full.admin_note, full.suspended_until);
          setButtonLoading(btn, false);
          return;
        } else {
          await supabase.from("profiles").update({ is_suspended: false, suspended_until: null, admin_note: null }).eq("id", profile.id);
        }
      }
      // ── Redirect to the original page ──
      window.location.href = getRedirectUrl();
    } catch(e) {
      err.textContent = e.message || "Login failed."; err.classList.add("show");
      setButtonLoading(btn, false);
    }
  });

  // ── Google OAuth (now carries the return URL) ──
  $("googleLoginBtn").addEventListener("click", async () => {
    const returnUrl = getRedirectUrl();
    sessionStorage.setItem('login_redirect', returnUrl);
    // Build the redirectTo URL for Supabase, including the onboarding flag and the return URL
    const onboardingUrl = window.location.origin + "/user_login.html?onboarding=1&redirect=" + encodeURIComponent(returnUrl);
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: onboardingUrl,
      },
    });
  });

  // ── Signup ──
  $("signupSubmit").addEventListener("click", async () => {
    const fn = $("signupFirstName").value.trim(), ln = $("signupLastName").value.trim();
    const country = $("signupCountry").value.trim(), username = $("signupUsername").value.trim();
    const email = $("signupEmail").value.trim(), password = $("signupPassword").value;
    const day = parseInt(dobDay.value), month = parseInt(dobMonth.value), year = parseInt(dobYear.value);
    const err = $("signupErr"), success = $("signupSuccess");
    err.classList.remove("show"); success.classList.remove("show");
    if (!fn||!ln||!country||!username||!email||!password||!day||!month||!year) { err.textContent = "All fields are required."; err.classList.add("show"); return; }
    const age = parseInt(signupAge.value,10); if (isNaN(age)||age<14) { err.textContent = "You must be at least 14 years old."; err.classList.add("show"); return; }
    if (!isValidPassword(password)) { err.textContent = "Password must be 8+ chars with letter, number, special."; err.classList.add("show"); return; }
    const btn = $("signupSubmit");
    setButtonLoading(btn, true, 'Creating account…');
    const fullName = `${fn} ${ln}`, dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    try {
      const { data: exist } = await supabase.from("profiles").select("id").eq("username", username).maybeSingle();
      if (exist) { err.textContent = "Username already taken."; err.classList.add("show"); setButtonLoading(btn, false); return; }
      const { data: auth, error: authErr } = await supabase.auth.signUp({ email, password, options: { data: { username, full_name: fullName }, emailRedirectTo: window.location.origin+"/index.html" } });
      if (authErr) throw authErr;
      if (!auth.user) throw new Error("Signup failed.");
      const { error: insErr } = await supabase.from("profiles").insert({ id: auth.user.id, username, full_name: fullName, age, dob, country, email });
      if (insErr) throw new Error("Profile creation failed: "+insErr.message);
      success.textContent = "Account created! You can now log in."; success.classList.add("show");
      $("signupFirstName").value=$("signupLastName").value=$("signupCountry").value=$("signupUsername").value=$("signupEmail").value=$("signupPassword").value="";
      dobDay.value=dobMonth.value=dobYear.value=""; populateDays(); signupAge.value=""; signupAge.classList.remove("invalid-age"); ageError.classList.remove("show");
      setButtonLoading(btn, false);
    } catch(e) {
      err.textContent = e.message || "Registration failed."; err.classList.add("show");
      setButtonLoading(btn, false);
    }
  });

  // ── ONBOARDING MODAL ──
  const obDay = $("obDobDay"), obMonth = $("obDobMonth"), obYear = $("obDobYear");
  const obAge = $("obAge");
  for (let i = 1; i <= 12; i++) { const o = document.createElement("option"); o.value = i; o.textContent = monthNames[i-1]; obMonth.appendChild(o); }
  for (let y = currentYear; y >= 1900; y--) { const o = document.createElement("option"); o.value = y; o.textContent = y; obYear.appendChild(o); }
  function populateObDays() {
    const m = parseInt(obMonth.value), y = parseInt(obYear.value), days = getDaysInMonth(m||1, y||2000), cur = obDay.value ? parseInt(obDay.value) : 0;
    obDay.innerHTML = '<option value="">Day</option>';
    for (let d = 1; d <= days; d++) { const o = document.createElement("option"); o.value = d; o.textContent = d; obDay.appendChild(o); }
    if (cur > 0 && cur <= days) obDay.value = cur; else obDay.value = "";
  }
  obMonth.addEventListener("change", populateObDays); obYear.addEventListener("change", populateObDays); populateObDays();
  function updateObAge() {
    const d = parseInt(obDay.value), m = parseInt(obMonth.value), y = parseInt(obYear.value);
    if (!d || !m || !y) { obAge.value = ""; return; }
    const dob = new Date(y, m-1, d), now = new Date();
    let age = now.getFullYear() - dob.getFullYear();
    const md = now.getMonth() - dob.getMonth(); if (md < 0 || (md === 0 && now.getDate() < dob.getDate())) age--;
    obAge.value = age;
  }
  obDay.addEventListener("change", updateObAge); obMonth.addEventListener("change", updateObAge); obYear.addEventListener("change", updateObAge);

  function showOnboardingModal() {
    $("obUsername").value = "";
    obDay.value = obMonth.value = obYear.value = "";
    populateObDays();
    obAge.value = "";
    $("obCountry").value = "";
    $("obErr").classList.remove("show");
    $("obSuccess").classList.remove("show");
    $("onboardingOverlay").classList.remove("hidden");
  }

  function hideOnboardingModal() { $("onboardingOverlay").classList.add("hidden"); }

  $("obSubmit").addEventListener("click", async () => {
    const username = $("obUsername").value.trim();
    const country = $("obCountry").value.trim();
    const day = parseInt(obDay.value), month = parseInt(obMonth.value), year = parseInt(obYear.value);
    const err = $("obErr"), success = $("obSuccess");
    err.classList.remove("show"); success.classList.remove("show");

    if (!username || !country || !day || !month || !year) { err.textContent = "All fields are required."; err.classList.add("show"); return; }
    const age = parseInt(obAge.value, 10);
    if (isNaN(age) || age < 14) { err.textContent = "You must be at least 14 years old."; err.classList.add("show"); return; }
    if (username.length < 3 || username.length > 20) { err.textContent = "Username must be between 3 and 20 characters."; err.classList.add("show"); return; }

    const btn = $("obSubmit");
    setButtonLoading(btn, true, 'Saving…');
    try {
      const { data: exist } = await supabase.from("profiles").select("id").eq("username", username).maybeSingle();
      if (exist) { err.textContent = "Username already taken."; err.classList.add("show"); setButtonLoading(btn, false); return; }
      const { data: { session } } = await supabase.auth.getSession();
      if (!session?.user) throw new Error("Session expired. Please log in again.");
      const dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const { error: updateErr } = await supabase.from("profiles").update({ username, age, dob, country }).eq("id", session.user.id);
      if (updateErr) throw updateErr;
      success.textContent = "Profile complete! Redirecting…";
      success.classList.add("show");
      setTimeout(() => {
        hideOnboardingModal();
        // After onboarding, go to the originally intended page
        window.location.href = getRedirectUrl();
      }, 3000);
    } catch (e) {
      err.textContent = e.message || "An error occurred."; err.classList.add("show");
      setButtonLoading(btn, false);
    }
  });

  async function checkOnboarding() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("onboarding") !== "1") return;
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user) return;
    let { data: profile } = await supabase.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (!profile) {
      const { error: insertErr } = await supabase.from("profiles").insert({
        id: session.user.id,
        email: session.user.email,
        full_name: session.user.user_metadata?.name || '',
        avatar_url: session.user.user_metadata?.picture || '',
      });
      if (insertErr) {
        $("obErr").textContent = "Failed to create profile: " + insertErr.message;
        $("obErr").classList.add("show");
        $("onboardingOverlay").classList.remove("hidden");
        return;
      }
      const { data: newProfile } = await supabase.from("profiles").select("*").eq("id", session.user.id).single();
      profile = newProfile;
    }

    if (profile && profile.is_suspended && profile.suspended_until && new Date(profile.suspended_until) > new Date()) {
      alert(`Your account is suspended. Reason: ${profile.admin_note || 'N/A'}. Please contact support.`);
      await supabase.auth.signOut();
      window.location.href = "index.html";
      return;
    }
    if (profile && profile.is_pending_delete && profile.deleted_at) {
      alert(`Your account is scheduled for deletion. Reason: ${profile.admin_note || 'N/A'}.`);
      await supabase.auth.signOut();
      window.location.href = "index.html";
      return;
    }

    if (profile && profile.username && profile.dob && profile.country) {
      // Already complete – go to the intended page
      window.location.href = getRedirectUrl();
      return;
    }
    showOnboardingModal();
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !$("onboardingOverlay").classList.contains("hidden")) {
      $("obSubmit").click();
    } else if (e.key === "Enter") {
      tabLogin.classList.contains("active") ? $("loginSubmit").click() : $("signupSubmit").click();
    }
  });

  window.addEventListener("online", () => setTimeout(() => location.reload(), 1000));
  window.addEventListener("load", () => { setTimeout(checkOnboarding, 500); });
})();
</script>
</body>
</html>
