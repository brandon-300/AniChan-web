<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Login</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          accent2: '#ffb597',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .tabs-container {
    background: #1a1a1a; border-radius: 12px; padding: 4px;
  }
  .tab-btn {
    flex: 1; padding: 10px; border: none; background: transparent;
    color: #9aa0a6; font-size: 15px; font-weight: 600;
    border-radius: 10px; cursor: pointer; transition: all 0.25s ease;
  }
  .tab-btn.active {
    background: #51dad3; color: #062525;
    box-shadow: 0 4px 12px rgba(81,218,211,0.3);
  }
  .forms-slider {
    display: flex; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .form-panel {
    min-width: 100%; padding: 0 2px;
  }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background radial gradients -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent/10 blur-3xl"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[400px] h-[400px] rounded-full bg-accent2/5 blur-3xl"></div>
  </div>

  <!-- Login card -->
  <div class="relative z-10 w-full max-w-md bg-card/70 glass border border-border rounded-3xl p-8 shadow-2xl">

    <!-- Tabs -->
    <div class="tabs-container flex mb-7">
      <button class="tab-btn active" id="tabLogin">Log in</button>
      <button class="tab-btn" id="tabSignup">Sign up</button>
    </div>

    <!-- Slider -->
    <div class="overflow-hidden relative">
      <div class="forms-slider" id="slider">

        <!-- ========= LOGIN PANEL ========= -->
        <div class="form-panel" id="loginPanel">
          <h2 class="text-xl font-bold text-center mb-5">Welcome back</h2>

          <div class="mb-4">
            <label for="loginUsername" class="text-xs text-muted mb-1.5 block">Username</label>
            <input id="loginUsername" type="text" autocomplete="username" placeholder="Your username"
                   class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
          </div>

          <div class="mb-4 relative">
            <label for="loginPassword" class="text-xs text-muted mb-1.5 block">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"
                   class="w-full p-3 pr-12 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
            <button type="button" data-target="loginPassword" class="absolute right-3 top-[38px] text-muted hover:text-white transition reveal-btn">
              <span class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>

          <a href="forgot_password.html" class="block text-right text-xs text-muted underline hover:text-white mt-1">Forgot password?</a>

          <div id="loginErr" class="text-xs text-danger mt-3 hidden"></div>

          <button id="loginSubmit" class="w-full mt-4 py-3 rounded-xl bg-accent text-black font-bold text-sm hover:brightness-110 active:scale-95 transition-all">
            Log in
          </button>

          <div class="text-center mt-4 text-sm text-muted">
            Don't have an account? <button id="switchToSignup" class="text-accent font-semibold hover:underline bg-transparent border-none cursor-pointer">Sign up</button>
          </div>
        </div>

        <!-- ========= SIGNUP PANEL ========= -->
        <div class="form-panel" id="signupPanel">
          <h2 class="text-xl font-bold text-center mb-5">Create account</h2>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label for="signupFirstName" class="text-xs text-muted mb-1.5 block">First name</label>
              <input id="signupFirstName" type="text" autocomplete="given-name" placeholder="First name"
                     class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
            </div>
            <div>
              <label for="signupLastName" class="text-xs text-muted mb-1.5 block">Last name</label>
              <input id="signupLastName" type="text" autocomplete="family-name" placeholder="Last name"
                     class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
            </div>
          </div>

          <!-- Date of birth selects -->
          <label class="text-xs text-muted mb-1.5 block">Date of birth</label>
          <div class="flex gap-2 mb-4">
            <select id="dobDay" class="flex-1 p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition appearance-none">
              <option value="">Day</option>
            </select>
            <select id="dobMonth" class="flex-1 p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition appearance-none">
              <option value="">Month</option>
            </select>
            <select id="dobYear" class="flex-1 p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition appearance-none">
              <option value="">Year</option>
            </select>
          </div>

          <!-- Age (auto-calculated, read-only) -->
          <div class="mb-4">
            <label for="signupAge" class="text-xs text-muted mb-1.5 block">Age (auto‑calculated)</label>
            <input id="signupAge" type="text" readonly placeholder="From date of birth"
                   class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none opacity-80" />
            <div id="ageError" class="text-xs text-danger mt-1 hidden"></div>
          </div>

          <div class="mb-4">
            <label for="signupCountry" class="text-xs text-muted mb-1.5 block">Country</label>
            <input id="signupCountry" type="text" placeholder="Your country"
                   class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
          </div>

          <div class="mb-4">
            <label for="signupUsername" class="text-xs text-muted mb-1.5 block">Username</label>
            <input id="signupUsername" type="text" autocomplete="username" placeholder="Choose a username"
                   class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
          </div>

          <div class="mb-4">
            <label for="signupEmail" class="text-xs text-muted mb-1.5 block">Email</label>
            <input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com"
                   class="w-full p-3 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
          </div>

          <div class="mb-4 relative">
            <label for="signupPassword" class="text-xs text-muted mb-1.5 block">Password</label>
            <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 chars, 1 letter, 1 number, 1 special"
                   class="w-full p-3 pr-12 rounded-xl bg-panel border border-border text-white text-sm outline-none focus:border-accent transition" />
            <button type="button" data-target="signupPassword" class="absolute right-3 top-[38px] text-muted hover:text-white transition reveal-btn">
              <span class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>

          <div id="signupErr" class="text-xs text-danger mt-2 hidden"></div>
          <div id="signupSuccess" class="text-xs text-accent mt-2 hidden"></div>

          <button id="signupSubmit" class="w-full mt-4 py-3 rounded-xl bg-accent text-black font-bold text-sm hover:brightness-110 active:scale-95 transition-all">
            Sign up
          </button>

          <div class="text-center mt-4 text-sm text-muted">
            Already have an account? <button id="switchToLogin" class="text-accent font-semibold hover:underline bg-transparent border-none cursor-pointer">Log in</button>
          </div>
        </div>
      </div>
    </div>

    <a href="index.html" class="block text-center mt-6 text-muted text-sm hover:text-white transition">← Back to Home</a>
  </div>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const slider = $("slider");
  const tabLogin = $("tabLogin");
  const tabSignup = $("tabSignup");

  // ---------- Date of birth dropdowns ----------
  const dobDay = $("dobDay");
  const dobMonth = $("dobMonth");
  const dobYear = $("dobYear");
  const signupAge = $("signupAge");
  const ageError = $("ageError");

  const currentYear = new Date().getFullYear();
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  for (let i = 1; i <= 12; i++) {
    const option = document.createElement("option");
    option.value = i; option.textContent = monthNames[i-1];
    dobMonth.appendChild(option);
  }
  for (let y = currentYear; y >= 1900; y--) {
    const option = document.createElement("option");
    option.value = y; option.textContent = y;
    dobYear.appendChild(option);
  }

  function getDaysInMonth(month, year) {
    if (!month || !year) return 31;
    return new Date(year, month, 0).getDate();
  }
  function populateDays() {
    const month = parseInt(dobMonth.value);
    const year = parseInt(dobYear.value);
    const days = getDaysInMonth(month || 1, year || 2000);
    const currentDay = dobDay.value ? parseInt(dobDay.value) : 0;
    dobDay.innerHTML = '<option value="">Day</option>';
    for (let d = 1; d <= days; d++) {
      const option = document.createElement("option");
      option.value = d; option.textContent = d;
      dobDay.appendChild(option);
    }
    if (currentDay > 0 && currentDay <= days) dobDay.value = currentDay;
    else dobDay.value = "";
  }
  dobMonth.addEventListener("change", populateDays);
  dobYear.addEventListener("change", populateDays);
  populateDays();

  function updateAgeField() {
    const day = parseInt(dobDay.value);
    const month = parseInt(dobMonth.value);
    const year = parseInt(dobYear.value);
    if (!day || !month || !year) {
      signupAge.value = "";
      signupAge.classList.remove("invalid-age");
      ageError.classList.add("hidden");
      return;
    }
    const dobDate = new Date(year, month - 1, day);
    const today = new Date();
    let age = today.getFullYear() - dobDate.getFullYear();
    const monthDiff = today.getMonth() - dobDate.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dobDate.getDate())) age--;
    signupAge.value = age;
    if (age < 14) {
      signupAge.classList.add("invalid-age");
      signupAge.style.borderColor = '#ff4757';
      signupAge.style.color = '#ff4757';
      ageError.textContent = "You must be at least 14 years old.";
      ageError.classList.remove("hidden");
    } else {
      signupAge.classList.remove("invalid-age");
      signupAge.style.borderColor = '#222';
      signupAge.style.color = '#f1f1f1';
      ageError.classList.add("hidden");
    }
  }
  dobDay.addEventListener("change", updateAgeField);
  dobMonth.addEventListener("change", updateAgeField);
  dobYear.addEventListener("change", updateAgeField);

  function switchToLogin() {
    slider.style.transform = "translateX(0)";
    tabLogin.classList.add("active");
    tabSignup.classList.remove("active");
    clearMessages();
  }
  function switchToSignup() {
    slider.style.transform = "translateX(-100%)";
    tabSignup.classList.add("active");
    tabLogin.classList.remove("active");
    clearMessages();
  }

  tabLogin.addEventListener("click", switchToLogin);
  tabSignup.addEventListener("click", switchToSignup);
  $("switchToSignup").addEventListener("click", switchToSignup);
  $("switchToLogin").addEventListener("click", switchToLogin);

  // Password reveal
  document.querySelectorAll(".reveal-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      if (input) {
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        btn.querySelector('span').textContent = isPassword ? "visibility_off" : "visibility";
      }
    });
  });

  function clearMessages() {
    $("loginErr").classList.add("hidden");
    $("signupErr").classList.add("hidden");
    $("signupSuccess").classList.add("hidden");
    signupAge.classList.remove("invalid-age");
    signupAge.style.borderColor = '#222';
    signupAge.style.color = '#f1f1f1';
    ageError.classList.add("hidden");
  }

  // Password strength
  function isValidPassword(pw) {
    if (pw.length < 8) return false;
    return /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw) && /[^a-zA-Z0-9]/.test(pw);
  }

  // --- Login via username ---
  $("loginSubmit").addEventListener("click", async () => {
    const username = $("loginUsername").value.trim();
    const password = $("loginPassword").value;
    const err = $("loginErr");
    err.classList.add("hidden");
    if (!username || !password) {
      err.textContent = "Please enter both username and password.";
      err.classList.remove("hidden"); return;
    }
    try {
      const { data: profile, error: profileError } = await supabase
        .from("profiles").select("email, id").eq("username", username).maybeSingle();
      if (profileError) throw profileError;
      if (!profile) { err.textContent = "Username does not exist."; err.classList.remove("hidden"); return; }

      const { error: authError } = await supabase.auth.signInWithPassword({ email: profile.email, password });
      if (authError) throw authError;

      // Check suspension / deletion
      const { data: fullProfile } = await supabase
        .from("profiles").select("is_suspended, suspended_until, is_pending_delete, deleted_at, admin_note")
        .eq("id", profile.id).single();

      if (fullProfile?.is_pending_delete) {
        const deletedAt = new Date(fullProfile.deleted_at);
        const now = new Date();
        const diffMs = now - deletedAt;
        const twoHoursMs = 2 * 60 * 60 * 1000;
        if (diffMs >= twoHoursMs) {
          await supabase.from("profiles").delete().eq("id", profile.id);
          err.textContent = "Account doesn't exist. Sign up to proceed.";
          err.classList.remove("hidden"); return;
        } else {
          const remaining = twoHoursMs - diffMs;
          const hours = Math.floor(remaining / 3600000);
          const minutes = Math.floor((remaining % 3600000) / 60000);
          err.textContent = `Your account has been deleted by an admin. Note: "${fullProfile.admin_note}". Permanently removed in ${hours}h ${minutes}m.`;
          err.classList.remove("hidden"); return;
        }
      }
      if (fullProfile?.is_suspended) {
        const suspendedUntil = new Date(fullProfile.suspended_until);
        if (suspendedUntil > new Date()) {
          const diffMs = suspendedUntil - new Date();
          const days = Math.floor(diffMs / (1000*60*60*24));
          const hours = Math.floor((diffMs % (1000*60*60*24)) / (1000*60*60));
          const minutes = Math.floor((diffMs % (1000*60*60)) / (1000*60));
          err.textContent = `Your account is suspended. Note: "${fullProfile.admin_note}". Remaining: ${days}d ${hours}h ${minutes}m.`;
          err.classList.remove("hidden"); return;
        } else {
          await supabase.from("profiles").update({ is_suspended: false, suspended_until: null, admin_note: null }).eq("id", profile.id);
        }
      }

      window.location.href = "index.html";
    } catch (e) {
      err.textContent = e.message || "Login failed.";
      err.classList.remove("hidden");
    }
  });

  // --- Signup ---
  $("signupSubmit").addEventListener("click", async () => {
    const firstName = $("signupFirstName").value.trim();
    const lastName = $("signupLastName").value.trim();
    const country = $("signupCountry").value.trim();
    const username = $("signupUsername").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;
    const day = parseInt(dobDay.value);
    const month = parseInt(dobMonth.value);
    const year = parseInt(dobYear.value);

    const err = $("signupErr");
    const success = $("signupSuccess");
    err.classList.add("hidden"); success.classList.add("hidden");

    if (!firstName || !lastName || !country || !username || !email || !password || !day || !month || !year) {
      err.textContent = "All fields are required.";
      err.classList.remove("hidden"); return;
    }
    const age = parseInt(signupAge.value, 10);
    if (isNaN(age) || age < 14) {
      err.textContent = "You must be at least 14 years old.";
      err.classList.remove("hidden"); return;
    }
    if (!isValidPassword(password)) {
      err.textContent = "Password must be at least 8 characters with 1 letter, 1 number, and 1 special character.";
      err.classList.remove("hidden"); return;
    }
    const fullName = `${firstName} ${lastName}`;
    const dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    try {
      const { data: existingUser } = await supabase.from("profiles").select("id").eq("username", username).maybeSingle();
      if (existingUser) { err.textContent = "Username is already taken."; err.classList.remove("hidden"); return; }

      const { data: authData, error: authError } = await supabase.auth.signUp({
        email, password,
        options: { data: { username, full_name: fullName }, emailRedirectTo: window.location.origin + "/index.html" }
      });
      if (authError) throw authError;
      if (!authData.user) throw new Error("Signup failed.");

      const { error: insertError } = await supabase.from("profiles").insert({
        id: authData.user.id, username, full_name: fullName, age, dob, country, email
      });
      if (insertError) throw new Error("Profile creation failed: " + insertError.message);

      success.textContent = "Account created! You can now log in.";
      success.classList.remove("hidden");
      // Clear form
      $("signupFirstName").value = $("signupLastName").value = $("signupCountry").value = $("signupUsername").value = "";
      $("signupEmail").value = $("signupPassword").value = "";
      dobDay.value = dobMonth.value = dobYear.value = "";
      populateDays();
      signupAge.value = "";
      signupAge.style.borderColor = '#222'; signupAge.style.color = '#f1f1f1';
      ageError.classList.add("hidden");
    } catch (e) {
      err.textContent = e.message || "Registration failed.";
      err.classList.remove("hidden");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const loginActive = tabLogin.classList.contains("active");
      if (loginActive) $("loginSubmit").click();
      else $("signupSubmit").click();
    }
  });

  // Auto-refresh on reconnect
  window.addEventListener("online", () => setTimeout(() => location.reload(), 1000));
})();
</script>
</body>
</html>
