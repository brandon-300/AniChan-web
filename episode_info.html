<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Episode</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  /* Header */
  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .brand{font-weight:800;font-size:20px}
  .brand span{color:var(--accent)}
  .header-left{display:flex;align-items:center;gap:12px}
  .back-btn{
    background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;
    padding:0 8px;line-height:1;
  }
  .header-actions{display:flex;align-items:center;gap:8px}

  .menu-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:24px;color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{border-color:var(--accent);background:var(--card)}

  .nav-dropdown{
    display:none;background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    padding:16px 16px 20px;
  }
  .nav-dropdown.open{display:block}
  .nav-dropdown .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--text);
    transition:background .15s;cursor:pointer;
  }
  .nav-dropdown .nav-item:hover{background:var(--panel);color:var(--accent)}
  .nav-dropdown .nav-item .material-symbols-outlined{font-size:20px}
  .nav-divider{height:1px;background:var(--border);margin:8px 0}

  .nav-search-wrap{margin-top:8px;position:relative}
  .nav-search-wrap input{
    width:100%;padding:12px 14px 12px 44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none;
  }
  .nav-search-wrap input:focus{border-color:var(--accent)}
  .nav-search-wrap .ico{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;
    pointer-events:none;
  }

  .container{max-width:1100px;margin:0 auto;padding:16px 16px 40px;width:100%;flex:1;}

  /* Video player frame */
  .video-frame{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:16px;overflow:hidden;
    margin-bottom:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .video-overlay{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:rgba(255,255,255,0.6);
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
    transition:color 0.2s;
  }
  .video-overlay .material-symbols-outlined{
    font-size:48px;
  }
  .video-overlay span{
    font-size:15px;font-weight:500;letter-spacing:0.3px;
  }
  .video-frame:hover .video-overlay{color:rgba(255,255,255,0.9);}

  /* Control row */
  .ctrl-row{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;
  }
  .pill-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:40px;
    padding:10px 18px;font-size:14px;font-weight:600;color:var(--text);
    display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;transition:background 0.15s,border-color 0.15s;
    white-space:nowrap;
  }
  .pill-btn:hover{border-color:var(--accent);background:var(--card);}
  .pill-btn .material-symbols-outlined{font-size:18px;}
  .subtitle-badge{
    background:rgba(81,218,211,0.12);border:1px solid rgba(81,218,211,0.35);
    color:var(--accent);border-radius:20px;padding:4px 12px;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;
    gap:4px;white-space:nowrap;
  }
  .quality-text{font-size:13px;color:var(--muted);margin-left:8px;}

  /* Download button */
  .download-btn{
    width:100%;padding:12px 18px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
    margin-bottom:24px;
  }
  .download-btn:hover{border-color:var(--accent);background:var(--card);}

  /* Metadata section */
  .meta-heading{
    font-size:22px;font-weight:700;margin-bottom:8px;color:#fff;
  }
  .meta-detail{
    font-size:14px;color:var(--muted);line-height:1.6;
  }
  .meta-detail .accent{color:var(--accent);font-weight:600;}

  /* Empty state */
  .empty-state{
    text-align:center;padding:40px;color:var(--muted);
  }
</style>
</head>
<body>
  <header class="app">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="brand">Ani<span>Chan</span></div>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- Hamburger inserted by JS -->
    </div>
  </header>

  <div class="nav-dropdown" id="navDropdown">
    <div class="nav-item" id="navHome"><span class="material-symbols-outlined">home</span> Home</div>
    <div class="nav-item" id="navAnime"><span class="material-symbols-outlined">library_books</span> Anime</div>
    <div class="nav-search-wrap" id="navSearchWrap">
      <span class="ico material-symbols-outlined">search</span>
      <input type="text" id="navSearchInput" placeholder="Search" autocomplete="off" />
    </div>
  </div>

  <main class="container">
    <!-- Video Player (static overlay) -->
    <div class="video-frame" id="videoFrame">
      <div class="video-overlay">
        <span class="material-symbols-outlined">replay</span>
        <span>Click to load</span>
      </div>
    </div>

    <!-- Control row -->
    <div class="ctrl-row">
      <div class="pill-btn" id="serverBtn">
        <span>Supabase</span>
        <span class="material-symbols-outlined">arrow_drop_down</span>
      </div>
      <div class="pill-btn" id="episodeBtn">
        <span id="currentEpLabel">Episode 1</span>
        <span class="material-symbols-outlined">arrow_drop_down</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
        <span class="subtitle-badge">Eng</span>
        <span class="quality-text">AniChan · 720p</span>
      </div>
    </div>

    <!-- Download button (static) -->
    <button class="download-btn" id="downloadBtn">
      <span class="material-symbols-outlined">download</span> Download
    </button>

    <!-- Metadata section -->
    <h2 class="meta-heading" id="epMetaTitle">Episodes</h2>
    <div class="meta-detail" id="epMetaDetail">Loading...</div>
  </main>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const animeId = params.get('anime_id');
  const epNum = parseInt(params.get('ep')) || 1;

  if (!animeId) {
    $('epMetaTitle').textContent = 'Missing anime ID';
    $('epMetaDetail').textContent = 'Please go back and select an anime.';
    return;
  }

  // ── Hamburger menu ──
  (function renderHamburger() {
    const container = $("headerActions");
    const menuBtn = document.createElement("button");
    menuBtn.className = "menu-btn";
    menuBtn.innerHTML = '<span class="material-symbols-outlined">menu</span>';
    menuBtn.addEventListener("click", () => {
      $("navDropdown").classList.toggle("open");
    });
    container.appendChild(menuBtn);
  })();

  $("navHome").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "index.html"; });
  $("navAnime").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "anime.html"; });

  // ── Fetch anime data ──
  async function loadEpisodeInfo() {
    const { data, error } = await sb.from('anime').select('*').eq('id', animeId).single();
    if (error || !data) {
      $('epMetaTitle').textContent = 'Anime not found';
      $('epMetaDetail').textContent = '';
      return;
    }

    // Update episode dropdown label
    $('currentEpLabel').textContent = `Episode ${epNum}`;

    // Build metadata heading
    const title = data.title_en || data.title || 'Untitled';
    $('epMetaTitle').textContent = `${title} - ${epNum}`;

    // Build meta detail line: e.g., "TV - 11 Episodes (Finished Airing)" and "Winter 2026"
    let lines = [];
    const type = data.type || '?';
    const eps = data.ep_total != null ? data.ep_total : '?';
    const status = data.status || '';
    const statusLabel = status === 'Aired' ? 'Finished Airing' : status;
    lines.push(`${type} - ${eps} Episodes${statusLabel ? ' (' + statusLabel + ')' : ''}`);

    // Compute season from aired_from
    if (data.aired_from) {
      const d = new Date(data.aired_from);
      const month = d.getMonth();
      const year = d.getFullYear();
      let season = '';
      if (month >= 0 && month <= 2) season = 'Winter';
      else if (month >= 3 && month <= 5) season = 'Spring';
      else if (month >= 6 && month <= 8) season = 'Summer';
      else season = 'Fall';
      lines.push(`${season} ${year}`);
    }

    $('epMetaDetail').innerHTML = lines.join('<br>');
  }

  document.addEventListener("DOMContentLoaded", loadEpisodeInfo);
})();
</script>
</body>
</html>
