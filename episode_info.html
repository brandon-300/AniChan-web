<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Episode</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  /* Header */
  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:50;
  }
  .brand{font-weight:800;font-size:20px}
  .brand span{color:var(--accent)}
  .header-left{display:flex;align-items:center;gap:12px}
  .back-btn{
    background:none;border:none;color:var(--accent);font-size:24px;cursor:pointer;
    padding:0 8px;line-height:1;
  }
  .header-actions{display:flex;align-items:center;gap:8px}

  .menu-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:24px;color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{border-color:var(--accent);background:var(--card)}

  .nav-dropdown{
    display:none;background:rgba(26,26,26,.85);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    padding:16px 16px 20px;
  }
  .nav-dropdown.open{display:block}
  .nav-dropdown .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-radius:10px;font-size:14px;font-weight:500;color:var(--text);
    transition:background .15s;cursor:pointer;
  }
  .nav-dropdown .nav-item:hover{background:var(--panel);color:var(--accent)}
  .nav-dropdown .nav-item .material-symbols-outlined{font-size:20px}
  .nav-divider{height:1px;background:var(--border);margin:8px 0}

  .nav-search-wrap{margin-top:8px;position:relative}
  .nav-search-wrap input{
    width:100%;padding:12px 14px 12px 44px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none;
  }
  .nav-search-wrap input:focus{border-color:var(--accent)}
  .nav-search-wrap .ico{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;
    pointer-events:none;
  }

  .broadcast.hidden{display:none}
  .broadcast{
    margin:16px 0;padding:14px 16px;border-radius:16px;
    background:rgba(81,218,211,.08);border:1px solid rgba(81,218,211,.25);color:#dffaf8;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:12px;align-items:flex-start
  }

  .container{max-width:1100px;margin:0 auto;padding:16px 16px 40px;width:100%;flex:1;}

  /* Video player frame */
  .video-frame{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:16px;overflow:hidden;
    margin-bottom:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .video-overlay{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:rgba(255,255,255,0.6);
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
    transition:color 0.2s;
  }
  .video-overlay .material-symbols-outlined{
    font-size:48px;
  }
  .video-overlay span{
    font-size:15px;font-weight:500;letter-spacing:0.3px;
  }
  .video-frame:hover .video-overlay{color:rgba(255,255,255,0.9);}

  /* ── Custom Dropdowns ── */
  .custom-dropdown {
    position: relative;
    flex:1;
  }
  .custom-dropdown .dropdown-toggle {
    width:100%;
    background:var(--panel);border:1px solid var(--border);border-radius:40px;
    padding:10px 18px;font-size:14px;font-weight:600;color:var(--text);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    cursor:pointer;transition:background 0.15s,border-color 0.15s;
    white-space:nowrap;
  }
  .custom-dropdown .dropdown-toggle:hover { border-color:var(--accent); background:var(--card); }
  .custom-dropdown .dropdown-toggle .material-symbols-outlined { font-size:18px; }
  .custom-dropdown .dropdown-menu {
    position:absolute;top:calc(100% + 4px);left:0;right:0;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    list-style:none;padding:4px;display:none;z-index:100;
    max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  .custom-dropdown .dropdown-menu.open { display:block; }
  .custom-dropdown .dropdown-menu li {
    padding:10px 14px;border-radius:8px;font-size:14px;font-weight:500;
    cursor:pointer;transition:background 0.1s;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .custom-dropdown .dropdown-menu li:hover { background:var(--panel);color:var(--accent); }
  .custom-dropdown .dropdown-menu li.active { color:var(--accent); font-weight:700; }

  /* Subtitle badge inside dropdown items */
  .dropdown-menu li .mini-badge {
    background:rgba(81,218,211,0.12);border:1px solid rgba(81,218,211,0.35);
    color:var(--accent);border-radius:20px;padding:2px 8px;
    font-size:11px;font-weight:700;margin-left:auto;
  }

  /* Subtitle badge in the quality toggle button */
  .toggle-badge {
    background:rgba(81,218,211,0.12);border:1px solid rgba(81,218,211,0.35);
    color:var(--accent);border-radius:20px;padding:2px 8px;
    font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;
  }

  /* Row structures */
  .ctrl-row-split {
    display:flex; gap:10px; margin-bottom:10px;
  }
  .ctrl-row-center {
    display:flex; justify-content:center; align-items:center;
    margin-bottom:10px;
  }
  .ctrl-row-center .custom-dropdown {
    flex:0 1 auto;
    min-width:280px;
  }
  .ctrl-row-center .dropdown-toggle {
    justify-content:center;
  }
  .download-btn {
    width:100%; padding:12px 18px; border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
    margin-bottom:24px;
  }
  .download-btn:hover{border-color:var(--accent);background:var(--card);}

  /* ── Metadata Footer (poster + text) ── */
  .meta-footer {
    display:flex; gap:16px; align-items:flex-start;
    padding-top:12px;
  }
  .meta-poster-link {
    display:block; flex-shrink:0;
    width:100px; height:140px;
    border-radius:0;
  }
  .meta-poster {
    width:100%; height:100%; object-fit:cover;
    border-radius:0; background:var(--panel);
    border:1px solid var(--border);
  }
  .meta-text {
    flex:1; min-width:0;
  }
  .meta-text .show-title {
    font-size:20px; font-weight:700; color:#fff; margin-bottom:4px;
    line-height:1.3; text-decoration:none; display:block;
    transition:color 0.15s;
  }
  .meta-text .show-title:hover { color:var(--accent); }
  .meta-text .ep-metrics {
    font-size:14px; color:var(--muted); margin-bottom:4px;
  }
  .meta-text .release-season {
    font-size:14px; color:var(--muted);
  }
</style>
</head>
<body>
  <header class="app">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="brand">Ani<span>Chan</span></div>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- Hamburger inserted by JS -->
    </div>
  </header>

  <div class="nav-dropdown" id="navDropdown">
    <div class="nav-item" id="navHome"><span class="material-symbols-outlined">home</span> Home</div>
    <div class="nav-item" id="navAnime"><span class="material-symbols-outlined">library_books</span> Anime</div>
    <div class="nav-search-wrap" id="navSearchWrap">
      <span class="ico material-symbols-outlined">search</span>
      <input type="text" id="navSearchInput" placeholder="Search" autocomplete="off" />
    </div>
  </div>

  <main class="container">
    <!-- Broadcast message (hidden if empty) -->
    <div class="broadcast hidden" id="broadcast">
      <span class="material-symbols-outlined" style="font-size:20px">campaign</span>
      <div style="font-size:14px;line-height:1.45" id="broadcastMsg"></div>
    </div>

    <!-- Video Player (static overlay, no JS for video) -->
    <div class="video-frame" id="videoFrame">
      <div class="video-overlay">
        <span class="material-symbols-outlined">replay</span>
        <span>Click to load</span>
      </div>
    </div>

    <!-- Control Rows -->
    <!-- Row 1: Server & Episode selectors -->
    <div class="ctrl-row-split">
      <!-- Server dropdown -->
      <div class="custom-dropdown" id="serverDropdown">
        <button class="dropdown-toggle" id="serverToggle">
          <span id="serverLabel">Supabase</span>
          <span class="material-symbols-outlined">arrow_drop_down</span>
        </button>
        <ul class="dropdown-menu" id="serverMenu">
          <li data-value="supabase" class="active">Supabase</li>
        </ul>
      </div>
      <!-- Episode dropdown -->
      <div class="custom-dropdown" id="episodeDropdown">
        <button class="dropdown-toggle" id="episodeToggle">
          <span id="episodeLabel">Episode 1</span>
          <span class="material-symbols-outlined">arrow_drop_down</span>
        </button>
        <ul class="dropdown-menu" id="episodeMenu"></ul>
      </div>
    </div>

    <!-- Row 2: Quality & Subtitle selector (now a custom dropdown) -->
    <div class="ctrl-row-center">
      <div class="custom-dropdown" id="qualityDropdown">
        <button class="dropdown-toggle" id="qualityToggle">
          <span id="qualityLabel">AniChan · 720p</span>
          <span class="toggle-badge" id="qualityBadge">Eng</span>
          <span class="material-symbols-outlined">arrow_drop_down</span>
        </button>
        <ul class="dropdown-menu" id="qualityMenu">
          <li data-value="1080p-eng" class="active">
            <span>AniChan · 1080p</span>
            <span class="mini-badge">Eng</span>
          </li>
          <li data-value="720p-eng">
            <span>AniChan · 720p</span>
            <span class="mini-badge">Eng</span>
          </li>
          <li data-value="360p-eng">
            <span>AniChan · 360p</span>
            <span class="mini-badge">Eng</span>
          </li>
          <li data-value="1080p-raw">
            <span>AniChan · 1080p</span>
          </li>
          <li data-value="720p-raw">
            <span>AniChan · 720p</span>
          </li>
          <li data-value="360p-raw">
            <span>AniChan · 360p</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Row 3: Download button (static, no JS for functionality) -->
    <button class="download-btn" id="downloadBtn">
      <span class="material-symbols-outlined">download</span> Download
    </button>

    <!-- Metadata Footer (poster + details) -->
    <div class="meta-footer">
      <a class="meta-poster-link" id="posterLink" href="#">
        <img class="meta-poster" id="posterImg" src="" alt="Poster" />
      </a>
      <div class="meta-text">
        <a class="show-title" id="showTitleLink" href="#">Loading...</a>
        <div class="ep-metrics" id="epMetrics"></div>
        <div class="release-season" id="releaseSeason"></div>
      </div>
    </div>
  </main>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const animeId = params.get('anime_id');
  let epNum = parseInt(params.get('ep')) || 1;

  if (!animeId) {
    $('showTitleLink').textContent = 'Missing anime ID';
    $('showTitleLink').removeAttribute('href');
    $('posterLink').removeAttribute('href');
    return;
  }

  // ═══════════════════════════════════════════
  //  LIVE SUSPENSION + DELETION CHECK (10 sec)
  // ═══════════════════════════════════════════
  setInterval(async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) return;
    const { data } = await sb
      .from('profiles')
      .select('is_suspended, suspended_until, admin_note, is_pending_delete, deleted_at')
      .eq('id', session.user.id)
      .maybeSingle();

    if (data?.is_suspended && data.suspended_until && new Date(data.suspended_until) > new Date()) {
      alert(`Your account has been suspended.\n\n${data.admin_note || ''}`);
      await sb.auth.signOut();
      window.location.href = 'user_login.html';
      return;
    }

    if (data?.is_pending_delete && data.deleted_at) {
      alert(`Your account has been scheduled for deletion.\n\n${data.admin_note || ''}`);
      await sb.auth.signOut();
      window.location.href = 'user_login.html';
    }
  }, 10000);

  // ── Hamburger menu ──
  (function renderHamburger() {
    const container = $("headerActions");
    const menuBtn = document.createElement("button");
    menuBtn.className = "menu-btn";
    menuBtn.innerHTML = '<span class="material-symbols-outlined">menu</span>';
    menuBtn.addEventListener("click", () => {
      $("navDropdown").classList.toggle("open");
    });
    container.appendChild(menuBtn);
  })();

  $("navHome").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "index.html"; });
  $("navAnime").addEventListener("click", () => { $("navDropdown").classList.remove("open"); location.href = "anime.html"; });

  // ── Broadcast ──
  async function loadBroadcast() {
    const { data } = await sb.from("settings").select("value").eq("key","broadcast_message").maybeSingle();
    const msg = (data && data.value || "").trim();
    if (msg) { $("broadcastMsg").textContent = msg; $("broadcast").classList.remove("hidden"); }
    else { $("broadcast").classList.add("hidden"); }
  }

  // ── Generic Custom Dropdown Logic ──
  function setupDropdown(toggleId, menuId, labelId, badgeId, onSelect) {
    const toggle = $(toggleId);
    const menu = $(menuId);
    const label = $(labelId);
    const badge = badgeId ? $(badgeId) : null;

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      // close other menus
      document.querySelectorAll('.dropdown-menu.open').forEach(m => {
        if (m !== menu) m.classList.remove('open');
      });
      menu.classList.toggle('open');
    });

    menu.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      const value = li.dataset.value;

      // Extract the main text (first span) and optional badge text
      const mainSpan = li.querySelector('span');
      const badgeSpan = li.querySelector('.mini-badge');
      const mainText = mainSpan ? mainSpan.textContent.trim() : li.textContent.trim();
      const badgeText = badgeSpan ? badgeSpan.textContent.trim() : '';

      // Update the toggle button
      label.textContent = mainText;
      if (badge) {
        if (badgeText) {
          badge.textContent = badgeText;
          badge.style.display = 'inline-flex';
        } else {
          badge.style.display = 'none';
        }
      }

      menu.classList.remove('open');
      // Update active class
      menu.querySelectorAll('li').forEach(l => l.classList.remove('active'));
      li.classList.add('active');
      if (onSelect) onSelect(value, mainText, badgeText);
    });

    // Close on outside click
    document.addEventListener('click', () => {
      menu.classList.remove('open');
    });
  }

  // ── Server dropdown ──
  setupDropdown('serverToggle', 'serverMenu', 'serverLabel', null, (val) => {
    console.log('Server selected:', val);
    // future server switching
  });

  // ── Quality dropdown ──
  setupDropdown('qualityToggle', 'qualityMenu', 'qualityLabel', 'qualityBadge', (val, label, badge) => {
    console.log('Quality selected:', val, badge);
    // future quality switching
  });

  // ── Episode dropdown ──
  let episodeLabel = $('episodeLabel');
  let episodeMenu = $('episodeMenu');

  function goToEpisode(newEp) {
    const url = new URL(window.location);
    url.searchParams.set('ep', newEp);
    window.location.href = url.toString();
  }

  // Initial setup with placeholder
  setupDropdown('episodeToggle', 'episodeMenu', 'episodeLabel', null, (value) => {
    const ep = parseInt(value);
    if (!isNaN(ep)) goToEpisode(ep);
  });

  // ── Fetch anime data and populate everything ──
  async function loadEpisodeInfo() {
    const { data, error } = await sb.from('anime').select('*').eq('id', animeId).single();
    if (error || !data) {
      $('showTitleLink').textContent = 'Anime not found';
      $('showTitleLink').removeAttribute('href');
      $('posterLink').removeAttribute('href');
      return;
    }

    const anime = data;

    // Set poster (clickable link)
    const fallbackSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><rect width="100" height="140" fill="#1a1a1a"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle" dominant-baseline="middle">No img</text></svg>');
    $('posterImg').src = anime.image_url || fallbackSvg;
    $('posterImg').onerror = () => { $('posterImg').src = fallbackSvg; };
    $('posterLink').href = `anime_info.html?id=${animeId}`;

    // Title — clickable, links back to anime_info.html
    const title = anime.title_en || anime.title || 'Untitled';
    $('showTitleLink').textContent = title + ' - ' + epNum;
    $('showTitleLink').href = `anime_info.html?id=${animeId}`;

    // Episode metrics
    const type = anime.type || '?';
    const epsTotal = anime.ep_total != null ? anime.ep_total : '?';
    const status = anime.status || '';
    let statusText = '';
    if (status === 'Aired') statusText = 'Finished Airing';
    else if (status === 'Currently Airing') statusText = 'Currently Airing';
    else if (status === 'Not yet aired') statusText = 'Not yet aired';
    $('epMetrics').textContent = `${type} - ${epsTotal} Episodes${statusText ? ' (' + statusText + ')' : ''}`;

    // Release season
    let seasonText = '';
    if (anime.aired_from) {
      const d = new Date(anime.aired_from);
      const month = d.getMonth();
      const year = d.getFullYear();
      let season = '';
      if (month >= 0 && month <= 2) season = 'Winter';
      else if (month >= 3 && month <= 5) season = 'Spring';
      else if (month >= 6 && month <= 8) season = 'Summer';
      else season = 'Fall';
      seasonText = `${season} ${year}`;
    }
    $('releaseSeason').textContent = seasonText;

    // Populate episode dropdown
    const total = anime.ep_total || 0;
    episodeMenu.innerHTML = '';
    for (let i = 1; i <= total; i++) {
      const li = document.createElement('li');
      li.dataset.value = i;
      li.textContent = `Episode ${i}`;
      if (i === epNum) li.classList.add('active');
      episodeMenu.appendChild(li);
    }

    // Sync the episode label to the current episode
    episodeLabel.textContent = `Episode ${epNum}`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadBroadcast();
    loadEpisodeInfo();
  });
})();
</script>
</body>
</html>
