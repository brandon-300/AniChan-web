<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Find Friends</title>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<!-- i18n -->
<script src="i18n.js"></script>
<style>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          accent: '#51dad3',
          accent2: '#ffb597',
          dark: '#0d0d0d',
          card: '#161616',
          panel: '#1a1a1a',
          border: '#222222',
          muted: '#9aa0a6',
          danger: '#ff4757',
          success: '#2ed573',
          offline: '#555555'
        }
      }
    }
  }
  .glass { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
</style>
</head>
<body class="bg-dark text-white font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-card border-b border-border px-4 py-3 flex items-center justify-between">
    <div class="font-extrabold text-xl tracking-tight">Ani<span class="text-accent">Chan</span></div>
    <button id="backBtn" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-border bg-panel text-white hover:border-accent hover:bg-card transition">
      ← Back
    </button>
  </header>

  <!-- Main -->
  <main class="max-w-xl mx-auto px-4 py-6 w-full flex-1">
    <h2 class="text-2xl font-bold mb-5">Find Friends</h2>
    <div id="membersList" class="space-y-2"></div>
  </main>

  <footer class="text-center text-muted text-xs py-4 border-t border-border">AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUserId = null;

  $("backBtn").addEventListener("click", () => {
    window.location.href = "index.html";
  });

  async function loadMembers() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "user_login.html";
      return;
    }
    currentUserId = session.user.id;

    const { data: users, error } = await supabase
      .from("profiles")
      .select("id, username, full_name, avatar_url, is_online")
      .neq("id", currentUserId)
      .order("username");

    const container = $("membersList");
    if (error) {
      container.innerHTML = '<div class="text-center py-8 text-muted">Failed to load members.</div>';
      return;
    }
    if (!users || users.length === 0) {
      container.innerHTML = '<div class="text-center py-8 text-muted">No other members yet.</div>';
      return;
    }

    container.innerHTML = "";
    users.forEach(user => {
      const card = document.createElement("div");
      card.className = "flex items-center gap-4 p-4 bg-card border border-border rounded-2xl hover:border-accent/50 transition-all duration-200";
      card.innerHTML = `
        <a href="profile.html?user=${user.id}" class="flex-shrink-0">
          <img class="w-12 h-12 rounded-full object-cover border-2 border-border hover:border-accent transition" src="${user.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        </a>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-base">${user.full_name || user.username}</div>
          <div class="text-sm text-muted flex items-center gap-1.5 mt-0.5">
            @${user.username}
            <span class="inline-block w-2 h-2 rounded-full ${user.is_online ? 'bg-success' : 'bg-offline'}"></span>
            <span class="text-xs">${user.is_online ? 'Online' : 'Offline'}</span>
          </div>
        </div>
        <button class="message-btn px-4 py-2 rounded-xl bg-accent text-black text-xs font-bold hover:brightness-110 transition" data-userid="${user.id}">Message</button>
      `;
      container.appendChild(card);
    });

    // Message button event listeners
    document.querySelectorAll(".message-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const otherUserId = e.currentTarget.dataset.userid;
        await startChat(otherUserId);
      });
    });
  }

  async function startChat(otherUserId) {
    if (!currentUserId || !otherUserId) return;

    const { data: existing } = await supabase
      .from("chat_rooms")
      .select("id")
      .or(`and(user_one_id.eq.${currentUserId},user_two_id.eq.${otherUserId}),and(user_one_id.eq.${otherUserId},user_two_id.eq.${currentUserId})`)
      .maybeSingle();

    if (existing) {
      window.location.href = "chat.html?room=" + existing.id;
    } else {
      const { data: newRoom, error } = await supabase
        .from("chat_rooms")
        .insert({ user_one_id: currentUserId, user_two_id: otherUserId })
        .select("id")
        .single();
      if (error) {
        alert("Could not start chat.");
        return;
      }
      window.location.href = "chat.html?room=" + newRoom.id;
    }
  }

  document.addEventListener("DOMContentLoaded", loadMembers);
})();
</script>
</body>
</html>
