<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AniChan · Find Friends</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<link rel="icon" href="https://yphxpgssdqboufbgazwi.supabase.co/storage/v1/object/public/avatars/site-logo/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  :root{
    --bg:#131313; --card:#1a1a1a; --panel:#1f1f1f;
    --accent:#51dad3; --accent2:#ffb597;
    --text:#f1f1f1; --muted:#9aa0a6; --border:#2a2a2a;
    --danger:#ff4757; --success:#2ed573; --offline:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header.app{
    background:rgba(19,19,19,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{font-weight:800;font-size:20px;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .header-actions{display:flex;gap:8px}
  .btn{
    padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    cursor:pointer;transition:all .15s;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent);background:var(--card)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#0a2a28;font-weight:700}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:transparent;border-color:rgba(255,71,87,.25);color:var(--danger)}
  .btn.danger:hover{background:rgba(255,71,87,.12)}

  .container{max-width:700px;margin:24px auto;padding:0 16px;width:100%;flex:1}

  .glass-panel{
    background:rgba(26,26,26,.70);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:20px;padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .glass-panel h2{
    font-size:20px;font-weight:700;margin:0 0 20px;
    display:flex;align-items:center;gap:8px;
  }
  .glass-panel h2 .material-symbols-outlined{font-size:22px;color:var(--accent)}

  .member-card{
    display:flex;align-items:center;gap:16px;padding:16px;
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    margin-bottom:12px;transition:border-color .15s;
  }
  .member-card:hover{border-color:var(--accent)}
  .member-avatar-link{flex-shrink:0}
  .member-avatar{
    width:48px;height:48px;border-radius:50%;object-fit:cover;
    border:2px solid var(--border);transition:border-color .15s;
  }
  .member-avatar:hover{border-color:var(--accent)}
  .member-info{flex:1;min-width:0}
  .member-info strong{display:block;font-size:16px;margin-bottom:4px}
  .member-info strong a{color:var(--text);text-decoration:none;transition:color .15s}
  .member-info strong a:hover{color:var(--accent)}
  .member-info span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    display:inline-block;
  }
  .status-dot.online{background:var(--success)}
  .status-dot.offline{background:var(--offline)}
  .add-btn{
    padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;
    border:none;background:var(--accent);color:#0a2a28;
    cursor:pointer;transition:filter .15s;flex-shrink:0;
  }
  .add-btn:hover{filter:brightness(1.08)}
  .add-btn:disabled{opacity:0.7;cursor:not-allowed;filter:none}
  .message-btn{
    padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;
    border:1px solid var(--border);background:var(--panel);color:var(--text);
    cursor:pointer;transition:all .15s;flex-shrink:0;
  }
  .message-btn:hover{border-color:var(--accent);background:var(--card)}

  .empty-state{text-align:center;padding:40px;color:var(--muted)}

  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:currentColor;
    border-radius:50%;animation:spin .6s linear infinite;
    vertical-align:middle;flex-shrink:0;
  }

  footer{padding:16px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
</style>
</head>
<body>
  <header class="app">
    <div class="brand">Ani<span>Chan</span></div>
    <div class="header-actions">
      <button class="btn" id="friendsBtn"><span class="material-symbols-outlined" style="font-size:16px">people</span> Friends</button>
      <button class="btn" id="backBtn">← Back</button>
    </div>
  </header>

  <main class="container">
    <div class="glass-panel">
      <h2><span class="material-symbols-outlined">group</span> Find Friends</h2>
      <div id="membersList"></div>
    </div>
  </main>

  <footer>AniChan · powered by Supabase</footer>

<script>
(() => {
  const SUPABASE_URL = "https://yphxpgssdqboufbgazwi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKe5liyr5Mc-mumZbXLuZw_Pt3-KVm0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);
  const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a2a2a"/><text x="50%" y="55%" font-family="sans-serif" font-size="40" fill="#666" text-anchor="middle" dominant-baseline="middle">?</text></svg>'
  );

  let currentUserId = null;
  let friendsSet = new Set();
  let sentRequests = new Set();   // IDs we already sent a pending request to

  // Suspension + deletion check
  setInterval(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user) return;
    const { data } = await supabase
      .from('profiles')
      .select('is_suspended, suspended_until, admin_note, is_pending_delete, deleted_at')
      .eq('id', session.user.id)
      .maybeSingle();
    if (data?.is_suspended && data.suspended_until && new Date(data.suspended_until) > new Date()) {
      alert(`Your account has been suspended.\n\n${data.admin_note || ''}`);
      await supabase.auth.signOut();
      window.location.href = 'user_login.html';
      return;
    }
    if (data?.is_pending_delete && data.deleted_at) {
      alert(`Your account has been scheduled for deletion.\n\n${data.admin_note || ''}`);
      await supabase.auth.signOut();
      window.location.href = 'user_login.html';
    }
  }, 10000);

  $("backBtn").addEventListener("click", () => { window.location.href = "index.html"; });
  $("friendsBtn").addEventListener("click", () => { window.location.href = "friend_list.html"; });

  async function loadMembers() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = "user_login.html"; return; }
    currentUserId = session.user.id;

    // Fetch all users except self, newest first
    const { data: users, error } = await supabase
      .from("profiles")
      .select("id, username, full_name, avatar_url, is_online")
      .neq("id", currentUserId)
      .order("created_at", { ascending: false });

    if (error) {
      $("membersList").innerHTML = '<div class="empty-state">Failed to load members.</div>';
      return;
    }

    // Blocked users
    const { data: blockedRows } = await supabase
      .from("blocked_users")
      .select("user_id, blocked_user_id")
      .or(`user_id.eq.${currentUserId},blocked_user_id.eq.${currentUserId}`);
    const blockedIds = new Set();
    if (blockedRows) {
      for (const row of blockedRows) {
        if (row.user_id === currentUserId) blockedIds.add(row.blocked_user_id);
        else if (row.blocked_user_id === currentUserId) blockedIds.add(row.user_id);
      }
    }

    // Friends (accepted)
    const { data: friendsData } = await supabase
      .from("friends")
      .select("user_id, friend_id")
      .or(`user_id.eq.${currentUserId},friend_id.eq.${currentUserId}`);
    friendsSet.clear();
    if (friendsData) {
      for (const row of friendsData) {
        if (row.user_id === currentUserId) friendsSet.add(row.friend_id);
        else if (row.friend_id === currentUserId) friendsSet.add(row.user_id);
      }
    }

    // Pending outgoing requests
    const { data: sentData } = await supabase
      .from("friend_requests")
      .select("receiver_id")
      .eq("sender_id", currentUserId)
      .eq("status", "pending");
    sentRequests.clear();
    if (sentData) {
      sentData.forEach(r => sentRequests.add(r.receiver_id));
    }

    const filteredUsers = users.filter(u => !blockedIds.has(u.id));

    const container = $("membersList");
    if (!filteredUsers || filteredUsers.length === 0) {
      container.innerHTML = '<div class="empty-state">No one to add yet.</div>';
      return;
    }

    container.innerHTML = "";
    filteredUsers.forEach(user => {
      const isFriend = friendsSet.has(user.id);
      const requestSent = sentRequests.has(user.id);
      const card = document.createElement("div");
      card.className = "member-card";

      let buttonHtml = '';
      if (isFriend) {
        buttonHtml = `<button class="message-btn" data-userid="${user.id}">💬 Message</button>`;
      } else if (requestSent) {
        buttonHtml = `<button class="add-btn" disabled>Request Sent</button>`;
      } else {
        buttonHtml = `<button class="add-btn" data-userid="${user.id}"><span class="material-symbols-outlined" style="font-size:16px">person_add</span> Add</button>`;
      }

      card.innerHTML = `
        <a class="member-avatar-link" href="profile.html?user=${user.id}">
          <img class="member-avatar" src="${user.avatar_url || DEFAULT_AVATAR}" onerror="this.src='${DEFAULT_AVATAR}'" />
        </a>
        <div class="member-info">
          <strong><a href="profile.html?user=${user.id}">${user.full_name || user.username}</a></strong>
          <span>
            @${user.username}
            <span class="status-dot ${user.is_online ? 'online' : 'offline'}"></span>
            ${user.is_online ? 'Online' : 'Offline'}
          </span>
        </div>
        ${buttonHtml}
      `;
      container.appendChild(card);
    });

    // Add listeners
    document.querySelectorAll(".add-btn:not([disabled])").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const otherId = e.currentTarget.dataset.userid;
        await sendRequest(otherId);
      });
    });

    document.querySelectorAll(".message-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const otherId = e.currentTarget.dataset.userid;
        await startChat(otherId);
      });
    });
  }

  async function sendRequest(otherUserId) {
    if (!currentUserId || !otherUserId) return;
    const btn = document.querySelector(`.add-btn[data-userid="${otherUserId}"]`);
    if (!btn) return;
    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spinner"></span> Sending…`;

    const { error } = await supabase
      .from("friend_requests")
      .insert({ sender_id: currentUserId, receiver_id: otherUserId, status: "pending" });

    if (error) {
      alert("Could not send request: " + error.message);
      btn.disabled = false;
      btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px">person_add</span> Add`;
    } else {
      // Refresh to show "Request Sent"
      loadMembers();
    }
  }

  async function startChat(otherUserId) {
    if (!currentUserId || !otherUserId) return;
    const { data: existing } = await supabase
      .from("chat_rooms")
      .select("id")
      .or(`and(user_one_id.eq.${currentUserId},user_two_id.eq.${otherUserId}),and(user_one_id.eq.${otherUserId},user_two_id.eq.${currentUserId})`)
      .maybeSingle();

    if (existing) {
      window.location.href = "chat.html?room=" + existing.id;
    } else {
      const { data: newRoom, error } = await supabase
        .from("chat_rooms")
        .insert({ user_one_id: currentUserId, user_two_id: otherUserId })
        .select("id")
        .single();
      if (error) { alert("Could not start chat."); return; }
      window.location.href = "chat.html?room=" + newRoom.id;
    }
  }

  document.addEventListener("DOMContentLoaded", loadMembers);
})();
</script>
</body>
</html>
